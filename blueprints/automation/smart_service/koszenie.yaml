blueprint:
  name: Smart Service - automatyczne koszenie trawnika
  description: |
    Uniwersalne, bezpieczne uruchamianie robota koszącego z Home Assistant
    (dowolna integracja udostępniająca encję lawn_mower, np. Husqvarna Automower,
    Worx Landroid, Segway Navimow, Gardena, Mammotion, Ecovacs GOAT).

    Robot startuje, gdy jednocześnie:
    - kosiarka stoi w bazie i ma wystarczająco naładowaną baterię,
    - minął ustawiony odstęp od ostatniego koszenia (pomocnik z datą),
    - nie pada, a od ostatniego opadu minął czas schnięcia trawy (opcjonalnie),
    - prognoza godzinowa nie przewiduje deszczu w najbliższych godzinach (opcjonalnie),
    - temperatura jest w dozwolonym zakresie i nie ma rosy (opcjonalnie),
    - żadna blokada nie jest włączona (opcjonalnie).

    Domyślnie koszenie nie ma ograniczeń godzin ani dni. W sekcji "Harmonogram"
    i "Bezpieczeństwo" można włączyć: wybrane dni tygodnia, okno godzin,
    koszenie tylko za dnia (wysokość słońca) oraz wstrzymanie, gdy ktoś jest
    w ogrodzie. Koszenie tylko za dnia chroni jeże, które żerują po zmroku.

    W trakcie koszenia: deszcz odsyła robota do bazy, wejście kogoś do ogrodu
    wstrzymuje albo odsyła robota (jeśli włączone), a błąd, długa pauza,
    brak łączności i zbyt długie koszenie wysyłają jedno powiadomienie na zdarzenie.

    Wymagania:
    - pomocnik input_datetime (data i godzina) "Najwcześniejsze następne koszenie",
    - wyłączony harmonogram w aplikacji producenta (inaczej robot będzie kosił też sam).
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/koszenie.yaml
  input:
    kosiarka_sekcja:
      name: Kosiarka
      icon: mdi:robot-mower
      input:
        kosiarka:
          name: Kosiarka
          description: Encja lawn_mower robota koszącego.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        bateria:
          name: Bateria kosiarki (opcjonalnie)
          description: Sensor poziomu baterii w procentach. Puste = bez sprawdzania baterii.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        min_bateria:
          name: Minimalna bateria do startu
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        pomocnik_nastepne:
          name: Pomocnik - najwcześniejsze następne koszenie
          description: >-
            Pomocnik input_datetime z datą i godziną. Automatyzacja sama zapisuje
            w nim, kiedy najwcześniej wolno znowu kosić (po koszeniu i po nieudanym starcie).
          selector:
            entity:
              filter:
                - domain: input_datetime
    harmonogram_sekcja:
      name: Harmonogram
      icon: mdi:calendar-clock
      input:
        ogranicz_dni:
          name: Kosić tylko w wybrane dni
          description: Wyłączone = koszenie w każdy dzień tygodnia.
          default: false
          selector:
            boolean: {}
        dni:
          name: Dni koszenia
          description: Używane tylko po włączeniu opcji powyżej.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Poniedziałek
                  value: mon
                - label: Wtorek
                  value: tue
                - label: Środa
                  value: wed
                - label: Czwartek
                  value: thu
                - label: Piątek
                  value: fri
                - label: Sobota
                  value: sat
                - label: Niedziela
                  value: sun
        ogranicz_godziny:
          name: Kosić tylko w wybranych godzinach
          description: Wyłączone = start o dowolnej porze doby.
          default: false
          selector:
            boolean: {}
        okno_od:
          name: Początek okna koszenia
          description: Używane tylko po włączeniu opcji powyżej. Okno może przechodzić przez północ (np. 22:00-05:00).
          default: "09:00:00"
          selector:
            time: {}
        okno_do:
          name: Koniec okna koszenia (najpóźniejszy start)
          description: Używane tylko po włączeniu opcji "Kosić tylko w wybranych godzinach".
          default: "17:00:00"
          selector:
            time: {}
        odstep_godz:
          name: Odstęp między koszeniami
          description: Po potwierdzonym koszeniu (także uruchomionym ręcznie) następne nie wcześniej niż po tylu godzinach.
          default: 44
          selector:
            number:
              min: 6
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        ponowienie_godz:
          name: Ponowienie po nieudanym lub przerwanym starcie
          default: 2
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        min_czas_koszenia_min:
          name: Koszenie uznane za wykonane po
          description: Ile minut robot musi kosić bez przerwy, żeby uznać koszenie za wykonane.
          default: 20
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
    pogoda_sekcja:
      name: Pogoda
      icon: mdi:weather-partly-rainy
      input:
        czujniki_deszczu:
          name: Czujniki deszczu (opcjonalnie)
          description: >-
            Binary sensory opadu (stacja pogodowa, czujnik kosiarki). Stan "on" = pada.
            Czas schnięcia liczy się od ostatniej zmiany czujnika na "off".
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        schniecie_godz:
          name: Czas schnięcia trawy po deszczu
          default: 3
          selector:
            number:
              min: 0
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: slider
        prognoza:
          name: Prognoza pogody (opcjonalnie)
          description: Encja weather z prognozą godzinową. Puste = bez sprawdzania prognozy.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        prognoza_godz:
          name: Ile godzin naprzód sprawdzać prognozę
          default: 3
          selector:
            number:
              min: 1
              max: 8
              step: 1
              unit_of_measurement: h
              mode: slider
        max_opad_mm:
          name: Maksymalny prognozowany opad w tym czasie
          default: 0.2
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: mm
              mode: box
        max_prawdopodobienstwo:
          name: Maksymalne prawdopodobieństwo opadu
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        temperatura:
          name: Temperatura zewnętrzna (opcjonalnie)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        min_temp:
          name: Minimalna temperatura koszenia
          description: Chroni trawę przed koszeniem przy przymrozku i tuż po nim.
          default: 8
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_temp:
          name: Maksymalna temperatura koszenia
          default: 30
          selector:
            number:
              min: 20
              max: 40
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        wilgotnosc:
          name: Wilgotność powietrza (opcjonalnie)
          description: Razem z temperaturą wykrywa rosę (punkt rosy). Wymaga też czujnika temperatury.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        min_roznica_rosy:
          name: Minimalna różnica temperatury i punktu rosy
          default: 2.5
          selector:
            number:
              min: 0.5
              max: 6
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider
    bezpieczenstwo_sekcja:
      name: Bezpieczeństwo
      icon: mdi:shield-check
      input:
        tylko_za_dnia:
          name: Kosić tylko za dnia
          description: >-
            Start tylko, gdy słońce jest nad horyzontem (encja sun.sun).
            Zalecane: jeże i inne małe zwierzęta żerują po zmroku.
          default: false
          selector:
            boolean: {}
        slonce_min:
          name: Minimalna wysokość słońca
          description: Używane tylko po włączeniu opcji "Kosić tylko za dnia". 3° to około 20 minut po wschodzie i przed zachodem.
          default: 3
          selector:
            number:
              min: -6
              max: 30
              step: 1
              unit_of_measurement: "°"
              mode: slider
        sprawdzaj_ogrod:
          name: Nie kosić, gdy ktoś jest w ogrodzie
          default: false
          selector:
            boolean: {}
        czujniki_ogrodu:
          name: Czujniki "ktoś w ogrodzie"
          description: >-
            Czujniki ruchu lub obecności w ogrodzie, furtka, przełącznik "dzieci/psy w ogrodzie".
            Stan "on" = ktoś jest. Używane tylko po włączeniu opcji powyżej.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        reakcja_ogrod:
          name: Gdy ktoś wejdzie do ogrodu podczas koszenia
          default: dock
          selector:
            select:
              options:
                - label: Odeślij kosiarkę do bazy
                  value: dock
                - label: Wstrzymaj kosiarkę na trawniku
                  value: pause
                - label: Nic nie rób
                  value: none
        blokady:
          name: Blokady (opcjonalnie)
          description: Przełączniki lub czujniki, których stan "on" blokuje koszenie (np. impreza, urlop, święto).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
    nadzor_sekcja:
      name: Nadzór i powiadomienia
      icon: mdi:bell-alert
      input:
        deszcz_do_bazy:
          name: Odsyłaj do bazy, gdy zacznie padać
          default: true
          selector:
            boolean: {}
        pauza_alarm_min:
          name: Powiadom o pauzie trwającej dłużej niż
          default: 30
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider
        max_czas_koszenia_godz:
          name: Powiadom o koszeniu trwającym dłużej niż
          default: 6
          selector:
            number:
              min: 1
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        powiadom_o_starcie:
          name: Powiadamiaj także o starcie i zatrzymaniu przez deszcz lub ogród
          default: false
          selector:
            boolean: {}
        akcje_powiadomien:
          name: Akcje powiadomienia
          description: >-
            Akcje wykonywane przy każdym powiadomieniu, np. notify.mobile_app_telefon.
            Dostępne zmienne: {{ tytul }} i {{ tresc }}. Puste = bez powiadomień.
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: !input okno_od
    id: sprawdz
  - trigger: time_pattern
    minutes: "/10"
    id: sprawdz
  - trigger: state
    entity_id: !input kosiarka
    to: mowing
    for:
      minutes: !input min_czas_koszenia_min
    id: koszenie_potwierdzone
  - trigger: state
    entity_id: !input czujniki_deszczu
    from: "off"
    to: "on"
    id: deszcz
  - trigger: state
    entity_id: !input czujniki_ogrodu
    from: "off"
    to: "on"
    id: ogrod
  - trigger: state
    entity_id: !input kosiarka
    to: error
    for:
      minutes: 2
    id: blad
  - trigger: state
    entity_id: !input kosiarka
    to: paused
    for:
      minutes: !input pauza_alarm_min
    id: pauza
  - trigger: state
    entity_id: !input kosiarka
    to: unavailable
    for:
      minutes: 30
    id: niedostepna
  - trigger: state
    entity_id: !input kosiarka
    to: mowing
    for:
      hours: !input max_czas_koszenia_godz
    id: za_dlugo

variables:
  kosiarka: !input kosiarka
  bateria: !input bateria
  min_bateria: !input min_bateria
  pomocnik_nastepne: !input pomocnik_nastepne
  odstep_godz: !input odstep_godz
  ponowienie_godz: !input ponowienie_godz
  czujniki_deszczu: !input czujniki_deszczu
  schniecie_godz: !input schniecie_godz
  prognoza: !input prognoza
  prognoza_godz: !input prognoza_godz
  max_opad_mm: !input max_opad_mm
  max_prawdopodobienstwo: !input max_prawdopodobienstwo
  temperatura: !input temperatura
  min_temp: !input min_temp
  max_temp: !input max_temp
  wilgotnosc: !input wilgotnosc
  min_roznica_rosy: !input min_roznica_rosy
  ogranicz_dni: !input ogranicz_dni
  dni: !input dni
  ogranicz_godziny: !input ogranicz_godziny
  okno_od: !input okno_od
  okno_do: !input okno_do
  tylko_za_dnia: !input tylko_za_dnia
  slonce_min: !input slonce_min
  sprawdzaj_ogrod: !input sprawdzaj_ogrod
  czujniki_ogrodu: !input czujniki_ogrodu
  max_czas_koszenia_godz: !input max_czas_koszenia_godz
  reakcja_ogrod: !input reakcja_ogrod
  blokady: !input blokady
  deszcz_do_bazy: !input deszcz_do_bazy
  powiadom_o_starcie: !input powiadom_o_starcie
  nazwa: "{{ state_attr(kosiarka, 'friendly_name') or kosiarka }}"
  # Pusty tekst = wszystkie warunki startu spełnione (bez prognozy, sprawdzanej osobno).
  powod_blokady: >-
    {%- set brak = ['unknown', 'unavailable', 'none', ''] -%}
    {%- set teraz = now().timestamp() -%}
    {%- set nastepne = state_attr(pomocnik_nastepne, 'timestamp') | float(0) -%}
    {%- set t = states(temperatura) | float(none) if temperatura else none -%}
    {%- set rh = states(wilgotnosc) | float(none) if wilgotnosc else none -%}
    {%- set spread = none -%}
    {%- if t is not none and rh is not none and rh > 0 -%}
      {%- set g = (([rh, 100] | min) / 100) | log + 17.62 * t / (243.12 + t) -%}
      {%- set spread = t - 243.12 * g / (17.62 - g) -%}
    {%- endif -%}
    {%- set dzien = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] -%}
    {%- set od = today_at(okno_od) -%}
    {%- set do = today_at(okno_do) -%}
    {%- set w_oknie = (od <= now() < do) if od <= do else (now() >= od or now() < do) -%}
    {%- set ns = namespace(deszcz=false, mokro=0, ogrod=false, blokada=false) -%}
    {%- for e in czujniki_deszczu -%}
      {%- set s = states[e] -%}
      {%- if s is not none and s.state == 'on' -%}
        {%- set ns.deszcz = true -%}
      {%- elif s is not none and s.state == 'off' -%}
        {%- set do_suchej = s.last_changed.timestamp() + (schniecie_godz | float(3)) * 3600 -%}
        {%- if do_suchej > teraz and do_suchej > ns.mokro -%}
          {%- set ns.mokro = do_suchej -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {%- for e in czujniki_ogrodu -%}
      {%- if is_state(e, 'on') -%}{%- set ns.ogrod = true -%}{%- endif -%}
    {%- endfor -%}
    {%- for e in blokady -%}
      {%- if is_state(e, 'on') -%}{%- set ns.blokada = true -%}{%- endif -%}
    {%- endfor -%}
    {%- if ogranicz_dni and dzien not in dni -%}
      dziś nie jest dniem koszenia
    {%- elif ogranicz_godziny and not w_oknie -%}
      poza oknem koszenia {{ okno_od[:5] }}-{{ okno_do[:5] }}
    {%- elif not is_state(kosiarka, 'docked') -%}
      kosiarka nie stoi w bazie (stan: {{ states(kosiarka) }})
    {%- elif nastepne > teraz -%}
      za wcześnie, najbliższe koszenie od {{ nastepne | timestamp_custom('%d.%m %H:%M') }}
    {%- elif bateria and states(bateria) in brak -%}
      brak odczytu baterii
    {%- elif bateria and states(bateria) | float(0) < min_bateria | float(0) -%}
      bateria {{ states(bateria) }}%, minimum {{ min_bateria | int }}%
    {%- elif ns.deszcz -%}
      pada
    {%- elif ns.mokro > 0 -%}
      trawa schnie po deszczu do {{ ns.mokro | timestamp_custom('%H:%M') }}
    {%- elif temperatura and t is none -%}
      brak odczytu temperatury
    {%- elif t is not none and (t < min_temp | float or t > max_temp | float) -%}
      temperatura {{ t }} °C poza zakresem {{ min_temp | int }}-{{ max_temp | int }} °C
    {%- elif spread is not none and spread < min_roznica_rosy | float -%}
      rosa na trawie (wilgotność {{ rh | round(0) | int }}%)
    {%- elif tylko_za_dnia and state_attr('sun.sun', 'elevation') is none -%}
      brak encji sun.sun - nie można sprawdzić, czy jest jasno
    {%- elif tylko_za_dnia and state_attr('sun.sun', 'elevation') | float < slonce_min | float -%}
      za ciemno (słońce {{ state_attr('sun.sun', 'elevation') | round(0) | int }}°)
    {%- elif sprawdzaj_ogrod and ns.ogrod -%}
      ktoś jest w ogrodzie
    {%- elif ns.blokada -%}
      włączona blokada koszenia
    {%- endif -%}

actions:
  - choose:
      - alias: Sprawdź warunki i uruchom koszenie
        conditions:
          - condition: trigger
            id: sprawdz
          - condition: template
            value_template: "{{ powod_blokady | trim == '' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ prognoza | length > 0 }}"
            then:
              - action: weather.get_forecasts
                continue_on_error: true
                target:
                  entity_id: "{{ prognoza }}"
                data:
                  type: hourly
                response_variable: odpowiedz
              - variables:
                  ocena_prognozy: >-
                    {%- set lista = (odpowiedz[prognoza].forecast
                        if odpowiedz is defined and odpowiedz is mapping
                           and odpowiedz.get(prognoza) is mapping
                        else []) or [] -%}
                    {%- set od = now().timestamp() - 3600 -%}
                    {%- set do = now().timestamp() + (prognoza_godz | float(3)) * 3600 -%}
                    {%- set ns = namespace(n=0, opad=0, p=0) -%}
                    {%- for g in lista if g is mapping -%}
                      {%- set ts = as_timestamp(g.get('datetime'), 0) -%}
                      {%- if ts > od and ts <= do -%}
                        {%- set ns.n = ns.n + 1 -%}
                        {%- set ns.opad = ns.opad + (g.get('precipitation') | float(0)) -%}
                        {%- set ns.p = [ns.p, g.get('precipitation_probability') | float(0)] | max -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.n == 0 -%}brak
                    {%- elif ns.opad > max_opad_mm | float or ns.p > max_prawdopodobienstwo | float -%}deszcz
                    {%- else -%}ok{%- endif -%}
              - alias: Bez prognozy godzinowej start tylko, gdy są czujniki deszczu
                condition: template
                value_template: >-
                  {{ ocena_prognozy == 'ok'
                     or (ocena_prognozy == 'brak' and czujniki_deszczu | length > 0) }}
          - action: lawn_mower.start_mowing
            target:
              entity_id: !input kosiarka
          - wait_template: "{{ not is_state(kosiarka, 'docked') and states(kosiarka) not in ['unknown', 'unavailable'] }}"
            timeout:
              minutes: 5
            continue_on_timeout: true
          - alias: Do potwierdzenia koszenia nie startuj ponownie
            action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(2)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: nie wystartowała"
                  tresc: >-
                    Kosiarka nie wyjechała z bazy po komendzie startu (stan: {{ states(kosiarka) }}).
                    Następna próba najwcześniej za {{ ponowienie_godz }} h.
              - sequence: !input akcje_powiadomien
            else:
              - if:
                  - condition: template
                    value_template: "{{ powiadom_o_starcie }}"
                then:
                  - variables:
                      tytul: "{{ nazwa }}: koszenie rozpoczęte"
                      tresc: Kosiarka wyjechała z bazy {{ now().strftime('%H:%M') }}.
                  - sequence: !input akcje_powiadomien

      - alias: Koszenie potwierdzone - wyznacz następny termin
        conditions:
          - condition: trigger
            id: koszenie_potwierdzone
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (odstep_godz | float(44)) * 3600) | int }}"

      - alias: Deszcz podczas koszenia
        conditions:
          - condition: trigger
            id: deszcz
          - condition: template
            value_template: "{{ deszcz_do_bazy and states(kosiarka) in ['mowing', 'paused'] }}"
        sequence:
          - action: lawn_mower.dock
            target:
              entity_id: !input kosiarka
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: powrót do bazy"
                  tresc: Zaczęło padać - kosiarka wraca do bazy. Koszenie zostanie wznowione po wyschnięciu trawy.
              - sequence: !input akcje_powiadomien

      - alias: Ktoś wszedł do ogrodu podczas koszenia
        conditions:
          - condition: trigger
            id: ogrod
          - condition: template
            value_template: "{{ sprawdzaj_ogrod and reakcja_ogrod != 'none' and is_state(kosiarka, 'mowing') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ reakcja_ogrod == 'pause' }}"
            then:
              - action: lawn_mower.pause
                target:
                  entity_id: !input kosiarka
            else:
              - action: lawn_mower.dock
                target:
                  entity_id: !input kosiarka
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: koszenie zatrzymane"
                  tresc: >-
                    Ktoś jest w ogrodzie - kosiarka
                    {{ 'czeka na trawniku (wznów ją ręcznie)' if reakcja_ogrod == 'pause' else 'wraca do bazy' }}.
              - sequence: !input akcje_powiadomien

      - alias: Problem z kosiarką - jedno powiadomienie na zdarzenie
        conditions:
          - condition: trigger
            id: [blad, pauza, niedostepna, za_dlugo]
        sequence:
          - variables:
              tytul: "{{ nazwa }} wymaga uwagi"
              tresc: >-
                {%- set opis = state_attr(kosiarka, 'error_description') or state_attr(kosiarka, 'error') -%}
                {%- if trigger.id == 'blad' -%}
                  Kosiarka zgłosiła błąd{{ (': ' ~ opis) if opis else '' }}. Sprawdź ją na trawniku.
                {%- elif trigger.id == 'pauza' -%}
                  Kosiarka stoi wstrzymana od {{ ((now() - states[kosiarka].last_changed).total_seconds() // 60) | int }} min.
                {%- elif trigger.id == 'niedostepna' -%}
                  Brak łączności z kosiarką od 30 min. Sprawdź zasilanie stacji i zasięg.
                {%- else -%}
                  Kosiarka kosi bez przerwy dłużej niż {{ max_czas_koszenia_godz }} h. Sprawdź, czy nie utknęła.
                {%- endif -%}
          - sequence: !input akcje_powiadomien
