blueprint:
  name: Smart Service - automatisches Rasenmähen
  description: |
    Universeller, sicherer Start eines Mähroboters aus Home Assistant
    (jede Integration mit einer lawn_mower-Entität, z. B. Husqvarna Automower,
    Worx Landroid, Segway Navimow, Gardena, Mammotion, Ecovacs GOAT).

    Der Mähroboter startet, wenn gleichzeitig:
    - der Mäher in der Ladestation steht und der Akku ausreichend geladen ist,
    - der eingestellte Abstand seit dem letzten Mähen vergangen ist (Datums-Helfer),
    - es nicht regnet und seit dem letzten Regen die Trocknungszeit des Rasens vergangen ist (optional),
    - die stündliche Vorhersage für die nächsten Stunden keinen Regen erwartet (optional),
    - die Temperatur im zulässigen Bereich liegt und kein Tau vorhanden ist (optional),
    - keine Sperre eingeschaltet ist (optional).

    Standardmäßig ist das Mähen nicht auf Uhrzeiten oder Tage beschränkt. In den Abschnitten "Zeitplan"
    und "Sicherheit" können Sie aktivieren: ausgewählte Wochentage, ein Zeitfenster,
    Mähen nur bei Tageslicht (Sonnenhöhe) sowie eine Pause, solange sich jemand
    im Garten aufhält. Mähen nur bei Tageslicht schützt Igel, die nach Einbruch der Dunkelheit auf Nahrungssuche gehen.

    Während des Mähens: Regen schickt den Mäher zur Ladestation zurück, betritt jemand den Garten,
    wird der Mäher angehalten oder zurückgeschickt (falls aktiviert), und ein Fehler, eine lange Pause,
    ein Verbindungsverlust oder zu langes Mähen senden je Ereignis eine Benachrichtigung.

    Voraussetzungen:
    - ein input_datetime-Helfer (Datum und Uhrzeit) "Frühestes nächstes Mähen",
    - ein deaktivierter Zeitplan in der Hersteller-App (sonst mäht der Roboter zusätzlich von selbst).
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/koszenie_de.yaml
  input:
    kosiarka_sekcja:
      name: Mäher
      icon: mdi:robot-mower
      input:
        kosiarka:
          name: Mäher
          description: Die lawn_mower-Entität des Mähroboters.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        bateria:
          name: Akku des Mähers (optional)
          description: Sensor für den Akkustand in Prozent. Leer = Akku wird nicht geprüft.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        min_bateria:
          name: Mindest-Akkustand für den Start
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        pomocnik_nastepne:
          name: Helfer - frühestes nächstes Mähen
          description: >-
            Ein input_datetime-Helfer mit Datum und Uhrzeit. Die Automatisierung speichert
            darin selbst, wann frühestens wieder gemäht werden darf (nach dem Mähen und nach einem fehlgeschlagenen Start).
          selector:
            entity:
              filter:
                - domain: input_datetime
    harmonogram_sekcja:
      name: Zeitplan
      icon: mdi:calendar-clock
      input:
        ogranicz_dni:
          name: Nur an ausgewählten Tagen mähen
          description: Aus = Mähen an jedem Wochentag.
          default: false
          selector:
            boolean: {}
        dni:
          name: Mähtage
          description: Wird nur verwendet, wenn die Option oben aktiviert ist.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
        ogranicz_godziny:
          name: Nur zu ausgewählten Uhrzeiten mähen
          description: Aus = Start zu jeder Tageszeit.
          default: false
          selector:
            boolean: {}
        okno_od:
          name: Beginn des Mähfensters
          description: Wird nur verwendet, wenn die Option oben aktiviert ist. Das Fenster darf über Mitternacht gehen (z. B. 22:00-05:00).
          default: "09:00:00"
          selector:
            time: {}
        okno_do:
          name: Ende des Mähfensters (spätester Start)
          description: Wird nur verwendet, wenn "Nur zu ausgewählten Uhrzeiten mähen" aktiviert ist.
          default: "17:00:00"
          selector:
            time: {}
        odstep_godz:
          name: Abstand zwischen zwei Mähvorgängen
          description: Nach einem bestätigten Mähvorgang (auch einem manuell gestarteten) folgt der nächste frühestens nach so vielen Stunden.
          default: 44
          selector:
            number:
              min: 6
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        ponowienie_godz:
          name: Erneuter Versuch nach fehlgeschlagenem oder abgebrochenem Start
          default: 2
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        min_czas_koszenia_min:
          name: Mähen gilt als erledigt nach
          description: Wie viele Minuten der Roboter ohne Unterbrechung mähen muss, damit das Mähen als erledigt gilt.
          default: 20
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
    pogoda_sekcja:
      name: Wetter
      icon: mdi:weather-partly-rainy
      input:
        czujniki_deszczu:
          name: Regensensoren (optional)
          description: >-
            Binäre Regensensoren (Wetterstation, Sensor des Mähers). Zustand "on" = es regnet.
            Die Trocknungszeit zählt ab dem letzten Wechsel eines Sensors auf "off".
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        schniecie_godz:
          name: Trocknungszeit des Rasens nach Regen
          default: 3
          selector:
            number:
              min: 0
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: slider
        prognoza:
          name: Wettervorhersage (optional)
          description: Eine weather-Entität mit stündlicher Vorhersage. Leer = Vorhersage wird nicht geprüft.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        prognoza_godz:
          name: Wie viele Stunden im Voraus die Vorhersage geprüft wird
          default: 3
          selector:
            number:
              min: 1
              max: 8
              step: 1
              unit_of_measurement: h
              mode: slider
        max_opad_mm:
          name: Maximaler vorhergesagter Niederschlag in dieser Zeit
          default: 0.2
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: mm
              mode: box
        max_prawdopodobienstwo:
          name: Maximale Regenwahrscheinlichkeit
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        temperatura:
          name: Außentemperatur (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        min_temp:
          name: Mindesttemperatur zum Mähen
          description: Schützt den Rasen vor dem Mähen bei Frost und kurz danach.
          default: 8
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_temp:
          name: Höchsttemperatur zum Mähen
          default: 30
          selector:
            number:
              min: 20
              max: 40
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        wilgotnosc:
          name: Luftfeuchtigkeit (optional)
          description: Erkennt zusammen mit der Temperatur Tau (Taupunkt). Erfordert auch den Temperatursensor.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        min_roznica_rosy:
          name: Mindestabstand zwischen Temperatur und Taupunkt
          default: 2.5
          selector:
            number:
              min: 0.5
              max: 6
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider
    bezpieczenstwo_sekcja:
      name: Sicherheit
      icon: mdi:shield-check
      input:
        tylko_za_dnia:
          name: Nur bei Tageslicht mähen
          description: >-
            Start nur, wenn die Sonne über dem Horizont steht (Entität sun.sun).
            Empfohlen: Igel und andere Kleintiere gehen nach Einbruch der Dunkelheit auf Nahrungssuche.
          default: false
          selector:
            boolean: {}
        slonce_min:
          name: Mindest-Sonnenhöhe
          description: Wird nur verwendet, wenn "Nur bei Tageslicht mähen" aktiviert ist. 3° entspricht etwa 20 Minuten nach Sonnenaufgang und vor Sonnenuntergang.
          default: 3
          selector:
            number:
              min: -6
              max: 30
              step: 1
              unit_of_measurement: "°"
              mode: slider
        sprawdzaj_ogrod:
          name: Nicht mähen, wenn jemand im Garten ist
          default: false
          selector:
            boolean: {}
        czujniki_ogrodu:
          name: Sensoren für "jemand im Garten"
          description: >-
            Bewegungs- oder Anwesenheitssensoren im Garten, Gartentor, Schalter "Kinder/Hunde im Garten".
            Zustand "on" = jemand ist da. Wird nur verwendet, wenn die Option oben aktiviert ist.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        reakcja_ogrod:
          name: Wenn jemand während des Mähens den Garten betritt
          default: dock
          selector:
            select:
              options:
                - label: Mäher zur Ladestation schicken
                  value: dock
                - label: Mäher auf dem Rasen anhalten
                  value: pause
                - label: Nichts tun
                  value: none
        blokady:
          name: Sperren (optional)
          description: Schalter oder Sensoren, deren Zustand "on" das Mähen sperrt (z. B. Party, Urlaub, Feiertag).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
    nadzor_sekcja:
      name: Überwachung und Benachrichtigungen
      icon: mdi:bell-alert
      input:
        deszcz_do_bazy:
          name: Zur Ladestation schicken, wenn es zu regnen beginnt
          default: true
          selector:
            boolean: {}
        pauza_alarm_min:
          name: Bei einer Pause benachrichtigen, die länger dauert als
          default: 30
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider
        max_czas_koszenia_godz:
          name: Bei einem Mähvorgang benachrichtigen, der länger dauert als
          default: 6
          selector:
            number:
              min: 1
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        powiadom_o_starcie:
          name: Auch über den Start und über Stopps wegen Regen oder Personen im Garten benachrichtigen
          default: false
          selector:
            boolean: {}
        akcje_powiadomien:
          name: Benachrichtigungsaktionen
          description: >-
            Aktionen, die bei jeder Benachrichtigung ausgeführt werden, z. B. notify.mobile_app_handy.
            Verfügbare Variablen: {{ tytul }} (Titel) und {{ tresc }} (Text). Leer = keine Benachrichtigungen.
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: !input okno_od
    id: sprawdz
  - trigger: time_pattern
    minutes: "/10"
    id: sprawdz
  - trigger: state
    entity_id: !input kosiarka
    to: mowing
    for:
      minutes: !input min_czas_koszenia_min
    id: koszenie_potwierdzone
  - trigger: state
    entity_id: !input czujniki_deszczu
    from: "off"
    to: "on"
    id: deszcz
  - trigger: state
    entity_id: !input czujniki_ogrodu
    from: "off"
    to: "on"
    id: ogrod
  - trigger: state
    entity_id: !input kosiarka
    to: error
    for:
      minutes: 2
    id: blad
  - trigger: state
    entity_id: !input kosiarka
    to: paused
    for:
      minutes: !input pauza_alarm_min
    id: pauza
  - trigger: state
    entity_id: !input kosiarka
    to: unavailable
    for:
      minutes: 30
    id: niedostepna
  - trigger: state
    entity_id: !input kosiarka
    to: mowing
    for:
      hours: !input max_czas_koszenia_godz
    id: za_dlugo

variables:
  kosiarka: !input kosiarka
  bateria: !input bateria
  min_bateria: !input min_bateria
  pomocnik_nastepne: !input pomocnik_nastepne
  odstep_godz: !input odstep_godz
  ponowienie_godz: !input ponowienie_godz
  czujniki_deszczu: !input czujniki_deszczu
  schniecie_godz: !input schniecie_godz
  prognoza: !input prognoza
  prognoza_godz: !input prognoza_godz
  max_opad_mm: !input max_opad_mm
  max_prawdopodobienstwo: !input max_prawdopodobienstwo
  temperatura: !input temperatura
  min_temp: !input min_temp
  max_temp: !input max_temp
  wilgotnosc: !input wilgotnosc
  min_roznica_rosy: !input min_roznica_rosy
  ogranicz_dni: !input ogranicz_dni
  dni: !input dni
  ogranicz_godziny: !input ogranicz_godziny
  okno_od: !input okno_od
  okno_do: !input okno_do
  tylko_za_dnia: !input tylko_za_dnia
  slonce_min: !input slonce_min
  sprawdzaj_ogrod: !input sprawdzaj_ogrod
  czujniki_ogrodu: !input czujniki_ogrodu
  max_czas_koszenia_godz: !input max_czas_koszenia_godz
  reakcja_ogrod: !input reakcja_ogrod
  blokady: !input blokady
  deszcz_do_bazy: !input deszcz_do_bazy
  powiadom_o_starcie: !input powiadom_o_starcie
  nazwa: "{{ state_attr(kosiarka, 'friendly_name') or kosiarka }}"
  # Leerer Text = alle Startbedingungen erfüllt (außer der Vorhersage, die separat geprüft wird).
  powod_blokady: >-
    {%- set brak = ['unknown', 'unavailable', 'none', ''] -%}
    {%- set teraz = now().timestamp() -%}
    {%- set nastepne = state_attr(pomocnik_nastepne, 'timestamp') | float(0) -%}
    {%- set t = states(temperatura) | float(none) if temperatura else none -%}
    {%- set rh = states(wilgotnosc) | float(none) if wilgotnosc else none -%}
    {%- set spread = none -%}
    {%- if t is not none and rh is not none and rh > 0 -%}
      {%- set g = (([rh, 100] | min) / 100) | log + 17.62 * t / (243.12 + t) -%}
      {%- set spread = t - 243.12 * g / (17.62 - g) -%}
    {%- endif -%}
    {%- set dzien = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] -%}
    {%- set od = today_at(okno_od) -%}
    {%- set do = today_at(okno_do) -%}
    {%- set w_oknie = (od <= now() < do) if od <= do else (now() >= od or now() < do) -%}
    {%- set ns = namespace(deszcz=false, mokro=0, ogrod=false, blokada=false) -%}
    {%- for e in czujniki_deszczu -%}
      {%- set s = states[e] -%}
      {%- if s is not none and s.state == 'on' -%}
        {%- set ns.deszcz = true -%}
      {%- elif s is not none and s.state == 'off' -%}
        {%- set do_suchej = s.last_changed.timestamp() + (schniecie_godz | float(3)) * 3600 -%}
        {%- if do_suchej > teraz and do_suchej > ns.mokro -%}
          {%- set ns.mokro = do_suchej -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {%- for e in czujniki_ogrodu -%}
      {%- if is_state(e, 'on') -%}{%- set ns.ogrod = true -%}{%- endif -%}
    {%- endfor -%}
    {%- for e in blokady -%}
      {%- if is_state(e, 'on') -%}{%- set ns.blokada = true -%}{%- endif -%}
    {%- endfor -%}
    {%- if ogranicz_dni and dzien not in dni -%}
      heute ist kein Mähtag
    {%- elif ogranicz_godziny and not w_oknie -%}
      außerhalb des Mähfensters {{ okno_od[:5] }}-{{ okno_do[:5] }}
    {%- elif not is_state(kosiarka, 'docked') -%}
      der Mäher steht nicht in der Ladestation (Zustand: {{ states(kosiarka) }})
    {%- elif nastepne > teraz -%}
      zu früh, nächstes Mähen ab {{ nastepne | timestamp_custom('%d.%m %H:%M') }}
    {%- elif bateria and states(bateria) in brak -%}
      kein Akkuwert verfügbar
    {%- elif bateria and states(bateria) | float(0) < min_bateria | float(0) -%}
      Akku {{ states(bateria) }} %, Minimum {{ min_bateria | int }} %
    {%- elif ns.deszcz -%}
      es regnet
    {%- elif ns.mokro > 0 -%}
      der Rasen trocknet nach Regen bis {{ ns.mokro | timestamp_custom('%H:%M') }}
    {%- elif temperatura and t is none -%}
      kein Temperaturwert verfügbar
    {%- elif t is not none and (t < min_temp | float or t > max_temp | float) -%}
      Temperatur {{ t }} °C außerhalb des Bereichs {{ min_temp | int }}-{{ max_temp | int }} °C
    {%- elif spread is not none and spread < min_roznica_rosy | float -%}
      Tau auf dem Rasen (Luftfeuchtigkeit {{ rh | round(0) | int }} %)
    {%- elif tylko_za_dnia and state_attr('sun.sun', 'elevation') is none -%}
      keine Entität sun.sun - Tageslicht kann nicht geprüft werden
    {%- elif tylko_za_dnia and state_attr('sun.sun', 'elevation') | float < slonce_min | float -%}
      zu dunkel (Sonne bei {{ state_attr('sun.sun', 'elevation') | round(0) | int }}°)
    {%- elif sprawdzaj_ogrod and ns.ogrod -%}
      jemand ist im Garten
    {%- elif ns.blokada -%}
      eine Mähsperre ist eingeschaltet
    {%- endif -%}

actions:
  - choose:
      - alias: Bedingungen prüfen und Mähen starten
        conditions:
          - condition: trigger
            id: sprawdz
          - condition: template
            value_template: "{{ powod_blokady | trim == '' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ prognoza | length > 0 }}"
            then:
              - action: weather.get_forecasts
                continue_on_error: true
                target:
                  entity_id: "{{ prognoza }}"
                data:
                  type: hourly
                response_variable: odpowiedz
              - variables:
                  ocena_prognozy: >-
                    {%- set lista = (odpowiedz[prognoza].forecast
                        if odpowiedz is defined and odpowiedz is mapping
                           and odpowiedz.get(prognoza) is mapping
                        else []) or [] -%}
                    {%- set od = now().timestamp() - 3600 -%}
                    {%- set do = now().timestamp() + (prognoza_godz | float(3)) * 3600 -%}
                    {%- set ns = namespace(n=0, opad=0, p=0) -%}
                    {%- for g in lista if g is mapping -%}
                      {%- set ts = as_timestamp(g.get('datetime'), 0) -%}
                      {%- if ts > od and ts <= do -%}
                        {%- set ns.n = ns.n + 1 -%}
                        {%- set ns.opad = ns.opad + (g.get('precipitation') | float(0)) -%}
                        {%- set ns.p = [ns.p, g.get('precipitation_probability') | float(0)] | max -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.n == 0 -%}brak
                    {%- elif ns.opad > max_opad_mm | float or ns.p > max_prawdopodobienstwo | float -%}deszcz
                    {%- else -%}ok{%- endif -%}
              - alias: Ohne stündliche Vorhersage nur starten, wenn Regensensoren vorhanden sind
                condition: template
                value_template: >-
                  {{ ocena_prognozy == 'ok'
                     or (ocena_prognozy == 'brak' and czujniki_deszczu | length > 0) }}
          - action: lawn_mower.start_mowing
            target:
              entity_id: !input kosiarka
          - wait_template: "{{ not is_state(kosiarka, 'docked') and states(kosiarka) not in ['unknown', 'unavailable'] }}"
            timeout:
              minutes: 5
            continue_on_timeout: true
          - alias: Bis zur Bestätigung des Mähens nicht erneut starten
            action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(2)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: nicht gestartet"
                  tresc: >-
                    Der Mäher hat die Ladestation nach dem Startbefehl nicht verlassen (Zustand: {{ states(kosiarka) }}).
                    Nächster Versuch frühestens in {{ ponowienie_godz }} h.
              - sequence: !input akcje_powiadomien
            else:
              - if:
                  - condition: template
                    value_template: "{{ powiadom_o_starcie }}"
                then:
                  - variables:
                      tytul: "{{ nazwa }}: Mähen gestartet"
                      tresc: Der Mäher hat die Ladestation um {{ now().strftime('%H:%M') }} verlassen.
                  - sequence: !input akcje_powiadomien

      - alias: Mähen bestätigt - nächsten Termin festlegen
        conditions:
          - condition: trigger
            id: koszenie_potwierdzone
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (odstep_godz | float(44)) * 3600) | int }}"

      - alias: Regen während des Mähens
        conditions:
          - condition: trigger
            id: deszcz
          - condition: template
            value_template: "{{ deszcz_do_bazy and states(kosiarka) in ['mowing', 'paused'] }}"
        sequence:
          - action: lawn_mower.dock
            target:
              entity_id: !input kosiarka
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: Rückkehr zur Ladestation"
                  tresc: Es hat angefangen zu regnen - der Mäher fährt zur Ladestation zurück. Das Mähen wird fortgesetzt, sobald der Rasen getrocknet ist.
              - sequence: !input akcje_powiadomien

      - alias: Jemand hat während des Mähens den Garten betreten
        conditions:
          - condition: trigger
            id: ogrod
          - condition: template
            value_template: "{{ sprawdzaj_ogrod and reakcja_ogrod != 'none' and is_state(kosiarka, 'mowing') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ reakcja_ogrod == 'pause' }}"
            then:
              - action: lawn_mower.pause
                target:
                  entity_id: !input kosiarka
            else:
              - action: lawn_mower.dock
                target:
                  entity_id: !input kosiarka
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: Mähen unterbrochen"
                  tresc: >-
                    Jemand ist im Garten - der Mäher
                    {{ 'wartet auf dem Rasen (setzen Sie ihn manuell fort)' if reakcja_ogrod == 'pause' else 'fährt zur Ladestation zurück' }}.
              - sequence: !input akcje_powiadomien

      - alias: Problem mit dem Mäher - eine Benachrichtigung pro Ereignis
        conditions:
          - condition: trigger
            id: [blad, pauza, niedostepna, za_dlugo]
        sequence:
          - variables:
              tytul: "{{ nazwa }} benötigt Aufmerksamkeit"
              tresc: >-
                {%- set opis = state_attr(kosiarka, 'error_description') or state_attr(kosiarka, 'error') -%}
                {%- if trigger.id == 'blad' -%}
                  Der Mäher hat einen Fehler gemeldet{{ (': ' ~ opis) if opis else '' }}. Bitte prüfen Sie ihn auf dem Rasen.
                {%- elif trigger.id == 'pauza' -%}
                  Der Mäher pausiert schon seit {{ ((now() - states[kosiarka].last_changed).total_seconds() // 60) | int }} min.
                {%- elif trigger.id == 'niedostepna' -%}
                  Seit 30 min keine Verbindung zum Mäher. Prüfen Sie die Stromversorgung der Ladestation und den Empfang.
                {%- else -%}
                  Der Mäher mäht seit mehr als {{ max_czas_koszenia_godz }} h ohne Unterbrechung. Prüfen Sie, ob er feststeckt.
                {%- endif -%}
          - sequence: !input akcje_powiadomien
