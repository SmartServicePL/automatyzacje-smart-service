blueprint:
  name: Smart Service - oświetlenie zewnętrzne
  description: |
    Lampy przed domem i w ogrodzie według zmierzchu, godziny i ruchu.

    Kiedy świeci: od zmierzchu do ustawionej godziny, od zmierzchu do świtu albo tylko
    przy ruchu. Zmierzch i świt liczone z położenia słońca.
    Czujniki ruchu (opcjonalnie) działają tylko po zmierzchu: pełne światło przez
    ustawiony czas po ostatnim ruchu, także w ciszy nocnej.
    Opcjonalnie: w ciszy nocnej tylko przy ruchu, a przy alarmie włamania wszystkie
    lampy na 100 %. Po alarmie lampy wracają do stanu z harmonogramu.

    Lampy ze ściemnianiem świecą przy ruchu i alarmie na 100 %. Pogoda nie ma wpływu.
    Bez pomocników.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2025.4.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/oswietlenie_zewnetrzne.yaml
  input:
    lampy_sekcja:
      name: Lampy i harmonogram
      icon: mdi:outdoor-lamp
      input:
        lampy:
          name: Lampy
          description: Światła i przełączniki oświetlenia na zewnątrz.
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - light
                    - switch
        kiedy_swieci:
          name: Kiedy świeci
          default: do_godziny
          selector:
            select:
              mode: list
              options:
                - value: do_godziny
                  label: Od zmierzchu do godziny
                - value: do_switu
                  label: Od zmierzchu do świtu
                - value: tylko_ruch
                  label: Tylko przy ruchu
        godzina_gaszenia:
          name: Godzina gaszenia
          description: Tylko przy "Od zmierzchu do godziny". Godzina po północy (np. 01:00) = gaszenie w nocy.
          default: "23:00:00"
          selector:
            time: {}
    ruch_sekcja:
      name: Ruch
      icon: mdi:motion-sensor
      input:
        czujniki_ruchu:
          name: Czujniki ruchu na zewnątrz (opcjonalnie)
          description: Działają tylko po zmierzchu. Zewnętrzne czujniki reagują też na zwierzęta i ruch gałęzi.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        czas_ruchu_min:
          name: Pełne światło po ostatnim ruchu
          default: 3
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: min
              mode: slider
    noc_sekcja:
      name: Noc
      icon: mdi:weather-night
      input:
        w_ciszy_tylko_ruch:
          name: W ciszy nocnej tylko przy ruchu
          description: W ciszy nocnej lampy są zgaszone i zapala je tylko ruch.
          default: false
          selector:
            boolean: {}
        cisza_nocna:
          name: Cisza nocna
          description: Przełącznik ciszy nocnej (włączony = noc). Puste = bez ciszy nocnej.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
    alarm_sekcja:
      name: Alarm
      icon: mdi:shield-home
      input:
        przy_alarmie_wszystko:
          name: Przy alarmie włamania zapal wszystko
          description: Przy alarmie wszystkie lampy na 100 %, także w dzień. Po alarmie powrót do stanu z harmonogramu.
          default: false
          selector:
            boolean: {}
        alarm:
          name: Centrala alarmu
          description: Encja alarm_control_panel. Puste = bez współpracy z alarmem.
          default: ""
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
    zaawansowane_sekcja:
      name: Zaawansowane
      icon: mdi:weather-sunset-down
      collapsed: true
      input:
        zmierzch_elewacja:
          name: Zmierzch przy wysokości słońca
          description: Lampy zapalają się, gdy słońce zejdzie poniżej tej wysokości, i gasną o świcie, gdy ją przekroczy. -2° = połowa zmierzchu cywilnego.
          default: -2
          selector:
            number:
              min: -10
              max: 5
              step: 0.5
              unit_of_measurement: "°"
              mode: box

mode: restart
max_exceeded: silent
trace:
  stored_traces: 20

trigger_variables:
  zmierzch_tv: !input zmierzch_elewacja
  cisza_tv: !input cisza_nocna
  alarm_tv: !input alarm

triggers:
  - trigger: template
    value_template: "{{ state_attr('sun.sun', 'elevation') | float(90) < zmierzch_tv | float(-2) }}"
    id: zmierzch
  - trigger: template
    value_template: "{{ state_attr('sun.sun', 'elevation') | float(-90) >= zmierzch_tv | float(-2) }}"
    id: swit
  - trigger: time
    at: !input godzina_gaszenia
    id: godzina
  - trigger: template
    value_template: "{{ cisza_tv != '' and is_state(cisza_tv, 'on') }}"
    id: cisza
  - trigger: template
    value_template: "{{ cisza_tv != '' and is_state(cisza_tv, 'off') }}"
    id: cisza
  - trigger: state
    entity_id: !input czujniki_ruchu
    to: "on"
    id: ruch
  - trigger: state
    entity_id: !input czujniki_ruchu
    to: "off"
    for:
      minutes: !input czas_ruchu_min
    id: ruch_koniec
  - trigger: template
    value_template: "{{ alarm_tv != '' and is_state(alarm_tv, 'triggered') }}"
    id: alarm
  - trigger: template
    value_template: "{{ alarm_tv != '' and not is_state(alarm_tv, 'triggered') }}"
    id: alarm_koniec
  - trigger: homeassistant
    event: start
    id: start
  - trigger: event
    event_type: automation_reloaded
    id: start

variables:
  lampy_wej: !input lampy
  kiedy_swieci: !input kiedy_swieci
  godzina_gaszenia: !input godzina_gaszenia
  zmierzch_elewacja: !input zmierzch_elewacja
  czujniki_wej: !input czujniki_ruchu
  czas_ruchu_min: !input czas_ruchu_min
  w_ciszy_tylko_ruch: !input w_ciszy_tylko_ruch
  cisza_nocna: !input cisza_nocna
  alarm: !input alarm
  przy_alarmie_wszystko: !input przy_alarmie_wszystko
  limit_petli: 20
  lampy: "{{ lampy_wej if lampy_wej is list else [lampy_wej] }}"
  czujniki: "{{ czujniki_wej if czujniki_wej is list else ([czujniki_wej] if czujniki_wej else []) }}"
  po_zmierzchu: "{{ state_attr('sun.sun', 'elevation') | float(90) < zmierzch_elewacja | float(-2) }}"

conditions:
  - alias: Ruch w dzień nic nie zmienia
    condition: template
    value_template: "{{ trigger.id not in ['ruch', 'ruch_koniec'] or po_zmierzchu }}"

actions:
  - alias: Stan lamp według alarmu, ruchu i harmonogramu
    repeat:
      until:
        - condition: template
          value_template: "{{ not czekaj_na_koniec_ruchu or repeat.index >= limit_petli }}"
      sequence:
        - variables:
            teraz: "{{ now().timestamp() }}"
            ciemno: "{{ state_attr('sun.sun', 'elevation') | float(90) < zmierzch_elewacja | float(-2) }}"
            noc: "{{ cisza_nocna != '' and is_state(cisza_nocna, 'on') }}"
            w_oknie: >-
              {%- set g = (godzina_gaszenia | string).split(':') -%}
              {%- set koniec = (g[0] | int(23)) * 60 + (g[1] | int(0) if g | count > 1 else 0) -%}
              {%- set t = now().hour * 60 + now().minute -%}
              {%- if koniec >= 720 -%}{{ 720 <= t < koniec }}
              {%- else -%}{{ t >= 720 or t < koniec }}
              {%- endif -%}
            harmonogram: >-
              {%- if not ciemno or kiedy_swieci == 'tylko_ruch' or (noc and w_ciszy_tylko_ruch) -%}{{ false }}
              {%- elif kiedy_swieci == 'do_switu' -%}{{ true }}
              {%- else -%}{{ w_oknie }}
              {%- endif -%}
            alarm_trwa: "{{ przy_alarmie_wszystko and alarm != '' and is_state(alarm, 'triggered') }}"
            ruch_trwa: "{{ czujniki | select('is_state', 'on') | list | count > 0 }}"
            # Koniec ostatniego ruchu: najpóźniejsze przejście czujnika w stan "brak ruchu". Po starcie systemu się nie liczy.
            ostatni_ruch_ts: >-
              {%- set ns = namespace(t=0) -%}
              {%- if trigger.id != 'start' or not repeat.first -%}
                {%- for e in czujniki if is_state(e, 'off') -%}
                  {%- set ns.t = [ns.t, states[e].last_changed.timestamp()] | max -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.t }}
            ruch_pozostalo_s: "{{ ostatni_ruch_ts + (czas_ruchu_min | float(3)) * 60 - teraz }}"
            pelne: "{{ alarm_trwa or (ciemno and (ruch_trwa or ruch_pozostalo_s > 0)) }}"
            czekaj_na_koniec_ruchu: "{{ not alarm_trwa and ciemno and not ruch_trwa and ruch_pozostalo_s > 0 }}"
            przelaczniki: "{{ lampy | select('match', 'switch\\.') | list }}"
            sciemniane: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for e in lampy if e.startswith('light.') -%}
                {%- if (state_attr(e, 'supported_color_modes') or []) | reject('in', ['onoff', 'unknown']) | list | count > 0 -%}
                  {%- set ns.l = ns.l + [e] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.l }}
            zwykle: "{{ lampy | select('match', 'light\\.') | reject('in', sciemniane) | list }}"
        - choose:
            - alias: Ruch po zmierzchu albo alarm - pełne światło
              conditions:
                - condition: template
                  value_template: "{{ pelne }}"
              sequence:
                - variables:
                    do_rozjasnienia: >-
                      {{ sciemniane | reject('is_state_attr', 'brightness', 255) | list }}
                - if:
                    - condition: template
                      value_template: "{{ do_rozjasnienia | count > 0 }}"
                  then:
                    - action: light.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ do_rozjasnienia }}"
                      data:
                        brightness_pct: 100
                - if:
                    - condition: template
                      value_template: "{{ zwykle | reject('is_state', 'on') | list | count > 0 }}"
                  then:
                    - action: light.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ zwykle | reject('is_state', 'on') | list }}"
                - if:
                    - condition: template
                      value_template: "{{ przelaczniki | reject('is_state', 'on') | list | count > 0 }}"
                  then:
                    - action: switch.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ przelaczniki | reject('is_state', 'on') | list }}"
            - alias: Harmonogram - lampy świecą
              conditions:
                - condition: template
                  value_template: "{{ harmonogram }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ lampy | select('match', 'light\\.') | reject('is_state', 'on') | list | count > 0 }}"
                  then:
                    - action: light.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ lampy | select('match', 'light\\.') | reject('is_state', 'on') | list }}"
                - if:
                    - condition: template
                      value_template: "{{ przelaczniki | reject('is_state', 'on') | list | count > 0 }}"
                  then:
                    - action: switch.turn_on
                      continue_on_error: true
                      target:
                        entity_id: "{{ przelaczniki | reject('is_state', 'on') | list }}"
          default:
            - alias: Lampy zgaszone
              if:
                - condition: template
                  value_template: "{{ lampy | select('match', 'light\\.') | select('is_state', 'on') | list | count > 0 }}"
              then:
                - action: light.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ lampy | select('match', 'light\\.') | select('is_state', 'on') | list }}"
            - if:
                - condition: template
                  value_template: "{{ przelaczniki | select('is_state', 'on') | list | count > 0 }}"
              then:
                - action: switch.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ przelaczniki | select('is_state', 'on') | list }}"
        - alias: Po ostatnim ruchu - czekanie do końca pełnego światła
          if:
            - condition: template
              value_template: "{{ czekaj_na_koniec_ruchu }}"
          then:
            - delay:
                seconds: "{{ [ruch_pozostalo_s | float(0), 1] | max }}"
