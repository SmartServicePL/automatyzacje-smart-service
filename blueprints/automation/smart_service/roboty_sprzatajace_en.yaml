blueprint:
  name: Smart Service - robot cleaning while nobody is home
  description: |
    Universal cleaning with a robot vacuum or mopping robot from Home Assistant
    (any integration with a vacuum entity, e.g. Roborock, Ecovacs, Dreame, Matter).
    One automation = one robot. For several floors or robots, create several
    automations from this blueprint (each with its own helper).

    The robot starts when all of the following are true:
    - nobody has been home for the set time (or the mode without presence is selected),
    - the robot is docked with enough battery,
    - the set interval since the last cleaning has passed (date helper),
    - the optional need counter (e.g. "dirt", litter box uses) has reached its threshold,
    - no block is switched on.

    By default, cleaning is not limited to any days or hours. Selected weekdays
    and a time window can be enabled in the "Schedule and presence" section.

    Cleaning selected rooms uses the vacuum.clean_area action (Home Assistant
    2026.3 or newer; map segments must be assigned to areas in the settings
    of the robot entity). Without selected areas, the robot cleans the whole home (vacuum.start).
    For integrations without area support, you can provide your own start actions.

    Monitoring: when someone comes home, the robot returns to its dock or pauses; an error,
    a long pause, a lost connection or cleaning for too long send one
    notification per event.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/roboty_sprzatajace_en.yaml
  input:
    robot_sekcja:
      name: Robot
      icon: mdi:robot-vacuum
      input:
        robot:
          name: Robot
          selector:
            entity:
              filter:
                - domain: vacuum
        bateria:
          name: Robot battery (optional)
          description: Battery sensor in percent. Empty = battery is not checked.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        min_bateria:
          name: Minimum battery to start
          default: 40
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        start_takze_z_idle:
          name: Also allow starting from the "idle" state
          description: Some robots report "idle" instead of "docked" after charging. Turn on only if your robot does this.
          default: false
          selector:
            boolean: {}
        pomocnik_nastepne:
          name: Helper - earliest next cleaning
          description: >-
            An input_datetime helper with date and time. The automation itself stores
            in it the earliest time cleaning is allowed again.
          selector:
            entity:
              filter:
                - domain: input_datetime
    zakres_sekcja:
      name: What to clean
      icon: mdi:floor-plan
      input:
        obszary:
          name: Areas to clean (optional)
          description: >-
            Home Assistant areas assigned to the robot's map segments. Empty = the whole home.
            Requires Home Assistant 2026.3+ and a robot that supports "Clean area".
          default: []
          selector:
            area:
              multiple: true
        wlasny_start:
          name: Use custom start actions instead of the standard ones
          default: false
          selector:
            boolean: {}
        akcje_startu:
          name: Custom start actions (optional)
          description: E.g. an action of the manufacturer's integration with a list of rooms and a mopping mode. Used only when the option above is turned on.
          default: []
          selector:
            action: {}
    harmonogram_sekcja:
      name: Schedule and presence
      icon: mdi:calendar-clock
      input:
        ogranicz_dni:
          name: Clean only on selected days
          description: Off = cleaning on every day of the week.
          default: false
          selector:
            boolean: {}
        dni:
          name: Cleaning days
          description: Used only when the option above is turned on.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        ogranicz_godziny:
          name: Clean only during selected hours
          description: Off = start at any time of day.
          default: false
          selector:
            boolean: {}
        okno_od:
          name: Cleaning window start
          description: Used only when the option above is turned on. The window may span midnight.
          default: "09:00:00"
          selector:
            time: {}
        okno_do:
          name: Cleaning window end (latest start)
          description: Used only when "Clean only during selected hours" is turned on.
          default: "16:00:00"
          selector:
            time: {}
        odstep_godz:
          name: Interval between cleanings
          default: 44
          selector:
            number:
              min: 4
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        ponowienie_godz:
          name: Retry after a failed or interrupted cleaning
          default: 3
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        min_czas_sprzatania_min:
          name: Cleaning counts as done after
          description: How many minutes the robot must clean without a break for the cleaning to count as done.
          default: 15
          selector:
            number:
              min: 3
              max: 120
              step: 1
              unit_of_measurement: min
              mode: slider
        tryb_obecnosci:
          name: When to clean
          default: pusty_dom
          selector:
            select:
              options:
                - label: Only when nobody is home
                  value: pusty_dom
                - label: In the time window, regardless of presence
                  value: zawsze
        obecnosc:
          name: Household members and presence sensors
          description: >-
            People (person), devices (device_tracker), groups or presence sensors
            (state "on" = someone is there). An unknown state counts as presence.
            Do not select motion sensors in rooms with pets.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: device_tracker
                - domain: group
                - domain: binary_sensor
                - domain: input_boolean
        opoznienie_min:
          name: Start after the home has been empty for this many minutes
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        reakcja_powrot:
          name: When someone comes back during cleaning
          default: dock
          selector:
            select:
              options:
                - label: Send the robot back to its dock (it will finish later)
                  value: dock
                - label: Pause the robot
                  value: pause
                - label: Keep cleaning
                  value: none
        potrzeba:
          name: Cleaning need counter (optional)
          description: E.g. an input_number "dirt" or a litter box use counter. Starts only from the threshold below.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_number
                - domain: counter
                - domain: sensor
        prog_potrzeby:
          name: Need counter threshold
          default: 100
          selector:
            number:
              min: 1
              max: 1000
              step: 1
              mode: box
        blokady:
          name: Blocks (optional)
          description: Switches or sensors whose "on" state blocks cleaning (guests, vacation, an open door).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
    nadzor_sekcja:
      name: Monitoring and notifications
      icon: mdi:bell-alert
      input:
        pauza_alarm_min:
          name: Notify about a pause lasting longer than
          default: 20
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider
        max_czas_godz:
          name: Cleaning time limit (then return to the dock)
          default: 4
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: box
        akcje_po_sprzataniu:
          name: Actions after a completed cleaning (optional)
          description: E.g. resetting the need counter. Run when the cleaning counts as done.
          default: []
          selector:
            action: {}
        powiadom_o_starcie:
          name: Also notify about starts and about interruptions because someone came home
          default: false
          selector:
            boolean: {}
        akcje_powiadomien:
          name: Notification actions
          description: >-
            Actions run for every notification, e.g. notify.mobile_app_phone.
            Available variables: {{ tytul }} (title) and {{ tresc }} (message). Empty = no notifications.
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: !input okno_od
    id: sprawdz
  - trigger: time_pattern
    minutes: "/10"
    id: sprawdz
  - trigger: state
    entity_id: !input obecnosc
    to: ~
    id: obecnosc
  - trigger: state
    entity_id: !input robot
    to: cleaning
    for:
      minutes: !input min_czas_sprzatania_min
    id: sprzatanie_potwierdzone
  - trigger: state
    entity_id: !input robot
    to: error
    for:
      minutes: 1
    id: blad
  - trigger: state
    entity_id: !input robot
    to: paused
    for:
      minutes: !input pauza_alarm_min
    id: pauza
  - trigger: state
    entity_id: !input robot
    to: unavailable
    for:
      minutes: 30
    id: niedostepny
  - trigger: state
    entity_id: !input robot
    to: cleaning
    for:
      hours: !input max_czas_godz
    id: za_dlugo

variables:
  robot: !input robot
  bateria: !input bateria
  min_bateria: !input min_bateria
  start_takze_z_idle: !input start_takze_z_idle
  pomocnik_nastepne: !input pomocnik_nastepne
  obszary: !input obszary
  wlasny_start: !input wlasny_start
  odstep_godz: !input odstep_godz
  ponowienie_godz: !input ponowienie_godz
  tryb_obecnosci: !input tryb_obecnosci
  obecnosc: !input obecnosc
  opoznienie_min: !input opoznienie_min
  reakcja_powrot: !input reakcja_powrot
  potrzeba: !input potrzeba
  prog_potrzeby: !input prog_potrzeby
  blokady: !input blokady
  powiadom_o_starcie: !input powiadom_o_starcie
  ogranicz_dni: !input ogranicz_dni
  dni: !input dni
  ogranicz_godziny: !input ogranicz_godziny
  okno_od: !input okno_od
  okno_do: !input okno_do
  max_czas_godz: !input max_czas_godz
  nazwa: "{{ state_attr(robot, 'friendly_name') or robot }}"
  ktos_w_domu: >-
    {%- set ns = namespace(dom=false) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- set d = e.split('.')[0] -%}
      {%- if s is none or s.state in ['unknown', 'unavailable'] -%}
        {%- set ns.dom = true -%}
      {%- elif d in ['person', 'device_tracker'] and s.state == 'home' -%}
        {%- set ns.dom = true -%}
      {%- elif d in ['binary_sensor', 'input_boolean'] and s.state == 'on' -%}
        {%- set ns.dom = true -%}
      {%- elif d == 'group' and s.state in ['home', 'on'] -%}
        {%- set ns.dom = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.dom }}
  minut_pustego_domu: >-
    {%- set ns = namespace(ost=0) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- if s is not none and s.last_changed.timestamp() > ns.ost -%}
        {%- set ns.ost = s.last_changed.timestamp() -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ((now().timestamp() - ns.ost) / 60) | round(0) | int if ns.ost > 0 else 0 }}
  powod_blokady: >-
    {%- set teraz = now().timestamp() -%}
    {%- set nastepne = state_attr(pomocnik_nastepne, 'timestamp') | float(0) -%}
    {%- set stany_startu = ['docked', 'idle'] if start_takze_z_idle else ['docked'] -%}
    {%- set dzien = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] -%}
    {%- set od = today_at(okno_od) -%}
    {%- set do = today_at(okno_do) -%}
    {%- set w_oknie = (od <= now() < do) if od <= do else (now() >= od or now() < do) -%}
    {%- set ns = namespace(blokada=false) -%}
    {%- for e in blokady -%}
      {%- if is_state(e, 'on') -%}{%- set ns.blokada = true -%}{%- endif -%}
    {%- endfor -%}
    {%- if ogranicz_dni and dzien not in dni -%}
      today is not a cleaning day
    {%- elif ogranicz_godziny and not w_oknie -%}
      outside the cleaning window {{ okno_od[:5] }}-{{ okno_do[:5] }}
    {%- elif not wlasny_start and obszary | length > 0
          and not (state_attr(robot, 'supported_features') | int(0)) | bitwise_and(16384) -%}
      the robot does not support area cleaning - remove the areas or use custom start actions
    {%- elif states(robot) not in stany_startu -%}
      the robot is not docked (state: {{ states(robot) }})
    {%- elif nastepne > teraz -%}
      too early, next cleaning from {{ nastepne | timestamp_custom('%d.%m %H:%M') }}
    {%- elif bateria and states(bateria) | float(-1) < 0 -%}
      no battery reading
    {%- elif bateria and states(bateria) | float(0) < min_bateria | float(0) -%}
      battery {{ states(bateria) }}%, minimum {{ min_bateria | int }}%
    {%- elif tryb_obecnosci == 'pusty_dom' and obecnosc | length == 0 -%}
      no household members selected, but the mode requires an empty home
    {%- elif tryb_obecnosci == 'pusty_dom' and ktos_w_domu | bool -%}
      someone is home
    {%- elif tryb_obecnosci == 'pusty_dom' and minut_pustego_domu | int < opoznienie_min | int -%}
      home empty for only {{ minut_pustego_domu }} min
    {%- elif potrzeba and states(potrzeba) | float(-1) < prog_potrzeby | float -%}
      need counter {{ states(potrzeba) }} below the threshold {{ prog_potrzeby }}
    {%- elif ns.blokada -%}
      a cleaning block is on
    {%- endif -%}

actions:
  - choose:
      - alias: Check the conditions and start cleaning
        conditions:
          - condition: trigger
            id: sprawdz
          - condition: template
            value_template: "{{ powod_blokady | trim == '' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wlasny_start }}"
                sequence: !input akcje_startu
              - conditions:
                  - condition: template
                    value_template: "{{ obszary | length > 0 }}"
                sequence:
                  - action: vacuum.clean_area
                    continue_on_error: true
                    target:
                      entity_id: !input robot
                    data:
                      cleaning_area_id: !input obszary
            default:
              - action: vacuum.start
                continue_on_error: true
                target:
                  entity_id: !input robot
          - wait_template: "{{ states(robot) in ['cleaning', 'returning', 'paused', 'error'] }}"
            timeout:
              minutes: 3
            continue_on_timeout: true
          - alias: Do not start again until cleaning is confirmed
            action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: did not start"
                  tresc: >-
                    The robot did not start cleaning after the start command (state: {{ states(robot) }}).
                    Next attempt at the earliest in {{ ponowienie_godz }} h.
              - sequence: !input akcje_powiadomien
            else:
              - if:
                  - condition: template
                    value_template: "{{ powiadom_o_starcie }}"
                then:
                  - variables:
                      tytul: "{{ nazwa }}: cleaning started"
                      tresc: The robot left its dock at {{ now().strftime('%H:%M') }}.
                  - sequence: !input akcje_powiadomien

      - alias: Cleaning confirmed - set the next date
        conditions:
          - condition: trigger
            id: sprzatanie_potwierdzone
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (odstep_godz | float(44)) * 3600) | int }}"
          - sequence: !input akcje_po_sprzataniu

      - alias: Someone came home during cleaning
        conditions:
          - condition: trigger
            id: obecnosc
          - condition: template
            value_template: >-
              {{ tryb_obecnosci == 'pusty_dom' and reakcja_powrot != 'none'
                 and ktos_w_domu | bool and is_state(robot, 'cleaning') }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ reakcja_powrot == 'pause' }}"
            then:
              - action: vacuum.pause
                target:
                  entity_id: !input robot
            else:
              - action: vacuum.return_to_base
                target:
                  entity_id: !input robot
              - alias: Finish later - short retry time
                action: input_datetime.set_datetime
                target:
                  entity_id: !input pomocnik_nastepne
                data:
                  timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: cleaning interrupted"
                  tresc: >-
                    Someone came home - the robot
                    {{ 'is waiting where it is (resume it manually)' if reakcja_powrot == 'pause' else 'is returning to its dock and will finish later' }}.
              - sequence: !input akcje_powiadomien

      - alias: Cleaning time limit
        conditions:
          - condition: trigger
            id: za_dlugo
        sequence:
          - action: vacuum.return_to_base
            target:
              entity_id: !input robot
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - variables:
              tytul: "{{ nazwa }} needs attention"
              tresc: >-
                The robot has been cleaning for more than {{ max_czas_godz }} h - it has been sent back to its dock.
                Check whether it is stuck.
          - sequence: !input akcje_powiadomien

      - alias: Robot problem - one notification per event
        conditions:
          - condition: trigger
            id: [blad, pauza, niedostepny]
        sequence:
          - variables:
              tytul: "{{ nazwa }} needs attention"
              tresc: >-
                {%- set opis = state_attr(robot, 'error') or state_attr(robot, 'status') -%}
                {%- if trigger.id == 'blad' -%}
                  The robot reported an error{{ (': ' ~ opis) if opis else '' }}. Check the robot and its dock (water tanks, dust bag, brushes).
                {%- elif trigger.id == 'pauza' -%}
                  The robot has been paused for {{ ((now() - states[robot].last_changed).total_seconds() // 60) | int }} min.
                {%- else -%}
                  No connection to the robot for 30 min. Check the dock's power supply and the Wi-Fi.
                {%- endif -%}
          - sequence: !input akcje_powiadomien
