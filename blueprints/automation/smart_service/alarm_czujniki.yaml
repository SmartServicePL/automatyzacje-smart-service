blueprint:
  name: Smart Service - alarm, czujniki i tryb nocny
  description: |
    Czujniki domu wyzwalają centralę alarmu, a powiadomienia krytyczne docierają na telefony.
    Działa z centralą Smart Service Alarm i z każdą inną centralą alarm_control_panel.
    Jedna automatyzacja = jedna centrala.

    Włamanie: czujniki drzwi i okien wyzwalają alarm przy każdym uzbrojeniu, czujniki
    ruchu tylko przy uzbrojeniu "poza domem". Opóźnienie wejścia robi centrala.
    Zagrożenia (dym, czad, gaz, zalanie): zawsze syreny i powiadomienie krytyczne,
    bez zmiany stanu centrali, także przy rozbrojonym alarmie i w ciszy nocnej.

    Powiadomienie krytyczne przebija tryb "Nie przeszkadzać" i wraca co 2 minuty
    (najwyżej 5 razy), dopóki ktoś nie naciśnie PRZYJĄŁEM. Syreny gasną przy
    rozbrojeniu, po ustawionym czasie i po starcie Home Assistant.

    Opcjonalnie: uzbrajanie na noc według ciszy nocnej, przypomnienie, gdy wszyscy
    wyszli, a alarm jest rozbrojony, i pilnowanie czujników (brak łączności, bateria).
    Automatyzacja nigdy nie rozbraja alarmu z powiadomienia.

    Pomocnik (opcjonalnie): Tekst (maks. 255 znaków) na powód ostatniej decyzji.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2026.7.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/alarm_czujniki.yaml
  input:
    centrala_sekcja:
      name: Centrala i czujniki
      icon: mdi:shield-home
      input:
        alarm:
          name: Centrala alarmu
          description: Centrala Smart Service Alarm albo dowolna inna encja alarm_control_panel.
          selector:
            entity:
              filter:
                - domain: alarm_control_panel
        czujniki_obwod:
          name: Czujniki drzwi i okien (obwód)
          description: Wyzwalają alarm przy uzbrojeniu poza domem, w domu i na noc.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - door
                    - window
                    - opening
                    - garage_door
        czujniki_ruch:
          name: Czujniki ruchu i obecności
          description: Wyzwalają alarm tylko przy uzbrojeniu poza domem, bo w domu są ludzie i zwierzęta.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - motion
                    - occupancy
                    - presence
        czujniki_zagrozen:
          name: Czujniki zagrożeń (dym, czad, gaz, zalanie)
          description: Zawsze pełny alarm, bez względu na stan centrali i ciszę nocną. Stan centrali się nie zmienia.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                  device_class:
                    - smoke
                    - carbon_monoxide
                    - gas
                    - moisture
    syreny_sekcja:
      name: Syreny
      icon: mdi:alarm-light
      input:
        syreny:
          name: Syreny (opcjonalnie)
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: siren
        syrena_min:
          name: Czas pracy syren
          description: Potem syreny się wyłączają. Przy zagrożeniu syrena działa też tak długo, jak czujnik wykrywa zagrożenie.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              unit_of_measurement: min
              mode: slider
        cichy_alarm:
          name: Cichy alarm przy włamaniu
          description: Włączony = włamanie bez syren, tylko powiadomienia. Zagrożenia zawsze włączają syreny.
          default: false
          selector:
            boolean: {}
    powiadomienia_sekcja:
      name: Powiadomienia
      icon: mdi:cellphone-message
      input:
        odbiorcy:
          name: Telefony
          description: >-
            Telefony z aplikacją Home Assistant. Puste = wszystkie telefony z aplikacją.
            Powiadomienie trafia do usługi notify.mobile_app_ o nazwie urządzenia.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
    noc_sekcja:
      name: Noc i wyjście z domu
      icon: mdi:weather-night
      input:
        uzbrajaj_na_noc:
          name: Uzbrajaj na noc według ciszy nocnej
          description: >-
            Początek ciszy nocnej uzbraja alarm na noc, koniec go rozbraja. Działa tylko z centralą,
            która uzbraja bez kodu, i rozbraja tylko uzbrojenie zrobione przez automatyzację.
          default: false
          selector:
            boolean: {}
        cisza_nocna:
          name: Cisza nocna
          description: Przełącznik ciszy nocnej (włączony = noc). Wymagany do uzbrajania na noc. Puste = bez ciszy nocnej.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
        przypomnij_gdy_wyszli:
          name: Przypomnij, gdy wszyscy wyszli, a alarm jest rozbrojony
          default: false
          selector:
            boolean: {}
        osoby:
          name: Domownicy
          description: Osoby z telefonem i lokalizacją. Puste = bez przypomnienia.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
    pomocnik_sekcja:
      name: Pomocnik
      icon: mdi:database
      input:
        pomocnik_powod:
          name: Pomocnik - powód ostatniej decyzji (opcjonalnie)
          description: Pomocnik Tekst o długości maks. 255 znaków, np. "Nie uzbroiłem na noc - Zamknij - Okno salon".
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

mode: parallel
max: 100
max_exceeded: warning
trace:
  stored_traces: 50

trigger_variables:
  alarm_tv: !input alarm
  cisza_tv: !input cisza_nocna
  obj_tv: "{{ alarm_tv.split('.')[1] if '.' in alarm_tv else alarm_tv }}"

triggers:
  - trigger: state
    entity_id: !input czujniki_obwod
    from: "off"
    to: "on"
    id: obwod
  - trigger: state
    entity_id: !input czujniki_ruch
    from: "off"
    to: "on"
    id: ruch
  - trigger: state
    entity_id: !input alarm
    to: triggered
    id: wyzwolona
  - trigger: state
    entity_id: !input alarm
    from: triggered
    id: wyzwolenie_koniec
  - trigger: state
    entity_id: !input alarm
    to: disarmed
    id: rozbrojona
  - trigger: state
    entity_id: !input czujniki_zagrozen
    to: "on"
    id: zagrozenie
  - trigger: state
    entity_id: !input czujniki_zagrozen
    from: "on"
    to: "off"
    id: zagrozenie_koniec
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "alarm_przyjalem_w_{{ obj_tv }}"
    id: przyjalem_w
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "alarm_przyjalem_z_{{ obj_tv }}"
    id: przyjalem_z
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "alarm_uzbroj_{{ obj_tv }}"
    id: uzbroj
  - trigger: template
    value_template: "{{ cisza_tv != '' and is_state(cisza_tv, 'on') }}"
    id: noc_start
  - trigger: template
    value_template: "{{ cisza_tv != '' and is_state(cisza_tv, 'off') }}"
    id: noc_koniec
  - trigger: state
    entity_id: !input osoby
    from: home
    for:
      minutes: 2
    id: wyjscie
  - trigger: state
    entity_id: !input czujniki_obwod
    to: unavailable
    for:
      minutes: 30
    id: niedostepny
  - trigger: state
    entity_id: !input czujniki_ruch
    to: unavailable
    for:
      minutes: 30
    id: niedostepny
  - trigger: state
    entity_id: !input czujniki_zagrozen
    to: unavailable
    for:
      minutes: 30
    id: niedostepny
  - trigger: time
    at: "09:00:00"
    id: przeglad
  - trigger: homeassistant
    event: start
    id: start

variables:
  # Teksty powiadomień i powodów. {czujnik}, {godzina}, {imie}, {powod}, {lista}, {godzin} i {procent} są podmieniane.
  teksty:
    kanal: "awarie"
    przycisk_przyjalem: "PRZYJĄŁEM"
    przycisk_uzbroj: "Uzbrój"
    przycisk_otworz: "Otwórz alarm"
    czujnik_centrali: "centrali"
    ktos: "ktoś z domowników"
    wlamanie_tytul: "Alarm: włamanie"
    wlamanie_tresc: "Czujnik {czujnik} wyzwolił alarm o {godzina}.\nCo zrobić: sprawdź dom lub kamery. Jeśli to pomyłka, rozbrój alarm."
    wlamanie_cichy_tresc: "Czujnik {czujnik} wyzwolił cichy alarm o {godzina}. Syreny są wyłączone.\nCo zrobić: sprawdź dom lub kamery. Jeśli to pomyłka, rozbrój alarm."
    zagrozenie_smoke: "Alarm: dym"
    zagrozenie_carbon_monoxide: "Alarm: czad"
    zagrozenie_gas: "Alarm: gaz"
    zagrozenie_moisture: "Alarm: zalanie"
    zagrozenie_inne: "Alarm: zagrożenie"
    zagrozenie_tresc: "Czujnik {czujnik} wykrył zagrożenie o {godzina}."
    co_zrobic_smoke: "Co zrobić: wyjdź z domu. Gdy widzisz dym lub ogień, dzwoń pod 112."
    co_zrobic_carbon_monoxide: "Co zrobić: otwórz okna, wyjdź na zewnątrz i dzwoń pod 112."
    co_zrobic_gas: "Co zrobić: nie używaj ognia ani włączników, otwórz okna, wyjdź i dzwoń pod 992."
    co_zrobic_moisture: "Co zrobić: zakręć główny zawór wody i sprawdź miejsce przy czujniku."
    co_zrobic_inne: "Co zrobić: sprawdź miejsce przy czujniku."
    przyjete_tytul: "Alarm przyjęty"
    przyjete_tresc: "Potwierdzenie: {imie} o {godzina}.\nCo zrobić: nic, ktoś już się tym zajmuje."
    noc_odmowa_tytul: "Nie uzbroiłem alarmu na noc"
    noc_odmowa_tresc: "{powod}.\nCo zrobić: popraw to i uzbrój alarm ręcznie."
    rano_odmowa_tytul: "Alarm nadal uzbrojony na noc"
    rano_odmowa_tresc: "Centrala nie przyjęła rozbrojenia po nocy.\nCo zrobić: rozbrój alarm kodem przed otwarciem drzwi."
    rano_alarm_tresc: "Nie rozbrajam: w nocy był alarm.\nCo zrobić: sprawdź, co go wyzwoliło, i rozbrój alarm ręcznie."
    rano_restart_tresc: "Nie rozbrajam: w nocy był restart Home Assistant.\nCo zrobić: rozbrój alarm ręcznie przed otwarciem drzwi."
    wyszli_tytul: "Wszyscy wyszli, alarm nieuzbrojony"
    wyszli_tresc: "Nikogo nie ma w domu, a alarm jest rozbrojony.\nCo zrobić: uzbrój alarm przyciskiem poniżej."
    wyszli_kod_tresc: "Nikogo nie ma w domu, a alarm jest rozbrojony.\nCo zrobić: otwórz alarm i uzbrój go kodem."
    uzbrojony_tytul: "Alarm uzbrojony"
    uzbrojony_tresc: "Uzbrojenie: {imie}, z powiadomienia o {godzina}.\nCo zrobić: nic, alarm pilnuje domu."
    uzbroj_odmowa_tytul: "Nie uzbroiłem alarmu"
    uzbroj_odmowa_tresc: "{powod}.\nCo zrobić: popraw to i uzbrój alarm ponownie."
    czujniki_tytul: "Czujnik alarmu nie działa"
    czujniki_tresc: "{lista}.\nCo zrobić: sprawdź zasilanie i zasięg czujnika albo wymień baterię."
    czujnik_niedostepny_teraz: "{czujnik}: brak łączności od ponad 30 min"
    czujnik_niedostepny: "{czujnik}: brak łączności od {godzin} h"
    czujnik_bateria: "{czujnik}: bateria {procent} %"
    czujnik_bateria_slaba: "{czujnik}: słaba bateria"
    powod_zamknij: "Zamknij: {lista}"
    powod_brak_odczytu: "Brak odczytu: {lista}"
    powod_centrala_odmowila: "Centrala odmówiła uzbrojenia (sprawdź jej ustawienia i czujniki)"
    powod_kod: "Centrala wymaga kodu, więc automatyzacja jej nie uzbraja"
    p_wyzwolenie: "Wyzwoliłem alarm: {czujnik} o {godzina}"
    p_alarm: "Alarm: {czujnik} o {godzina}"
    p_zagrozenie: "Zagrożenie: {czujnik} o {godzina}"
    p_przyjete: "Potwierdzenie: {imie} o {godzina}"
    p_noc_uzbrojony: "Uzbroiłem na noc o {godzina}"
    p_noc_juz_uzbrojony: "Nie uzbrajam na noc: alarm już jest uzbrojony"
    p_noc_odmowa: "Nie uzbroiłem na noc: {powod}"
    p_rano_rozbrojony: "Rozbroiłem po nocy o {godzina}"
    p_rano_nie_ruszam: "Nie rozbrajam po nocy: uzbrojenie nie pochodzi od tej automatyzacji"
    p_rano_alarm: "Nie rozbrajam po nocy: w nocy był alarm"
    p_rano_restart: "Nie rozbrajam po nocy: w nocy był restart Home Assistant"
    p_rano_odmowa: "Nie rozbroiłem po nocy: centrala odmówiła"
    p_wyszli: "Przypomnienie: wszyscy wyszli o {godzina}, alarm rozbrojony"
    p_uzbrojony: "Uzbrojenie z powiadomienia: {imie} o {godzina}"
    p_uzbroj_odmowa: "Nie uzbroiłem z powiadomienia: {powod}"
  alarm: !input alarm
  czujniki_obwod: !input czujniki_obwod
  czujniki_ruch: !input czujniki_ruch
  czujniki_zagrozen: !input czujniki_zagrozen
  syreny: !input syreny
  syrena_min: !input syrena_min
  cichy_alarm: !input cichy_alarm
  odbiorcy: !input odbiorcy
  uzbrajaj_na_noc: !input uzbrajaj_na_noc
  cisza_nocna: !input cisza_nocna
  przypomnij_gdy_wyszli: !input przypomnij_gdy_wyszli
  osoby: !input osoby
  pomocnik_powod: !input pomocnik_powod
  nowy_powod: ""
  powod: ""
  tytul: ""
  tresc: ""
  powtorzenia: 5
  odstep_powtorzen_s: 120
  prog_baterii: 15
  obj: "{{ alarm.split('.')[1] }}"
  stan: "{{ states(alarm) }}"
  godzina: "{{ '{:02d}:{:02d}'.format(now().hour, now().minute) }}"
  smart_service: "{{ alarm in integration_entities('smartservice_alarm') }}"
  obsluguje_wyzwolenie: "{{ (state_attr(alarm, 'supported_features') | int(0)) | bitwise_and(8) > 0 }}"
  kod_do_uzbrojenia: "{{ state_attr(alarm, 'code_arm_required') is true }}"
  bez_kodu: "{{ state_attr(alarm, 'code_format') is none }}"
  syrena_s: "{{ (syrena_min | int(3)) * 60 }}"
  wszystkie_czujniki: "{{ (czujniki_obwod + czujniki_ruch + czujniki_zagrozen) | unique | list }}"
  zagrozenie_trwa: "{{ czujniki_zagrozen | select('is_state', 'on') | list | count > 0 }}"
  wlamanie_trwa: >-
    {{ is_state(alarm, 'triggered') and not cichy_alarm and states[alarm] is not none
       and (now() - states[alarm].last_changed).total_seconds() < syrena_s | int }}
  uslugi: >-
    {%- set ids = odbiorcy if odbiorcy | count > 0
          else integration_entities('mobile_app') | map('device_id') | reject('none') | unique | list -%}
    {%- set ns = namespace(l=[]) -%}
    {%- for d in ids -%}
      {%- set n = device_attr(d, 'name') -%}
      {%- if n -%}{%- set ns.l = ns.l + ['notify.mobile_app_' ~ (n | slugify)] -%}{%- endif -%}
    {%- endfor -%}
    {{ ns.l | unique | list }}
  akcja_przyjalem_w: "alarm_przyjalem_w_{{ obj }}"
  akcja_przyjalem_z: "alarm_przyjalem_z_{{ obj }}"
  akcja_uzbroj: "alarm_uzbroj_{{ obj }}"
  tag_wlamanie: "alarm_{{ obj }}_wlamanie"
  tag_przyjete: "alarm_{{ obj }}_przyjete"
  tag_noc: "alarm_{{ obj }}_noc"
  tag_wyszli: "alarm_{{ obj }}_wyszli"
  tag_czujniki: "alarm_{{ obj }}_czujniki"
  tryb_ok: >-
    {{ (trigger.id == 'obwod' and stan in ['armed_away', 'armed_home', 'armed_night', 'armed_vacation'])
       or (trigger.id == 'ruch' and stan in ['armed_away', 'armed_vacation']) }}
  powod_otwartych: >-
    {%- set ns = namespace(otwarte=[], brak=[]) -%}
    {%- for e in (czujniki_obwod + czujniki_ruch) | unique -%}
      {%- set s = states[e] -%}
      {%- if s is none or s.state in ['unavailable', 'unknown'] -%}{%- set ns.brak = ns.brak + [s.name if s is not none else e] -%}
      {%- elif s.state == 'on' -%}{%- set ns.otwarte = ns.otwarte + [s.name] -%}
      {%- endif -%}
    {%- endfor -%}
    {%- if ns.otwarte | count > 0 -%}{{ teksty.powod_zamknij | replace('{lista}', ns.otwarte | join(', ')) }}
    {%- elif ns.brak | count > 0 -%}{{ teksty.powod_brak_odczytu | replace('{lista}', ns.brak | join(', ')) }}
    {%- else -%}{{ teksty.powod_centrala_odmowila }}
    {%- endif -%}

actions:
  - alias: Włamanie - wyzwolenie centrali
    if:
      - condition: template
        value_template: "{{ trigger.id in ['obwod', 'ruch'] and tryb_ok | bool }}"
    then:
      - variables:
          nazwa: "{{ trigger.to_state.name if trigger.to_state is not none else trigger.entity_id }}"
          nowy_powod: "{{ teksty.p_wyzwolenie | replace('{czujnik}', nazwa) | replace('{godzina}', godzina) }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ smart_service }}"
            sequence:
              - action: smartservice_alarm.trigger
                continue_on_error: true
                target:
                  entity_id: !input alarm
                data:
                  czujnik: "{{ nazwa }}"
          - conditions:
              - condition: template
                value_template: "{{ obsluguje_wyzwolenie }}"
            sequence:
              - action: alarm_control_panel.alarm_trigger
                continue_on_error: true
                target:
                  entity_id: !input alarm

  - alias: Włamanie - powiadomienia krytyczne i syreny
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'wyzwolona'
             or (trigger.id in ['obwod', 'ruch'] and tryb_ok | bool and not smart_service and not obsluguje_wyzwolenie) }}
    then:
      - variables:
          przez_centrale: "{{ trigger.id == 'wyzwolona' }}"
          nazwa: >-
            {%- if not przez_centrale -%}{{ trigger.to_state.name if trigger.to_state is not none else trigger.entity_id }}
            {%- elif state_attr(alarm, 'czujnik_wyzwalajacy') -%}{{ state_attr(alarm, 'czujnik_wyzwalajacy') }}
            {%- else -%}
              {%- set ns = namespace(n=teksty.czujnik_centrali, t=0) -%}
              {%- for e in (czujniki_obwod + czujniki_ruch) | unique -%}
                {%- set s = states[e] -%}
                {%- if s is not none and s.last_changed.timestamp() > ns.t
                     and (now() - s.last_changed).total_seconds() < 300 -%}
                  {%- set ns.n = s.name -%}
                  {%- set ns.t = s.last_changed.timestamp() -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.n }}
            {%- endif -%}
          tytul: "{{ teksty.wlamanie_tytul }}"
          tresc: >-
            {{ (teksty.wlamanie_cichy_tresc if cichy_alarm else teksty.wlamanie_tresc)
               | replace('{czujnik}', nazwa) | replace('{godzina}', godzina) }}
          dane:
            tag: "{{ tag_wlamanie }}"
            channel: "{{ teksty.kanal }}"
            importance: high
            priority: high
            ttl: 0
            push:
              sound:
                name: "{{ 'default' }}"
                critical: 1
                volume: 1.0
              interruption-level: critical
            actions:
              - action: "{{ akcja_przyjalem_w }}"
                title: "{{ teksty.przycisk_przyjalem }}"
          nowy_powod: "{{ teksty.p_alarm | replace('{czujnik}', nazwa) | replace('{godzina}', godzina) }}"
      - if:
          - condition: template
            value_template: "{{ przez_centrale and pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"
      - parallel:
          - alias: Syreny włamania
            if:
              - condition: template
                value_template: "{{ not cichy_alarm and syreny | count > 0 }}"
            then:
              - action: siren.turn_on
                continue_on_error: true
                target:
                  entity_id: !input syreny
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input alarm
                    to: disarmed
                  - trigger: state
                    entity_id: !input alarm
                    from: triggered
                timeout:
                  seconds: "{{ syrena_s }}"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ is_state(alarm, 'disarmed')
                         or czujniki_zagrozen | select('is_state', 'on') | list | count == 0 }}
                then:
                  - action: siren.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input syreny
          - alias: Powiadomienie krytyczne z powtórkami
            repeat:
              sequence:
                - repeat:
                    for_each: "{{ uslugi }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        continue_on_error: true
                        data:
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                          data: "{{ dane }}"
                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ akcja_przyjalem_w }}"
                    - trigger: state
                      entity_id: !input alarm
                      to: disarmed
                    - trigger: state
                      entity_id: !input alarm
                      from: triggered
                  timeout:
                    seconds: "{{ odstep_powtorzen_s }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >-
                    {{ wait.trigger is not none or repeat.index > powtorzenia | int
                       or is_state(alarm, 'disarmed')
                       or (przez_centrale and not is_state(alarm, 'triggered')) }}

  - alias: Koniec wyzwolenia - syreny
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'wyzwolenie_koniec' and syreny | count > 0
             and trigger.to_state is not none and trigger.to_state.state != 'disarmed'
             and not zagrozenie_trwa | bool }}
    then:
      - action: siren.turn_off
        continue_on_error: true
        target:
          entity_id: !input syreny

  - alias: Rozbrojenie - syreny zawsze wyłączone
    if:
      - condition: template
        value_template: "{{ trigger.id == 'rozbrojona' and syreny | count > 0 }}"
    then:
      - action: siren.turn_off
        continue_on_error: true
        target:
          entity_id: !input syreny

  - alias: Zagrożenie - syreny i powiadomienie krytyczne
    if:
      - condition: template
        value_template: "{{ trigger.id == 'zagrozenie' }}"
    then:
      - variables:
          czujnik: "{{ trigger.entity_id }}"
          nazwa: "{{ trigger.to_state.name if trigger.to_state is not none else czujnik }}"
          klasa: >-
            {%- set k = state_attr(czujnik, 'device_class') -%}
            {{ k if k in ['smoke', 'carbon_monoxide', 'gas', 'moisture'] else 'inne' }}
          tytul: "{{ teksty['zagrozenie_' ~ klasa] }}"
          tresc: |-
            {{ teksty.zagrozenie_tresc | replace('{czujnik}', nazwa) | replace('{godzina}', godzina) }}
            {{ teksty['co_zrobic_' ~ klasa] }}
          dane:
            tag: "alarm_{{ obj }}_zagrozenie_{{ czujnik.split('.')[1] }}"
            channel: "{{ teksty.kanal }}"
            importance: high
            priority: high
            ttl: 0
            push:
              sound:
                name: "{{ 'default' }}"
                critical: 1
                volume: 1.0
              interruption-level: critical
            actions:
              - action: "{{ akcja_przyjalem_z }}"
                title: "{{ teksty.przycisk_przyjalem }}"
          nowy_powod: "{{ teksty.p_zagrozenie | replace('{czujnik}', nazwa) | replace('{godzina}', godzina) }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"
      - parallel:
          - alias: Syreny zagrożenia
            if:
              - condition: template
                value_template: "{{ syreny | count > 0 }}"
            then:
              - action: siren.turn_on
                continue_on_error: true
                target:
                  entity_id: !input syreny
              - wait_for_trigger:
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: "{{ akcja_przyjalem_z }}"
                  - trigger: state
                    entity_id: !input alarm
                    to: disarmed
                timeout:
                  seconds: "{{ syrena_s }}"
                continue_on_timeout: true
              - alias: Po czasie syreny - wyłącz, gdy czujnik już nie wykrywa zagrożenia
                if:
                  - condition: template
                    value_template: >-
                      {{ wait.trigger is none and is_state(czujnik, 'off')
                         and czujniki_zagrozen | select('is_state', 'on') | list | count == 0
                         and not (is_state(alarm, 'triggered') and not cichy_alarm
                                  and (now() - states[alarm].last_changed).total_seconds() < syrena_s | int) }}
                then:
                  - action: siren.turn_off
                    continue_on_error: true
                    target:
                      entity_id: !input syreny
          - alias: Powiadomienie krytyczne z powtórkami
            repeat:
              sequence:
                - repeat:
                    for_each: "{{ uslugi }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        continue_on_error: true
                        data:
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                          data: "{{ dane }}"
                - wait_for_trigger:
                    - trigger: event
                      event_type: mobile_app_notification_action
                      event_data:
                        action: "{{ akcja_przyjalem_z }}"
                    - trigger: state
                      entity_id: !input alarm
                      to: disarmed
                  timeout:
                    seconds: "{{ odstep_powtorzen_s }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index > powtorzenia | int }}"

  - alias: Zagrożenie minęło - syreny po czasie
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'zagrozenie_koniec' and syreny | count > 0
             and (now() - trigger.from_state.last_changed).total_seconds() >= syrena_s | int
             and not zagrozenie_trwa | bool and not wlamanie_trwa | bool }}
    then:
      - action: siren.turn_off
        continue_on_error: true
        target:
          entity_id: !input syreny

  - alias: PRZYJĄŁEM - zgaś powiadomienie u wszystkich i powiedz, kto przyjął
    if:
      - condition: template
        value_template: "{{ trigger.id in ['przyjalem_w', 'przyjalem_z'] }}"
    then:
      - variables:
          uzytkownik: "{{ trigger.event.context.user_id }}"
          imie: >-
            {{ states.person | selectattr('attributes.user_id', 'defined')
               | selectattr('attributes.user_id', 'eq', uzytkownik)
               | map(attribute='name') | first | default(teksty.ktos, true) }}
          tagi: >-
            {%- if trigger.id == 'przyjalem_w' -%}{{ [tag_wlamanie] }}
            {%- else -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for s in czujniki_zagrozen -%}
                {%- set ns.l = ns.l + ['alarm_' ~ obj ~ '_zagrozenie_' ~ s.split('.')[1]] -%}
              {%- endfor -%}
              {{ ns.l }}
            {%- endif -%}
          pary: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for u in uslugi -%}{%- for t in tagi -%}{%- set ns.l = ns.l + [[u, t]] -%}{%- endfor -%}{%- endfor -%}
            {{ ns.l }}
          tresc: "{{ teksty.przyjete_tresc | replace('{imie}', imie) | replace('{godzina}', godzina) }}"
          nowy_powod: "{{ teksty.p_przyjete | replace('{imie}', imie) | replace('{godzina}', godzina) }}"
      - if:
          - condition: template
            value_template: "{{ trigger.id == 'przyjalem_z' and syreny | count > 0 and not wlamanie_trwa | bool }}"
        then:
          - action: siren.turn_off
            continue_on_error: true
            target:
              entity_id: !input syreny
      - repeat:
          for_each: "{{ pary }}"
          sequence:
            - action: "{{ repeat.item[0] }}"
              continue_on_error: true
              data:
                message: "{{ 'clear_notification' }}"
                data:
                  tag: "{{ repeat.item[1] }}"
      - repeat:
          for_each: "{{ uslugi }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ teksty.przyjete_tytul }}"
                message: "{{ tresc }}"
                data:
                  tag: "{{ tag_przyjete }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Początek ciszy nocnej - uzbrojenie na noc
    if:
      - condition: template
        value_template: "{{ trigger.id == 'noc_start' and uzbrajaj_na_noc }}"
    then:
      - choose:
          - alias: Alarm już uzbrojony albo w trakcie alarmu - nie ruszam
            conditions:
              - condition: template
                value_template: "{{ stan != 'disarmed' }}"
            sequence:
              - variables:
                  nowy_powod: "{{ teksty.p_noc_juz_uzbrojony }}"
          - alias: Centrala wymaga kodu - nie uzbrajam
            conditions:
              - condition: template
                value_template: "{{ kod_do_uzbrojenia | bool or (not smart_service and not bez_kodu | bool) }}"
            sequence:
              - variables:
                  nowy_powod: "{{ teksty.p_noc_odmowa | replace('{powod}', teksty.powod_kod) }}"
                  tresc: "{{ teksty.noc_odmowa_tresc | replace('{powod}', teksty.powod_kod) }}"
              - repeat:
                  for_each: "{{ uslugi }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ teksty.noc_odmowa_tytul }}"
                        message: "{{ tresc }}"
                        data:
                          tag: "{{ tag_noc }}"
        default:
          - action: alarm_control_panel.alarm_arm_night
            continue_on_error: true
            target:
              entity_id: !input alarm
          - wait_template: "{{ states(alarm) in ['arming', 'armed_night'] }}"
            timeout:
              seconds: "{{ 2 if smart_service else 30 }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ states(alarm) in ['arming', 'armed_night'] }}"
            then:
              - variables:
                  nowy_powod: "{{ teksty.p_noc_uzbrojony | replace('{godzina}', godzina) }}"
            else:
              - variables:
                  powod: "{{ powod_otwartych }}"
                  nowy_powod: "{{ teksty.p_noc_odmowa | replace('{powod}', powod) }}"
                  tresc: "{{ teksty.noc_odmowa_tresc | replace('{powod}', powod) }}"
              - repeat:
                  for_each: "{{ uslugi }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ teksty.noc_odmowa_tytul }}"
                        message: "{{ tresc }}"
                        data:
                          tag: "{{ tag_noc }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Obca centrala - pamięć nocy do rana
    if:
      - condition: template
        value_template: >-
          {{ uzbrajaj_na_noc and not smart_service and cisza_nocna != ''
             and states(alarm) in ['arming', 'armed_night']
             and ((trigger.id == 'noc_start' and stan == 'disarmed')
                  or (trigger.id == 'start' and is_state(cisza_nocna, 'on'))) }}
    then:
      - variables:
          po_restarcie: "{{ trigger.id == 'start' }}"
          nowy_powod: ""
      - alias: Czekam na koniec ciszy nocnej albo zmianę stanu centrali
        wait_template: "{{ is_state(cisza_nocna, 'off') or states(alarm) not in ['arming', 'armed_night'] }}"
        timeout:
          hours: 20
        continue_on_timeout: false
      - variables:
          noc_alarm: "{{ states(alarm) in ['pending', 'triggered'] }}"
      - if:
          - condition: template
            value_template: "{{ noc_alarm }}"
        then:
          - alias: W nocy był alarm - czekam do rana
            wait_template: "{{ is_state(cisza_nocna, 'off') }}"
            timeout:
              hours: 20
            continue_on_timeout: false
      - choose:
          - alias: W nocy był alarm albo restart - nie rozbrajam
            conditions:
              - condition: template
                value_template: >-
                  {{ (noc_alarm and not is_state(alarm, 'disarmed'))
                     or (po_restarcie and is_state(alarm, 'armed_night')) }}
            sequence:
              - variables:
                  tresc: "{{ teksty.rano_alarm_tresc if noc_alarm else teksty.rano_restart_tresc }}"
                  nowy_powod: "{{ teksty.p_rano_alarm if noc_alarm else teksty.p_rano_restart }}"
              - repeat:
                  for_each: "{{ uslugi }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ teksty.rano_odmowa_tytul }}"
                        message: "{{ tresc }}"
                        data:
                          tag: "{{ tag_noc }}"
          - alias: Noc bez alarmu - rozbrajam
            conditions:
              - condition: template
                value_template: "{{ not po_restarcie and is_state(cisza_nocna, 'off') and is_state(alarm, 'armed_night') }}"
            sequence:
              - action: alarm_control_panel.alarm_disarm
                continue_on_error: true
                target:
                  entity_id: !input alarm
              - wait_template: "{{ is_state(alarm, 'disarmed') }}"
                timeout:
                  seconds: 30
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ is_state(alarm, 'disarmed') }}"
                then:
                  - variables:
                      nowy_powod: "{{ teksty.p_rano_rozbrojony | replace('{godzina}', godzina) }}"
                else:
                  - variables:
                      nowy_powod: "{{ teksty.p_rano_odmowa }}"
                  - repeat:
                      for_each: "{{ uslugi }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ teksty.rano_odmowa_tytul }}"
                            message: "{{ teksty.rano_odmowa_tresc }}"
                            data:
                              tag: "{{ tag_noc }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' and nowy_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Koniec ciszy nocnej - rozbrojenie po nocy (Smart Service Alarm)
    if:
      - condition: template
        value_template: "{{ trigger.id == 'noc_koniec' and uzbrajaj_na_noc and smart_service and stan == 'armed_night' }}"
    then:
      - choose:
          - alias: Uzbrojenie z automatyzacji bez alarmu - rozbrajam
            conditions:
              - condition: template
                value_template: >-
                  {{ state_attr(alarm, 'uzbrojenie_przez_automat') is true
                     and state_attr(alarm, 'zmiana_przez') == 'automatyzacja' }}
            sequence:
              - action: alarm_control_panel.alarm_disarm
                continue_on_error: true
                target:
                  entity_id: !input alarm
              - wait_template: "{{ is_state(alarm, 'disarmed') }}"
                timeout:
                  seconds: 2
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ is_state(alarm, 'disarmed') }}"
                then:
                  - variables:
                      nowy_powod: "{{ teksty.p_rano_rozbrojony | replace('{godzina}', godzina) }}"
                else:
                  - variables:
                      nowy_powod: "{{ teksty.p_rano_odmowa }}"
                  - repeat:
                      for_each: "{{ uslugi }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ teksty.rano_odmowa_tytul }}"
                            message: "{{ teksty.rano_odmowa_tresc }}"
                            data:
                              tag: "{{ tag_noc }}"
          - alias: Uzbrojenie z automatyzacji, ale w nocy był alarm - nie rozbrajam
            conditions:
              - condition: template
                value_template: >-
                  {{ state_attr(alarm, 'uzbrojenie_przez_automat') is true
                     and state_attr(alarm, 'zmiana_przez') == 'wyzwolenie' }}
            sequence:
              - variables:
                  nowy_powod: "{{ teksty.p_rano_alarm }}"
              - repeat:
                  for_each: "{{ uslugi }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ teksty.rano_odmowa_tytul }}"
                        message: "{{ teksty.rano_alarm_tresc }}"
                        data:
                          tag: "{{ tag_noc }}"
        default:
          - variables:
              nowy_powod: "{{ teksty.p_rano_nie_ruszam }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' and nowy_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Wszyscy wyszli - przypomnienie o rozbrojonym alarmie
    if:
      - condition: template
        value_template: >-
          {%- set ns = namespace(dom=false) -%}
          {%- for e in osoby -%}
            {%- set s = states[e] -%}
            {%- if s is not none and s.state == 'home' -%}
              {%- set ns.dom = true -%}
            {%- elif s is not none and s.state in ['unknown', 'unavailable']
                 and (now() - s.last_changed).total_seconds() < 86400 -%}
              {%- set ns.dom = true -%}
            {%- endif -%}
          {%- endfor -%}
          {{ trigger.id == 'wyjscie' and przypomnij_gdy_wyszli and osoby | count > 0
             and stan == 'disarmed' and not ns.dom }}
    then:
      - variables:
          przycisk: >-
            {%- if kod_do_uzbrojenia | bool -%}
              {{ dict(action='URI', title=teksty.przycisk_otworz, uri='entityId:' ~ alarm) }}
            {%- else -%}
              {{ dict(action=akcja_uzbroj, title=teksty.przycisk_uzbroj) }}
            {%- endif -%}
          tresc: "{{ teksty.wyszli_kod_tresc if kod_do_uzbrojenia | bool else teksty.wyszli_tresc }}"
          nowy_powod: "{{ teksty.p_wyszli | replace('{godzina}', godzina) }}"
      - repeat:
          for_each: "{{ uslugi }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ teksty.wyszli_tytul }}"
                message: "{{ tresc }}"
                data:
                  tag: "{{ tag_wyszli }}"
                  actions: "{{ [przycisk] }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Uzbrój z powiadomienia - tylko bez kodu, nigdy rozbrojenie
    if:
      - condition: template
        value_template: "{{ trigger.id == 'uzbroj' and stan == 'disarmed' and not kod_do_uzbrojenia | bool }}"
    then:
      - variables:
          uzytkownik: "{{ trigger.event.context.user_id }}"
          imie: >-
            {{ states.person | selectattr('attributes.user_id', 'defined')
               | selectattr('attributes.user_id', 'eq', uzytkownik)
               | map(attribute='name') | first | default(teksty.ktos, true) }}
      - action: alarm_control_panel.alarm_arm_away
        continue_on_error: true
        target:
          entity_id: !input alarm
      - wait_template: "{{ states(alarm) in ['arming', 'armed_away'] }}"
        timeout:
          seconds: "{{ 2 if smart_service else 30 }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ states(alarm) in ['arming', 'armed_away'] }}"
        then:
          - variables:
              tytul: "{{ teksty.uzbrojony_tytul }}"
              tresc: "{{ teksty.uzbrojony_tresc | replace('{imie}', imie) | replace('{godzina}', godzina) }}"
              nowy_powod: "{{ teksty.p_uzbrojony | replace('{imie}', imie) | replace('{godzina}', godzina) }}"
        else:
          - variables:
              powod: "{{ powod_otwartych }}"
              tytul: "{{ teksty.uzbroj_odmowa_tytul }}"
              tresc: "{{ teksty.uzbroj_odmowa_tresc | replace('{powod}', powod) }}"
              nowy_powod: "{{ teksty.p_uzbroj_odmowa | replace('{powod}', powod) }}"
      - repeat:
          for_each: "{{ uslugi }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ tytul }}"
                message: "{{ tresc }}"
                data:
                  tag: "{{ tag_wyszli }}"
      - if:
          - condition: template
            value_template: "{{ pomocnik_powod != '' }}"
        then:
          - action: input_text.set_value
            continue_on_error: true
            target:
              entity_id: "{{ pomocnik_powod }}"
            data:
              value: "{{ nowy_powod[:255] }}"

  - alias: Czujnik bez łączności od 30 minut
    if:
      - condition: template
        value_template: "{{ trigger.id == 'niedostepny' }}"
    then:
      - alias: W ciszy nocnej czekam do rana
        wait_template: "{{ cisza_nocna == '' or not is_state(cisza_nocna, 'on') }}"
        timeout:
          hours: 14
        continue_on_timeout: false
      - if:
          - condition: template
            value_template: "{{ is_state(trigger.entity_id, 'unavailable') }}"
        then:
          - variables:
              nazwa: "{{ state_attr(trigger.entity_id, 'friendly_name') or trigger.entity_id }}"
              tresc: >-
                {{ teksty.czujniki_tresc | replace('{lista}', teksty.czujnik_niedostepny_teraz | replace('{czujnik}', nazwa)) }}
          - repeat:
              for_each: "{{ uslugi }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ teksty.czujniki_tytul }}"
                    message: "{{ tresc }}"
                    data:
                      tag: "{{ tag_czujniki }}"

  - alias: Codzienny przegląd czujników - łączność i baterie
    if:
      - condition: template
        value_template: >-
          {{ trigger.id == 'przeglad' and wszystkie_czujniki | count > 0
             and not (cisza_nocna != '' and is_state(cisza_nocna, 'on')) }}
    then:
      - variables:
          problemy: >-
            {%- set ns = namespace(l=[], b=[]) -%}
            {%- for s in wszystkie_czujniki -%}
              {%- set st = states[s] -%}
              {%- set n = st.name if st is not none else s -%}
              {%- if st is not none and st.state == 'unavailable'
                   and (now() - st.last_changed).total_seconds() >= 86400 -%}
                {%- set g = ((now() - st.last_changed).total_seconds() / 3600) | round(0) | int -%}
                {%- set ns.l = ns.l + [teksty.czujnik_niedostepny | replace('{czujnik}', n) | replace('{godzin}', g | string)] -%}
              {%- endif -%}
              {%- set d = device_id(s) -%}
              {%- if d -%}
                {%- for b in device_entities(d) -%}
                  {%- if b != s and b not in ns.b and state_attr(b, 'device_class') == 'battery' -%}
                    {%- if b.startswith('sensor.') and states(b) | is_number and states(b) | float < prog_baterii | float -%}
                      {%- set ns.b = ns.b + [b] -%}
                      {%- set ns.l = ns.l + [teksty.czujnik_bateria | replace('{czujnik}', n) | replace('{procent}', states(b) | float | round(0) | int | string)] -%}
                    {%- elif b.startswith('binary_sensor.') and is_state(b, 'on') -%}
                      {%- set ns.b = ns.b + [b] -%}
                      {%- set ns.l = ns.l + [teksty.czujnik_bateria_slaba | replace('{czujnik}', n)] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
      - if:
          - condition: template
            value_template: "{{ problemy | count > 0 }}"
        then:
          - variables:
              tresc: "{{ teksty.czujniki_tresc | replace('{lista}', problemy | join('; ')) }}"
          - repeat:
              for_each: "{{ uslugi }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ teksty.czujniki_tytul }}"
                    message: "{{ tresc }}"
                    data:
                      tag: "{{ tag_czujniki }}"

  - alias: Start Home Assistant - syreny wyłączone bez alarmu
    if:
      - condition: template
        value_template: "{{ trigger.id == 'start' and syreny | count > 0 and not zagrozenie_trwa | bool }}"
    then:
      - if:
          - condition: template
            value_template: "{{ not is_state(alarm, 'triggered') }}"
        then:
          - action: siren.turn_off
            continue_on_error: true
            target:
              entity_id: !input syreny
        else:
          - alias: Trwa alarm - syreny do końca ustawionego czasu
            wait_for_trigger:
              - trigger: state
                entity_id: !input alarm
                from: triggered
            timeout:
              seconds: >-
                {{ [syrena_s | int - (now() - states[alarm].last_changed).total_seconds() | int, 0] | max }}
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ czujniki_zagrozen | select('is_state', 'on') | list | count == 0 }}"
            then:
              - action: siren.turn_off
                continue_on_error: true
                target:
                  entity_id: !input syreny
