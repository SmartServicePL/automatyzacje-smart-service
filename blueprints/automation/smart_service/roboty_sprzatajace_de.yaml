blueprint:
  name: Smart Service - Reinigungsroboter bei Abwesenheit
  description: |
    Universelle Reinigung mit einem Saug- oder Wischroboter aus Home Assistant
    (jede Integration mit einer vacuum-Entität, z. B. Roborock, Ecovacs, Dreame, Xiaomi, Matter).
    Eine Automatisierung = ein Roboter. Für mehrere Etagen oder Roboter erstellen Sie mehrere
    Automatisierungen aus diesem Blueprint (jede mit eigenem Helfer).

    Der Roboter startet, wenn gleichzeitig:
    - seit der eingestellten Zeit niemand zu Hause ist (oder der Modus ohne Anwesenheit gewählt ist),
    - der Roboter mit ausreichend geladenem Akku in der Station steht,
    - der eingestellte Abstand seit der letzten Reinigung vergangen ist (Datums-Helfer),
    - der optionale Bedarfszähler (z. B. "Schmutz", Nutzungen der Katzentoilette) seine Schwelle erreicht hat,
    - keine Sperre eingeschaltet ist.

    Standardmäßig ist die Reinigung nicht auf Tage oder Uhrzeiten beschränkt. Ausgewählte Wochentage
    und ein Zeitfenster können Sie im Abschnitt "Zeitplan und Anwesenheit" aktivieren.

    Die Reinigung ausgewählter Räume nutzt die Aktion vacuum.clean_area (Home Assistant
    2026.3 oder neuer; die Kartensegmente müssen in den Einstellungen der Roboter-Entität
    Bereichen zugewiesen sein). Ohne ausgewählte Bereiche reinigt der Roboter das ganze Haus (vacuum.start).
    Für Integrationen ohne Bereichsunterstützung können Sie eigene Startaktionen angeben.

    Überwachung: Kommt jemand nach Hause, fährt der Roboter zur Station zurück oder pausiert; ein Fehler,
    eine lange Pause, ein Verbindungsverlust oder zu lange Reinigung senden je Ereignis
    eine Benachrichtigung.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/roboty_sprzatajace_de.yaml
  input:
    robot_sekcja:
      name: Roboter
      icon: mdi:robot-vacuum
      input:
        robot:
          name: Roboter
          selector:
            entity:
              filter:
                - domain: vacuum
        bateria:
          name: Akku des Roboters (optional)
          description: Akkusensor in Prozent. Leer = Akku wird nicht geprüft.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        min_bateria:
          name: Mindest-Akkustand für den Start
          default: 40
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        start_takze_z_idle:
          name: Start auch aus dem Zustand "Untätig" zulassen
          description: Manche Roboter melden nach dem Laden "idle" statt "docked". Nur aktivieren, wenn Ihr Roboter das tut.
          default: false
          selector:
            boolean: {}
        pomocnik_nastepne:
          name: Helfer - früheste nächste Reinigung
          description: >-
            Ein input_datetime-Helfer mit Datum und Uhrzeit. Die Automatisierung speichert
            darin selbst, wann frühestens wieder gereinigt werden darf.
          selector:
            entity:
              filter:
                - domain: input_datetime
    zakres_sekcja:
      name: Was gereinigt wird
      icon: mdi:floor-plan
      input:
        obszary:
          name: Zu reinigende Bereiche (optional)
          description: >-
            Home-Assistant-Bereiche, die den Kartensegmenten des Roboters zugewiesen sind. Leer = das ganze Haus.
            Erfordert Home Assistant 2026.3+ und einen Roboter, der "Bereich reinigen" unterstützt.
          default: []
          selector:
            area:
              multiple: true
        wlasny_start:
          name: Eigene Startaktionen statt der Standardaktionen verwenden
          default: false
          selector:
            boolean: {}
        akcje_startu:
          name: Eigene Startaktionen (optional)
          description: Z. B. eine Aktion der Hersteller-Integration mit Raumliste und Wischmodus. Wird nur verwendet, wenn die Option oben aktiviert ist.
          default: []
          selector:
            action: {}
    harmonogram_sekcja:
      name: Zeitplan und Anwesenheit
      icon: mdi:calendar-clock
      input:
        ogranicz_dni:
          name: Nur an ausgewählten Tagen reinigen
          description: Aus = Reinigung an jedem Wochentag.
          default: false
          selector:
            boolean: {}
        dni:
          name: Reinigungstage
          description: Wird nur verwendet, wenn die Option oben aktiviert ist.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Montag
                  value: mon
                - label: Dienstag
                  value: tue
                - label: Mittwoch
                  value: wed
                - label: Donnerstag
                  value: thu
                - label: Freitag
                  value: fri
                - label: Samstag
                  value: sat
                - label: Sonntag
                  value: sun
        ogranicz_godziny:
          name: Nur zu ausgewählten Uhrzeiten reinigen
          description: Aus = Start zu jeder Tageszeit.
          default: false
          selector:
            boolean: {}
        okno_od:
          name: Beginn des Reinigungsfensters
          description: Wird nur verwendet, wenn die Option oben aktiviert ist. Das Fenster darf über Mitternacht gehen.
          default: "09:00:00"
          selector:
            time: {}
        okno_do:
          name: Ende des Reinigungsfensters (spätester Start)
          description: Wird nur verwendet, wenn "Nur zu ausgewählten Uhrzeiten reinigen" aktiviert ist.
          default: "16:00:00"
          selector:
            time: {}
        odstep_godz:
          name: Abstand zwischen zwei Reinigungen
          default: 44
          selector:
            number:
              min: 4
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        ponowienie_godz:
          name: Erneuter Versuch nach fehlgeschlagener oder abgebrochener Reinigung
          default: 3
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        min_czas_sprzatania_min:
          name: Reinigung gilt als erledigt nach
          description: Wie viele Minuten der Roboter ohne Unterbrechung reinigen muss, damit die Reinigung als erledigt gilt.
          default: 15
          selector:
            number:
              min: 3
              max: 120
              step: 1
              unit_of_measurement: min
              mode: slider
        tryb_obecnosci:
          name: Wann gereinigt wird
          default: pusty_dom
          selector:
            select:
              options:
                - label: Nur wenn niemand zu Hause ist
                  value: pusty_dom
                - label: Im Zeitfenster, unabhängig von der Anwesenheit
                  value: zawsze
        obecnosc:
          name: Haushaltsmitglieder und Anwesenheitssensoren
          description: >-
            Personen (person), Geräte (device_tracker), Gruppen oder Anwesenheitssensoren
            (Zustand "on" = jemand ist da). Ein unbekannter Zustand gilt als Anwesenheit.
            Wählen Sie keine Bewegungsmelder in Räumen mit Haustieren.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: device_tracker
                - domain: group
                - domain: binary_sensor
                - domain: input_boolean
        opoznienie_min:
          name: Start, wenn das Haus so viele Minuten leer ist
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        reakcja_powrot:
          name: Wenn jemand während der Reinigung zurückkommt
          default: dock
          selector:
            select:
              options:
                - label: Roboter zur Station schicken (er reinigt später zu Ende)
                  value: dock
                - label: Roboter anhalten
                  value: pause
                - label: Weiter reinigen
                  value: none
        potrzeba:
          name: Zähler für den Reinigungsbedarf (optional)
          description: Z. B. ein input_number "Schmutz" oder ein Zähler für die Nutzungen der Katzentoilette. Start erst ab der Schwelle unten.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_number
                - domain: counter
                - domain: sensor
        prog_potrzeby:
          name: Schwelle des Bedarfszählers
          default: 100
          selector:
            number:
              min: 1
              max: 1000
              step: 1
              mode: box
        blokady:
          name: Sperren (optional)
          description: Schalter oder Sensoren, deren Zustand "on" die Reinigung sperrt (Gäste, Urlaub, offene Tür).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
    nadzor_sekcja:
      name: Überwachung und Benachrichtigungen
      icon: mdi:bell-alert
      input:
        pauza_alarm_min:
          name: Bei einer Pause benachrichtigen, die länger dauert als
          default: 20
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider
        max_czas_godz:
          name: Zeitlimit der Reinigung (danach Rückkehr zur Station)
          default: 4
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: box
        akcje_po_sprzataniu:
          name: Aktionen nach erledigter Reinigung (optional)
          description: Z. B. Zurücksetzen des Bedarfszählers. Wird ausgeführt, wenn die Reinigung als erledigt gilt.
          default: []
          selector:
            action: {}
        powiadom_o_starcie:
          name: Auch über den Start und über Unterbrechungen wegen heimkehrender Haushaltsmitglieder benachrichtigen
          default: false
          selector:
            boolean: {}
        akcje_powiadomien:
          name: Benachrichtigungsaktionen
          description: >-
            Aktionen, die bei jeder Benachrichtigung ausgeführt werden, z. B. notify.mobile_app_handy.
            Verfügbare Variablen: {{ tytul }} (Titel) und {{ tresc }} (Text). Leer = keine Benachrichtigungen.
          default: []
          selector:
            action: {}

mode: queued
max: 10
max_exceeded: silent
trace:
  stored_traces: 20

triggers:
  - trigger: time
    at: !input okno_od
    id: sprawdz
  - trigger: time_pattern
    minutes: "/10"
    id: sprawdz
  - trigger: state
    entity_id: !input obecnosc
    to: ~
    id: obecnosc
  - trigger: state
    entity_id: !input robot
    to: cleaning
    for:
      minutes: !input min_czas_sprzatania_min
    id: sprzatanie_potwierdzone
  - trigger: state
    entity_id: !input robot
    to: error
    for:
      minutes: 1
    id: blad
  - trigger: state
    entity_id: !input robot
    to: paused
    for:
      minutes: !input pauza_alarm_min
    id: pauza
  - trigger: state
    entity_id: !input robot
    to: unavailable
    for:
      minutes: 30
    id: niedostepny
  - trigger: state
    entity_id: !input robot
    to: cleaning
    for:
      hours: !input max_czas_godz
    id: za_dlugo

variables:
  robot: !input robot
  bateria: !input bateria
  min_bateria: !input min_bateria
  start_takze_z_idle: !input start_takze_z_idle
  pomocnik_nastepne: !input pomocnik_nastepne
  obszary: !input obszary
  wlasny_start: !input wlasny_start
  odstep_godz: !input odstep_godz
  ponowienie_godz: !input ponowienie_godz
  tryb_obecnosci: !input tryb_obecnosci
  obecnosc: !input obecnosc
  opoznienie_min: !input opoznienie_min
  reakcja_powrot: !input reakcja_powrot
  potrzeba: !input potrzeba
  prog_potrzeby: !input prog_potrzeby
  blokady: !input blokady
  powiadom_o_starcie: !input powiadom_o_starcie
  ogranicz_dni: !input ogranicz_dni
  dni: !input dni
  ogranicz_godziny: !input ogranicz_godziny
  okno_od: !input okno_od
  okno_do: !input okno_do
  max_czas_godz: !input max_czas_godz
  nazwa: "{{ state_attr(robot, 'friendly_name') or robot }}"
  ktos_w_domu: >-
    {%- set ns = namespace(dom=false) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- set d = e.split('.')[0] -%}
      {%- if s is none or s.state in ['unknown', 'unavailable'] -%}
        {%- set ns.dom = true -%}
      {%- elif d in ['person', 'device_tracker'] and s.state == 'home' -%}
        {%- set ns.dom = true -%}
      {%- elif d in ['binary_sensor', 'input_boolean'] and s.state == 'on' -%}
        {%- set ns.dom = true -%}
      {%- elif d == 'group' and s.state in ['home', 'on'] -%}
        {%- set ns.dom = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.dom }}
  minut_pustego_domu: >-
    {%- set ns = namespace(ost=0) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- if s is not none and s.last_changed.timestamp() > ns.ost -%}
        {%- set ns.ost = s.last_changed.timestamp() -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ((now().timestamp() - ns.ost) / 60) | round(0) | int if ns.ost > 0 else 0 }}
  powod_blokady: >-
    {%- set teraz = now().timestamp() -%}
    {%- set nastepne = state_attr(pomocnik_nastepne, 'timestamp') | float(0) -%}
    {%- set stany_startu = ['docked', 'idle'] if start_takze_z_idle else ['docked'] -%}
    {%- set dzien = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] -%}
    {%- set od = today_at(okno_od) -%}
    {%- set do = today_at(okno_do) -%}
    {%- set w_oknie = (od <= now() < do) if od <= do else (now() >= od or now() < do) -%}
    {%- set ns = namespace(blokada=false) -%}
    {%- for e in blokady -%}
      {%- if is_state(e, 'on') -%}{%- set ns.blokada = true -%}{%- endif -%}
    {%- endfor -%}
    {%- if ogranicz_dni and dzien not in dni -%}
      heute ist kein Reinigungstag
    {%- elif ogranicz_godziny and not w_oknie -%}
      außerhalb des Reinigungsfensters {{ okno_od[:5] }}-{{ okno_do[:5] }}
    {%- elif not wlasny_start and obszary | length > 0
          and not (state_attr(robot, 'supported_features') | int(0)) | bitwise_and(16384) -%}
      der Roboter unterstützt keine Bereichsreinigung - entfernen Sie die Bereiche oder verwenden Sie eigene Startaktionen
    {%- elif states(robot) not in stany_startu -%}
      der Roboter steht nicht in der Station (Zustand: {{ states(robot) }})
    {%- elif nastepne > teraz -%}
      zu früh, nächste Reinigung ab {{ nastepne | timestamp_custom('%d.%m %H:%M') }}
    {%- elif bateria and states(bateria) | float(-1) < 0 -%}
      kein Akkuwert verfügbar
    {%- elif bateria and states(bateria) | float(0) < min_bateria | float(0) -%}
      Akku {{ states(bateria) }} %, Minimum {{ min_bateria | int }} %
    {%- elif tryb_obecnosci == 'pusty_dom' and obecnosc | length == 0 -%}
      keine Haushaltsmitglieder ausgewählt, der Modus erfordert aber ein leeres Haus
    {%- elif tryb_obecnosci == 'pusty_dom' and ktos_w_domu | bool -%}
      jemand ist zu Hause
    {%- elif tryb_obecnosci == 'pusty_dom' and minut_pustego_domu | int < opoznienie_min | int -%}
      Haus erst seit {{ minut_pustego_domu }} min leer
    {%- elif potrzeba and states(potrzeba) | float(-1) < prog_potrzeby | float -%}
      Bedarfszähler {{ states(potrzeba) }} unter der Schwelle {{ prog_potrzeby }}
    {%- elif ns.blokada -%}
      eine Reinigungssperre ist eingeschaltet
    {%- endif -%}

actions:
  - choose:
      - alias: Bedingungen prüfen und Reinigung starten
        conditions:
          - condition: trigger
            id: sprawdz
          - condition: template
            value_template: "{{ powod_blokady | trim == '' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wlasny_start }}"
                sequence: !input akcje_startu
              - conditions:
                  - condition: template
                    value_template: "{{ obszary | length > 0 }}"
                sequence:
                  - action: vacuum.clean_area
                    continue_on_error: true
                    target:
                      entity_id: !input robot
                    data:
                      cleaning_area_id: !input obszary
            default:
              - action: vacuum.start
                continue_on_error: true
                target:
                  entity_id: !input robot
          - wait_template: "{{ states(robot) in ['cleaning', 'returning', 'paused', 'error'] }}"
            timeout:
              minutes: 3
            continue_on_timeout: true
          - alias: Bis zur Bestätigung der Reinigung nicht erneut starten
            action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ not wait.completed }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: nicht gestartet"
                  tresc: >-
                    Der Roboter hat nach dem Startbefehl nicht mit der Reinigung begonnen (Zustand: {{ states(robot) }}).
                    Nächster Versuch frühestens in {{ ponowienie_godz }} h.
              - sequence: !input akcje_powiadomien
            else:
              - if:
                  - condition: template
                    value_template: "{{ powiadom_o_starcie }}"
                then:
                  - variables:
                      tytul: "{{ nazwa }}: Reinigung gestartet"
                      tresc: Der Roboter hat die Station um {{ now().strftime('%H:%M') }} verlassen.
                  - sequence: !input akcje_powiadomien

      - alias: Reinigung bestätigt - nächsten Termin festlegen
        conditions:
          - condition: trigger
            id: sprzatanie_potwierdzone
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (odstep_godz | float(44)) * 3600) | int }}"
          - sequence: !input akcje_po_sprzataniu

      - alias: Haushaltsmitglied während der Reinigung zurückgekehrt
        conditions:
          - condition: trigger
            id: obecnosc
          - condition: template
            value_template: >-
              {{ tryb_obecnosci == 'pusty_dom' and reakcja_powrot != 'none'
                 and ktos_w_domu | bool and is_state(robot, 'cleaning') }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ reakcja_powrot == 'pause' }}"
            then:
              - action: vacuum.pause
                target:
                  entity_id: !input robot
            else:
              - action: vacuum.return_to_base
                target:
                  entity_id: !input robot
              - alias: Später zu Ende reinigen - kurze Wartezeit bis zum erneuten Versuch
                action: input_datetime.set_datetime
                target:
                  entity_id: !input pomocnik_nastepne
                data:
                  timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - if:
              - condition: template
                value_template: "{{ powiadom_o_starcie }}"
            then:
              - variables:
                  tytul: "{{ nazwa }}: Reinigung unterbrochen"
                  tresc: >-
                    Jemand ist nach Hause gekommen - der Roboter
                    {{ 'wartet an Ort und Stelle (setzen Sie ihn manuell fort)' if reakcja_powrot == 'pause' else 'fährt zur Station zurück und reinigt später zu Ende' }}.
              - sequence: !input akcje_powiadomien

      - alias: Zeitlimit der Reinigung
        conditions:
          - condition: trigger
            id: za_dlugo
        sequence:
          - action: vacuum.return_to_base
            target:
              entity_id: !input robot
          - action: input_datetime.set_datetime
            target:
              entity_id: !input pomocnik_nastepne
            data:
              timestamp: "{{ (now().timestamp() + (ponowienie_godz | float(3)) * 3600) | int }}"
          - variables:
              tytul: "{{ nazwa }} benötigt Aufmerksamkeit"
              tresc: >-
                Der Roboter reinigt seit mehr als {{ max_czas_godz }} h - er wurde zur Station zurückgeschickt.
                Prüfen Sie, ob er feststeckt.
          - sequence: !input akcje_powiadomien

      - alias: Problem mit dem Roboter - eine Benachrichtigung pro Ereignis
        conditions:
          - condition: trigger
            id: [blad, pauza, niedostepny]
        sequence:
          - variables:
              tytul: "{{ nazwa }} benötigt Aufmerksamkeit"
              tresc: >-
                {%- set opis = state_attr(robot, 'error') or state_attr(robot, 'status') -%}
                {%- if trigger.id == 'blad' -%}
                  Der Roboter hat einen Fehler gemeldet{{ (': ' ~ opis) if opis else '' }}. Prüfen Sie Roboter und Station (Wassertanks, Staubbeutel, Bürsten).
                {%- elif trigger.id == 'pauza' -%}
                  Der Roboter pausiert schon seit {{ ((now() - states[robot].last_changed).total_seconds() // 60) | int }} min.
                {%- else -%}
                  Seit 30 min keine Verbindung zum Roboter. Prüfen Sie die Stromversorgung der Station und das WLAN.
                {%- endif -%}
          - sequence: !input akcje_powiadomien
