blueprint:
  name: Smart Service - smart cleaning robot
  description: |
    The robot cleans when the home is dirty, not on a rigid schedule.
    Works with any robot that has a vacuum entity. One automation = one robot.

    The dirt counter grows over time, when someone is home, when doors are opened
    (more after rain) and when the litter box is used. The robot starts:
    - on empty-home days and hours, when everyone has left and dirt passed part of the threshold,
    - in the regular time window, when dirt passed the full threshold,
    - always after the maximum gap between cleanings.
    Never during quiet night, on low battery or more often than the set interval.

    Supervision: a cleaning counts as done only after returning to the dock, when the robot
    worked long enough and cleaned its typical area. A pause without
    an error code is resumed, an error sends a notification and reminders.
    Every decision has a reason stored in a text helper.

    Preview mode: the automation only records what it would do and sends no commands.

    Helpers (without initial value): Date and time, Number 0-300,
    Text (max. 255 characters) for the state, Text (max. 255 characters) for the reason.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/SmartServicePL/automatyzacje-smart-service/blob/main/blueprints/automation/smart_service/roboty_inteligentne_en.yaml
  input:
    robot_sekcja:
      name: Robot
      icon: mdi:robot-vacuum
      input:
        robot:
          name: Robot
          selector:
            entity:
              filter:
                - domain: vacuum
        bateria:
          name: Robot battery (optional)
          description: Battery sensor in percent. Empty = no battery check.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery
        min_bateria:
          name: Minimum battery to start
          default: 40
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        sensor_bledu:
          name: Robot error sensor (optional)
          description: Sensor with an error code or description. State "OK", "0" or "brak" means no error.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sensor_alarmow_stacji:
          name: Dock alarm sensor (optional)
          description: Sensor for dock problems (water, bag, tanks). State "OK" means no problem.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sensor_powierzchni:
          name: Cleaned area sensor (optional)
          description: Area of the current or last cleaning in m². Used to recognise a full cleaning.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sensor_czasu:
          name: Cleaning time sensor (optional)
          description: Duration of the current or last cleaning (seconds, minutes or hours).
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        start_takze_z_idle:
          name: Also allow start from the "idle" state
          description: Some robots report "idle" instead of "docked" after charging. Enable only if your robot does that.
          default: false
          selector:
            boolean: {}
        reakcja_powrot:
          name: When someone returns to the empty home during cleaning
          default: dock
          selector:
            select:
              options:
                - label: Send the robot to the dock (finishes later)
                  value: dock
                - label: Pause the robot (if the robot supports it)
                  value: pause
                - label: Keep cleaning
                  value: none
        obszary:
          name: Areas to clean (optional)
          description: >-
            Home Assistant areas assigned to the robot's map segments. Empty = whole home.
            Requires Home Assistant 2026.3+ and a robot that supports "Clean area".
          default: []
          selector:
            area:
              multiple: true
        wlasny_start:
          name: Use own start actions instead of the standard ones
          default: false
          selector:
            boolean: {}
        akcje_startu:
          name: Own start actions (optional)
          description: E.g. a manufacturer integration action with a room list and mopping mode. Used only after enabling the option above.
          default: []
          selector:
            action: {}
    pomocniki_sekcja:
      name: Helpers (automation state)
      icon: mdi:database
      input:
        pomocnik_nastepne:
          name: Helper - earliest next start
          description: Date and time helper (with date and time). The automation sets it itself.
          selector:
            entity:
              filter:
                - domain: input_datetime
        pomocnik_brud:
          name: Helper - dirt counter
          description: Number helper (min 0, max 300). The automation sets it itself.
          selector:
            entity:
              filter:
                - domain: input_number
        pomocnik_stan:
          name: Helper - robot state
          description: Text helper with max. length 255 characters. The automation stores its state there.
          selector:
            entity:
              filter:
                - domain: input_text
        pomocnik_powod:
          name: Helper - reason for the last decision
          description: Text helper with max. length 255 characters. Shows why the robot cleans or waits.
          selector:
            entity:
              filter:
                - domain: input_text
        tryb_podgladu:
          name: Preview mode
          description: On = the automation only records what it would do and sends no commands to the robot.
          default: true
          selector:
            boolean: {}
    brud_sekcja:
      name: Dirt counter
      icon: mdi:shoe-print
      input:
        pkt_baza:
          name: Points every hour
          description: E.g. 1 when there are pets at home, 0 without pets.
          default: 1
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box
        pkt_obecnosc:
          name: Points every hour when someone is home (7-22)
          default: 3
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box
        pkt_drzwi:
          name: Points per door opening
          default: 2
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box
        pkt_kuweta:
          name: Points per litter box use
          default: 1
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box
        drzwi:
          name: Outside doors (optional)
          description: Every opening adds points, doubled after rain.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        pogoda_opad_24h_wstecz:
          name: Rain in the last 24 hours - main source (optional)
          description: Rain sensor in mm. When set and available, it takes priority. At least 1 mm = wet.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        pogoda_deszcz_teraz:
          name: Raining now - main source (optional)
          description: Rain sensor (on = raining) or rain rate sensor (above 0 = raining).
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: sensor
        deszcz_24h:
          name: Rain in the last 24 hours - fallback (optional)
          description: Rain sensor in mm, used when there is no main source. At least 1 mm = wet, door points are doubled.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        prognoza:
          name: Weather (optional)
          description: Weather entity used when there is no main source and no 24-hour rain sensor. Rain now = wet.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        kuweta_licznik:
          name: Litter box use counter (optional)
          description: Increasing litter box use counter. A drop (e.g. reset at midnight) is ignored.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: counter
                - domain: input_number
        kuweta_prog:
          name: Quick cleaning after this many litter box uses
          default: 4
          selector:
            number:
              min: 1
              max: 20
              step: 1
              mode: box
        kuweta_obszar:
          name: Quick cleaning area at the litter box (optional)
          description: Requires a robot that supports "Clean area". Empty = no quick cleaning.
          default: []
          selector:
            area:
              multiple: true
        potrzeba:
          name: Own need counter instead of the dirt counter (optional)
          description: E.g. an input_number counted by another automation. Empty = dirt counter of this automation.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_number
                - domain: counter
                - domain: sensor
        prog_potrzeby:
          name: Dirt threshold
          default: 100
          selector:
            number:
              min: 1
              max: 300
              step: 1
              mode: box
    harmonogram_sekcja:
      name: When to clean
      icon: mdi:calendar-clock
      input:
        tryb_obecnosci:
          name: Mode
          default: pusty_dom
          selector:
            select:
              options:
                - label: Empty home with a lower threshold and the regular window
                  value: pusty_dom
                - label: Only the regular window, regardless of presence
                  value: zawsze
        obecnosc:
          name: Household members
          description: >-
            People (person) with a working tracker. An unknown state for less than a day
            counts as presence. Do not choose motion sensors in a home with pets.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: person
                - domain: device_tracker
                - domain: group
                - domain: binary_sensor
                - domain: input_boolean
        pomin_nieznane:
          name: Skip household members whose state is unknown for more than a day
          default: true
          selector:
            boolean: {}
        opoznienie_min:
          name: Start after this many minutes of an empty home
          default: 10
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        pusty_dom_dni:
          name: Empty-home days
          default: [mon, tue, wed, thu, fri]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        pusty_dom_od:
          name: Empty home - window start
          default: "08:15:00"
          selector:
            time: {}
        pusty_dom_do:
          name: Empty home - window end (latest start)
          default: "13:30:00"
          selector:
            time: {}
        pusty_dom_procent:
          name: Empty home - this percentage of the dirt threshold is enough
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        ogranicz_godziny:
          name: Regular time window
          description: Off = regular start at any time (outside quiet night).
          default: true
          selector:
            boolean: {}
        okno_od:
          name: Regular window - start
          default: "12:00:00"
          selector:
            time: {}
        okno_do:
          name: Regular window - end (latest start)
          default: "18:00:00"
          selector:
            time: {}
        ogranicz_dni:
          name: Regular window only on selected days
          default: false
          selector:
            boolean: {}
        dni:
          name: Regular window days
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        odstep_godz:
          name: Not more often than every
          default: 12
          selector:
            number:
              min: 2
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        maks_przerwa_godz:
          name: Maximum gap between cleanings
          description: After this time the robot cleans regardless of the dirt counter (within the time window).
          default: 48
          selector:
            number:
              min: 6
              max: 336
              step: 1
              unit_of_measurement: h
              mode: box
        ponowienie_godz:
          name: Retry after a failed or interrupted cleaning
          default: 3
          selector:
            number:
              min: 0.5
              max: 24
              step: 0.5
              unit_of_measurement: h
              mode: box
        cisza_nocna:
          name: Quiet night (optional)
          description: Switch or schedule. On = no start, resume or reminders.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
                - domain: schedule
                - domain: binary_sensor
        blokady:
          name: Blockers (optional)
          description: Switches or sensors whose "on" state blocks cleaning (guests, holiday).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_boolean
                - domain: binary_sensor
                - domain: switch
    nadzor_sekcja:
      name: Supervision and notifications
      icon: mdi:bell-alert
      input:
        min_czas_sprzatania_min:
          name: A full cleaning lasts at least
          description: Time from start to return to the dock.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: min
              mode: box
        potwierdzenie_w_stacji_min:
          name: Cleaning ends after this many minutes at the dock
          description: Longer than mop washing during cleaning.
          default: 10
          selector:
            number:
              min: 3
              max: 60
              step: 1
              unit_of_measurement: min
              mode: box
        min_powierzchnia_procent:
          name: Full cleaning - at least this percentage of the typical area
          description: The typical area is the median of the last 5 full cleanings.
          default: 70
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        max_czas_godz:
          name: Cleaning time limit (then return to the dock)
          default: 5
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: box
        utknal_godz:
          name: Robot is stuck after this many hours without a state change away from the dock
          default: 2
          selector:
            number:
              min: 0.5
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: box
        wznowienia_max:
          name: Resumes after a pause without an error code
          default: 2
          selector:
            number:
              min: 0
              max: 5
              step: 1
              mode: box
        pauza_alarm_min:
          name: Pause longer than
          default: 10
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: slider
        przypomnienie_godz:
          name: Remind about a problem every
          default: 6
          selector:
            number:
              min: 1
              max: 48
              step: 1
              unit_of_measurement: h
              mode: box
        akcje_po_sprzataniu:
          name: Actions after a full cleaning (optional)
          default: []
          selector:
            action: {}
        powiadom_o_starcie:
          name: Notify when cleaning starts
          default: false
          selector:
            boolean: {}
        powiadom_o_koncu:
          name: Notify when a full cleaning is finished
          default: false
          selector:
            boolean: {}
        akcje_powiadomien:
          name: Notification actions
          description: >-
            Actions run for every notification, e.g. notify.mobile_app_phone.
            Variables: {{ tytul }}, {{ tresc }}, {{ tag }} (the same for one problem)
            and {{ typ }} (problem, przypomnienie, rozwiazany, informacja). Empty = no notifications.
          default: []
          selector:
            action: {}

mode: queued
max: 20
max_exceeded: silent
trace:
  stored_traces: 50

triggers:
  - trigger: time_pattern
    minutes: "/5"
    id: cykl
  - trigger: homeassistant
    event: start
    id: cykl
  - trigger: time_pattern
    minutes: "0"
    id: godzina
  - trigger: state
    entity_id: !input drzwi
    from: "off"
    to: "on"
    id: drzwi
  - trigger: state
    entity_id: !input obecnosc
    to: ~
    id: obecnosc

variables:
  robot: !input robot
  bateria: !input bateria
  min_bateria: !input min_bateria
  sensor_bledu: !input sensor_bledu
  sensor_alarmow_stacji: !input sensor_alarmow_stacji
  sensor_powierzchni: !input sensor_powierzchni
  sensor_czasu: !input sensor_czasu
  start_takze_z_idle: !input start_takze_z_idle
  reakcja_powrot: !input reakcja_powrot
  obszary: !input obszary
  wlasny_start: !input wlasny_start
  pomocnik_nastepne: !input pomocnik_nastepne
  pomocnik_brud: !input pomocnik_brud
  pomocnik_stan: !input pomocnik_stan
  pomocnik_powod: !input pomocnik_powod
  tryb_podgladu: !input tryb_podgladu
  pkt_baza: !input pkt_baza
  pkt_obecnosc: !input pkt_obecnosc
  pkt_drzwi: !input pkt_drzwi
  pkt_kuweta: !input pkt_kuweta
  pogoda_opad_24h_wstecz: !input pogoda_opad_24h_wstecz
  pogoda_deszcz_teraz: !input pogoda_deszcz_teraz
  deszcz_24h: !input deszcz_24h
  prognoza: !input prognoza
  kuweta_licznik: !input kuweta_licznik
  kuweta_prog: !input kuweta_prog
  kuweta_obszar: !input kuweta_obszar
  potrzeba: !input potrzeba
  prog_potrzeby: !input prog_potrzeby
  tryb_obecnosci: !input tryb_obecnosci
  obecnosc: !input obecnosc
  pomin_nieznane: !input pomin_nieznane
  opoznienie_min: !input opoznienie_min
  pusty_dom_dni: !input pusty_dom_dni
  pusty_dom_od: !input pusty_dom_od
  pusty_dom_do: !input pusty_dom_do
  pusty_dom_procent: !input pusty_dom_procent
  ogranicz_godziny: !input ogranicz_godziny
  okno_od: !input okno_od
  okno_do: !input okno_do
  ogranicz_dni: !input ogranicz_dni
  dni: !input dni
  odstep_godz: !input odstep_godz
  maks_przerwa_godz: !input maks_przerwa_godz
  ponowienie_godz: !input ponowienie_godz
  cisza_nocna: !input cisza_nocna
  blokady: !input blokady
  min_czas_sprzatania_min: !input min_czas_sprzatania_min
  potwierdzenie_w_stacji_min: !input potwierdzenie_w_stacji_min
  min_powierzchnia_procent: !input min_powierzchnia_procent
  max_czas_godz: !input max_czas_godz
  utknal_godz: !input utknal_godz
  wznowienia_max: !input wznowienia_max
  pauza_alarm_min: !input pauza_alarm_min
  przypomnienie_godz: !input przypomnienie_godz
  powiadom_o_starcie: !input powiadom_o_starcie
  powiadom_o_koncu: !input powiadom_o_koncu
  nazwa: "{{ state_attr(robot, 'friendly_name') or robot }}"
  teraz: "{{ now().timestamp() | int }}"
  st: "{{ states(robot) }}"
  od_zmiany: "{{ ((now() - states[robot].last_changed).total_seconds()) | int if states[robot] is not none else 0 }}"
  noc: "{{ cisza_nocna != '' and is_state(cisza_nocna, 'on') }}"
  funkcje: "{{ state_attr(robot, 'supported_features') | int(0) }}"
  ma_obszary: "{{ (funkcje | bitwise_and(16384)) > 0 }}"
  ma_pauze: "{{ (funkcje | bitwise_and(4)) > 0 }}"
  stany_stacji: "{{ ['docked', 'idle'] if start_takze_z_idle else ['docked'] }}"
  kod_bledu: >-
    {%- set ns = namespace(k='') -%}
    {%- if sensor_bledu != '' -%}
      {%- set v = states(sensor_bledu) | string -%}
      {%- if v | lower not in ['ok', '0', 'none', 'brak', 'unknown', 'unavailable', ''] -%}{%- set ns.k = v -%}{%- endif -%}
    {%- endif -%}
    {%- if sensor_bledu == '' and state_attr(robot, 'fault_code_description') not in [none, '', 0, '0'] and (state_attr(robot, 'fault_code') | string) not in ['0', ''] -%}
      {%- set ns.k = state_attr(robot, 'fault_code_description') | string -%}
    {%- endif -%}
    {{ ns.k[:120] }}
  stacja_problem: >-
    {{ sensor_alarmow_stacji != ''
       and (states(sensor_alarmow_stacji) | string | lower) not in ['ok', '0', 'none', 'brak', 'unknown', 'unavailable', ''] }}
  ktos_w_domu: >-
    {%- set ns = namespace(dom=false) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- set d = e.split('.')[0] -%}
      {%- if s is none -%}
        {%- if not pomin_nieznane -%}
          {%- set ns.dom = true -%}
        {%- endif -%}
      {%- elif s.state in ['unknown', 'unavailable'] -%}
        {%- if not (pomin_nieznane and (now() - s.last_changed).total_seconds() > 86400) -%}
          {%- set ns.dom = true -%}
        {%- endif -%}
      {%- elif d in ['person', 'device_tracker'] and s.state == 'home' -%}
        {%- set ns.dom = true -%}
      {%- elif d in ['binary_sensor', 'input_boolean'] and s.state == 'on' -%}
        {%- set ns.dom = true -%}
      {%- elif d == 'group' and s.state in ['home', 'on'] -%}
        {%- set ns.dom = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.dom }}
  minut_pustego_domu: >-
    {%- set ns = namespace(ost=0) -%}
    {%- for e in obecnosc -%}
      {%- set s = states[e] -%}
      {%- if s is not none and s.last_changed.timestamp() > ns.ost -%}
        {%- set ns.ost = s.last_changed.timestamp() -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ((now().timestamp() - ns.ost) / 60) | round(0) | int if ns.ost > 0 else 0 }}
  zrodlo_pogody: >-
    {%- set opad_ok = pogoda_opad_24h_wstecz != '' and states(pogoda_opad_24h_wstecz) | is_number -%}
    {%- set teraz_ok = pogoda_deszcz_teraz != '' and states(pogoda_deszcz_teraz) not in ['unknown', 'unavailable', ''] -%}
    {%- set glowne = pogoda_opad_24h_wstecz != '' or pogoda_deszcz_teraz != '' -%}
    {%- set zapas_ok = (deszcz_24h != '' and states(deszcz_24h) | is_number)
                       or (prognoza != '' and states(prognoza) not in ['unknown', 'unavailable', '']) -%}
    {%- if opad_ok or teraz_ok -%}glowne
    {%- elif zapas_ok -%}{{ 'rezerwa' if glowne else 'zapas' }}
    {%- elif pogoda_opad_24h_wstecz != '' -%}nieznane
    {%- else -%}brak
    {%- endif -%}
  mokro: >-
    {%- if zrodlo_pogody == 'glowne' -%}
      {%- set t = states(pogoda_deszcz_teraz) if pogoda_deszcz_teraz != '' else '' -%}
      {{ (pogoda_opad_24h_wstecz != '' and states(pogoda_opad_24h_wstecz) | float(0) >= 1)
         or t == 'on' or (t | is_number and t | float(0) > 0) }}
    {%- elif zrodlo_pogody in ['rezerwa', 'zapas'] -%}
      {%- if deszcz_24h != '' and states(deszcz_24h) | is_number -%}
        {{ states(deszcz_24h) | float(0) >= 1 }}
      {%- else -%}
        {{ prognoza != '' and states(prognoza) in ['rainy', 'pouring', 'lightning-rainy'] }}
      {%- endif -%}
    {%- elif zrodlo_pogody == 'nieznane' -%}
      {{ true }}
    {%- else -%}
      {{ false }}
    {%- endif -%}
  brud: "{{ states(potrzeba) | float(0) if potrzeba != '' else states(pomocnik_brud) | float(0) }}"

actions:
  - alias: Dirt counter - hour and doors
    if:
      - condition: template
        value_template: "{{ trigger.id in ['godzina', 'drzwi'] and potrzeba == '' }}"
    then:
      - variables:
          dodaj: >-
            {%- if trigger.id == 'godzina' -%}
              {{ pkt_baza | float(0) + (pkt_obecnosc | float(0) if ktos_w_domu | bool and 7 <= now().hour < 22 else 0) }}
            {%- else -%}
              {{ pkt_drzwi | float(0) * (2 if mokro | bool else 1) }}
            {%- endif -%}
      - if:
          - condition: template
            value_template: "{{ dodaj | float(0) > 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: !input pomocnik_brud
            data:
              value: "{{ [states(pomocnik_brud) | float(0) + dodaj | float(0), state_attr(pomocnik_brud, 'max') | float(300)] | min }}"

  - alias: Household member returned during cleaning
    if:
      - condition: template
        value_template: >-
          {%- set s = states(pomocnik_stan) -%}
          {%- set S = s | from_json if s.startswith('{') else {} -%}
          {{ trigger.id == 'obecnosc' and not tryb_podgladu and tryb_obecnosci == 'pusty_dom'
             and reakcja_powrot != 'none' and ktos_w_domu | bool and st == 'cleaning'
             and S.get('od', 0) | int > 0 and S.get('s', '') == 'a' }}
    then:
      - variables:
          S: >-
            {%- set s = states(pomocnik_stan) -%}
            {{ s | from_json if s.startswith('{') else {} }}
      - action: input_text.set_value
        target:
          entity_id: !input pomocnik_stan
        data:
          value: "{%- set J = dict(S, s='p', e=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
      - if:
          - condition: template
            value_template: "{{ reakcja_powrot == 'pause' and ma_pauze }}"
        then:
          - action: vacuum.pause
            continue_on_error: true
            target:
              entity_id: !input robot
          - action: input_text.set_value
            target:
              entity_id: !input pomocnik_powod
            data:
              value: "Someone returned - robot paused {{ now().strftime('%H:%M') }}"
        else:
          - action: vacuum.return_to_base
            continue_on_error: true
            target:
              entity_id: !input robot
          - action: input_text.set_value
            target:
              entity_id: !input pomocnik_powod
            data:
              value: "Someone returned - robot goes back to the dock, finishes later ({{ now().strftime('%H:%M') }})"
      - if:
          - condition: template
            value_template: "{{ powiadom_o_starcie }}"
        then:
          - variables:
              tytul: "{{ nazwa }}: cleaning interrupted"
              tresc: Someone came home.
              tag: "robot_{{ robot.split('.')[1] }}_info"
              typ: informacja
          - sequence: !input akcje_powiadomien

  - alias: Cycle - cleaning state, supervision, problems and start
    if:
      - condition: template
        value_template: "{{ trigger.id == 'cykl' }}"
    then:
      - alias: Litter box - new uses since the last cycle
        if:
          - condition: template
            value_template: "{{ kuweta_licznik != '' and states(kuweta_licznik) | is_number }}"
        then:
          - variables:
              S: >-
                {%- set s = states(pomocnik_stan) -%}
                {{ s | from_json if s.startswith('{') else {} }}
              licznik: "{{ states(kuweta_licznik) | float(0) | int }}"
              poprzedni: "{{ S.get('kl', -1) | int }}"
              nowe: "{{ [[licznik - poprzedni, 0] | max, 5] | min if poprzedni >= 0 else 0 }}"
          - if:
              - condition: template
                value_template: "{{ licznik != poprzedni }}"
            then:
              - action: input_text.set_value
                target:
                  entity_id: !input pomocnik_stan
                data:
                  value: "{%- set J = dict(S, kl=licznik, k=S.get('k', 0) | int + nowe) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
              - if:
                  - condition: template
                    value_template: "{{ nowe > 0 and potrzeba == '' and pkt_kuweta | float(0) > 0 }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: !input pomocnik_brud
                    data:
                      value: "{{ [states(pomocnik_brud) | float(0) + nowe * pkt_kuweta | float(0), state_attr(pomocnik_brud, 'max') | float(300)] | min }}"

      - alias: Cleaning started outside the automation
        if:
          - condition: template
            value_template: >-
              {%- set s = states(pomocnik_stan) -%}
              {%- set S = s | from_json if s.startswith('{') else {} -%}
              {{ S.get('od', 0) | int == 0 and st == 'cleaning' and od_zmiany >= 120 }}
        then:
          - variables:
              S: >-
                {%- set s = states(pomocnik_stan) -%}
                {{ s | from_json if s.startswith('{') else {} }}
          - action: input_text.set_value
            target:
              entity_id: !input pomocnik_stan
            data:
              value: "{%- set J = dict(S, od=teraz - od_zmiany, s='z', w=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"

      - alias: Supervision of the running cleaning
        if:
          - condition: template
            value_template: >-
              {%- set s = states(pomocnik_stan) -%}
              {%- set S = s | from_json if s.startswith('{') else {} -%}
              {{ S.get('od', 0) | int > 0 }}
        then:
          - variables:
              S: >-
                {%- set s = states(pomocnik_stan) -%}
                {{ s | from_json if s.startswith('{') else {} }}
              od: "{{ S.get('od', 0) | int }}"
              zrodlo: "{{ S.get('s', 'a') }}"
              czas_s: >-
                {%- set ns = namespace(c=-1) -%}
                {%- if sensor_czasu != '' and states(sensor_czasu) | is_number -%}
                  {%- set j = state_attr(sensor_czasu, 'unit_of_measurement') | string -%}
                  {%- set m = {'s': 1, 'min': 60, 'h': 3600, 'd': 86400}.get(j, 60) -%}
                  {%- set ns.c = states(sensor_czasu) | float(0) * m -%}
                {%- endif -%}
                {{ ns.c | int if ns.c >= 0 else [teraz - od - od_zmiany, 0] | max }}
              m2: "{{ states(sensor_powierzchni) | float(-1) if sensor_powierzchni != '' else -1 }}"
              jedn: "{{ (state_attr(sensor_powierzchni, 'unit_of_measurement') if sensor_powierzchni != '' else '') or 'm²' }}"
              mediana: >-
                {%- set l = S.get('m', []) | sort -%}
                {{ l[(l | length) // 2] if l | length >= 3 else -1 }}
              pelne: >-
                {{ czas_s | int >= min_czas_sprzatania_min | int * 60
                   and (m2 | float < 0 or mediana | float < 0
                        or m2 | float >= mediana | float * min_powierzchnia_procent | float / 100) }}
              stan_wznowienie: "{{ S.get('wr', 0) | int }}"
          - choose:
              - alias: End - robot at the dock long enough
                conditions:
                  - condition: template
                    value_template: "{{ st in stany_stacji and od_zmiany >= potwierdzenie_w_stacji_min | int * 60 }}"
                sequence:
                  - choose:
                      - alias: Quick litter box cleaning finished
                        conditions:
                          - condition: template
                            value_template: "{{ zrodlo == 'k' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input pomocnik_stan
                            data:
                              value: "{%- set J = dict(S, od=0, k=0, s='', e=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                          - action: input_text.set_value
                            target:
                              entity_id: !input pomocnik_powod
                            data:
                              value: "Litter box: area cleaned ({{ now().strftime('%H:%M') }})"
                      - alias: Full cleaning
                        conditions:
                          - condition: template
                            value_template: "{{ pelne }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input pomocnik_stan
                            data:
                              value: >-
                                {%- set l = (S.get('m', []) + ([m2 | round(0) | int] if m2 | float > 0 else []))[-5:] -%}
                                {%- set J = dict(S, od=0, z=teraz, k=0, w=0, s='', m=l, e=teraz, pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}
                          - if:
                              - condition: template
                                value_template: "{{ potrzeba == '' }}"
                            then:
                              - action: input_number.set_value
                                target:
                                  entity_id: !input pomocnik_brud
                                data:
                                  value: 0
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: !input pomocnik_nastepne
                            data:
                              timestamp: "{{ teraz + (odstep_godz | float(12) * 3600) | int }}"
                          - action: input_text.set_value
                            target:
                              entity_id: !input pomocnik_powod
                            data:
                              value: >-
                                Finished {{ now().strftime('%d.%m %H:%M') }} ({{ (czas_s | int / 60) | round(0) | int }} min{{ (', ' ~ (m2 | round(0) | int) ~ ' ' ~ jedn) if m2 | float > 0 else '' }})
                          - sequence: !input akcje_po_sprzataniu
                          - if:
                              - condition: template
                                value_template: "{{ powiadom_o_koncu }}"
                            then:
                              - variables:
                                  tytul: "{{ nazwa }}: cleaned"
                                  tresc: >-
                                    Cleaning finished after {{ (czas_s | int / 60) | round(0) | int }} min{{ (', ' ~ (m2 | round(0) | int) ~ ' ' ~ jedn) if m2 | float > 0 else '' }}.
                                  tag: "robot_{{ robot.split('.')[1] }}_info"
                                  typ: informacja
                              - sequence: !input akcje_powiadomien
                      - alias: Cleaning outside the automation, not full - no notification
                        conditions:
                          - condition: template
                            value_template: "{{ zrodlo == 'z' }}"
                        sequence:
                          - action: input_text.set_value
                            target:
                              entity_id: !input pomocnik_stan
                            data:
                              value: "{%- set J = dict(S, od=0, w=0, s='', pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                    default:
                      - alias: Interrupted - retry later
                        action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_stan
                        data:
                          value: "{%- set J = dict(S, od=0, w=0, s='', e=teraz, pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: !input pomocnik_nastepne
                        data:
                          timestamp: "{{ teraz + (ponowienie_godz | float(3) * 3600) | int }}"
                      - action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_powod
                        data:
                          value: >-
                            Interrupted {{ now().strftime('%d.%m %H:%M') }} ({{ (czas_s | int / 60) | round(0) | int }} min{{ (', ' ~ (m2 | round(0) | int) ~ ' ' ~ jedn) if m2 | float > 0 else '' }}) - retry in {{ ponowienie_godz }} h
                      - if:
                          - condition: template
                            value_template: "{{ zrodlo == 'a' or powiadom_o_starcie }}"
                        then:
                          - variables:
                              tytul: "{{ nazwa }}: cleaning interrupted"
                              tresc: >-
                                The robot returned to the dock, but the cleaning is not full ({{ (czas_s | int / 60) | round(0) | int }} min{{ (', ' ~ (m2 | round(0) | int) ~ ' ' ~ jedn) if m2 | float > 0 else '' }}). Retry in {{ ponowienie_godz }} h.
                              tag: "robot_{{ robot.split('.')[1] }}_info"
                              typ: informacja
                          - sequence: !input akcje_powiadomien

              - alias: Cleaning time limit since start
                conditions:
                  - condition: template
                    value_template: "{{ teraz - od > max_czas_godz | float(5) * 3600 and st not in stany_stacji }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ not tryb_podgladu }}"
                    then:
                      - action: vacuum.return_to_base
                        continue_on_error: true
                        target:
                          entity_id: !input robot
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, od=0, w=0, s='', e=teraz, pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input pomocnik_nastepne
                    data:
                      timestamp: "{{ teraz + (ponowienie_godz | float(3) * 3600) | int }}"
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Interrupted - limit {{ max_czas_godz }} h, robot goes back to the dock (state: {{ st }})"
                  - variables:
                      tytul: "{{ nazwa }} needs attention"
                      tresc: >-
                        The robot did not finish cleaning within {{ max_czas_godz }} h (state: {{ st }}{{ (', error: ' ~ kod_bledu) if kod_bledu != '' else '' }}). I sent it to the dock, retry in {{ ponowienie_godz }} h.
                      tag: "robot_{{ robot.split('.')[1] }}_info"
                      typ: informacja
                  - sequence: !input akcje_powiadomien

              - alias: Pause without an error code - resume
                conditions:
                  - condition: template
                    value_template: >-
                      {{ zrodlo == 'a' and not tryb_podgladu and st == 'paused'
                         and od_zmiany >= pauza_alarm_min | int * 60
                         and kod_bledu == '' and not stacja_problem | bool and not noc | bool
                         and S.get('w', 0) | int < wznowienia_max | int
                         and teraz - stan_wznowienie >= 3000 and 8 <= now().hour < 21 }}
                sequence:
                  - action: vacuum.start
                    continue_on_error: true
                    target:
                      entity_id: !input robot
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, w=S.get('w', 0) | int + 1, wr=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Resumed after a pause (attempt {{ S.get('w', 0) | int + 1 }}) {{ now().strftime('%H:%M') }}"

              - alias: Robot cleans again after a pause
                conditions:
                  - condition: template
                    value_template: "{{ st == 'cleaning' and S.get('pz', 0) | int == 1 }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Cleaning (resumed) since {{ now().strftime('%H:%M') }}"

              - alias: Pause - store the reason
                conditions:
                  - condition: template
                    value_template: "{{ st == 'paused' and od_zmiany >= pauza_alarm_min | int * 60 }}"
                sequence:
                  - variables:
                      nowy_powod: >-
                        Paused{{ (': ' ~ kod_bledu) if kod_bledu != '' else (': dock problem' if stacja_problem | bool else ' without an error code') }}
                  - if:
                      - condition: template
                        value_template: "{{ states(pomocnik_powod) != nowy_powod }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_stan
                        data:
                          value: "{%- set J = dict(S, pz=1) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                      - action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_powod
                        data:
                          value: "{{ nowy_powod[:250] }}"

      - alias: Task outside the automation - long pause with an error, return to the dock
        if:
          - condition: template
            value_template: >-
              {%- set s = states(pomocnik_stan) -%}
              {%- set S = s | from_json if s.startswith('{') else {} -%}
              {{ not tryb_podgladu and S.get('od', 0) | int == 0 and st == 'paused'
                 and kod_bledu != '' and od_zmiany >= 10800 }}
        then:
          - action: vacuum.return_to_base
            continue_on_error: true
            target:
              entity_id: !input robot

      - alias: Problems - new problem, reminders and end of the problem
        sequence:
          - variables:
              S: >-
                {%- set s = states(pomocnik_stan) -%}
                {{ s | from_json if s.startswith('{') else {} }}
              typ_problemu: >-
                {%- if st == 'unavailable' and od_zmiany >= 300 -%}niedostepny
                {%- elif st == 'error' -%}blad
                {%- elif st not in stany_stacji and stacja_problem | bool -%}stacja
                {%- elif st == 'paused' and od_zmiany >= pauza_alarm_min | int * 60
                     and (kod_bledu != '' or stacja_problem | bool
                          or (S.get('od', 0) | int > 0
                              and (S.get('s', '') != 'a' or tryb_podgladu or noc | bool
                                   or S.get('w', 0) | int >= wznowienia_max | int
                                   or not (8 <= now().hour < 21)))) -%}pauza
                {%- elif st in ['returning'] + ([] if start_takze_z_idle else ['idle']) and od_zmiany >= utknal_godz | float(2) * 3600 -%}utknal
                {%- elif st == 'cleaning' and od_zmiany >= utknal_godz | float(2) * 3600 and sensor_powierzchni != '' and states[sensor_powierzchni] is not none
                     and (now() - states[sensor_powierzchni].last_changed).total_seconds() >= utknal_godz | float(2) * 3600 -%}utknal
                {%- endif -%}
              opis: >-
                {%- if typ_problemu == 'niedostepny' -%}No connection to the robot for {{ (od_zmiany / 60) | int }} min. Check the dock power and Wi-Fi.
                {%- elif typ_problemu == 'blad' -%}The robot reported an error{{ (': ' ~ kod_bledu) if kod_bledu != '' else '' }}. Check the robot and the dock.
                {%- elif typ_problemu == 'stacja' -%}Dock problem: {{ states(sensor_alarmow_stacji) }}.
                {%- elif typ_problemu == 'pauza' -%}The robot has been paused for {{ (od_zmiany / 60) | int }} min{{ (' (' ~ kod_bledu ~ ')') if kod_bledu != '' else '' }}.
                {%- elif typ_problemu == 'utknal' -%}The robot is stuck: no change for {{ (od_zmiany / 3600) | round(1) }} h (state: {{ st }}).
                {%- endif -%}
              tag: "robot_{{ robot.split('.')[1] }}_problem"
              problem_teraz: "{{ S.get('pt', '') }}"
              ok_od_5_min: "{{ typ_problemu == '' and st not in ['unavailable', 'unknown', 'error'] and od_zmiany >= 300 }}"
          - choose:
              - alias: New problem - notify at once
                conditions:
                  - condition: template
                    value_template: "{{ typ_problemu != '' and problem_teraz == '' }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, pt=typ_problemu, po=teraz, pn=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - variables:
                      tytul: "{{ nazwa }} needs attention"
                      tresc: "{{ opis }}"
                      typ: problem
                  - sequence: !input akcje_powiadomien
              - alias: Problem continues - reminder
                conditions:
                  - condition: template
                    value_template: >-
                      {{ typ_problemu != '' and problem_teraz != '' and not noc | bool
                         and teraz - S.get('pn', 0) | int >= przypomnienie_godz | float(6) * 3600 }}
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, pt=typ_problemu, pn=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - variables:
                      tytul: "Reminder: {{ nazwa }}"
                      tresc: >-
                        Problem since {{ S.get('po', teraz) | int | timestamp_custom('%d.%m %H:%M') }}. {{ opis }}
                      typ: przypomnienie
                  - sequence: !input akcje_powiadomien
              - alias: Problem solved
                conditions:
                  - condition: template
                    value_template: "{{ problem_teraz != '' and ok_od_5_min | bool }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: "{%- set J = dict(S, pt='', po=0, pn=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
                  - variables:
                      tytul: "{{ nazwa }}: problem solved"
                      tresc: The robot works normally.
                      typ: rozwiazany
                  - sequence: !input akcje_powiadomien

      - alias: Start - decision and execution
        sequence:
          - variables:
              S: >-
                {%- set s = states(pomocnik_stan) -%}
                {{ s | from_json if s.startswith('{') else {} }}
              nastepne: "{{ state_attr(pomocnik_nastepne, 'timestamp') | float(0) }}"
              ostatnie_pelne: "{{ S.get('z', 0) | int }}"
              dzien: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] }}"
              w_oknie_zwyklym: >-
                {%- set od = today_at(okno_od) -%}
                {%- set do = today_at(okno_do) -%}
                {%- set w = (od <= now() < do) if od <= do else (now() >= od or now() < do) -%}
                {{ (not ogranicz_godziny or w) and (not ogranicz_dni or dzien in dni) }}
              w_oknie_pustego_domu: >-
                {{ tryb_obecnosci == 'pusty_dom' and dzien in pusty_dom_dni
                   and today_at(pusty_dom_od) <= now() < today_at(pusty_dom_do) }}
              dom_pusty: >-
                {{ obecnosc | length > 0 and not ktos_w_domu | bool and minut_pustego_domu | int >= opoznienie_min | int }}
              przerwa_przekroczona: "{{ ostatnie_pelne == 0 or teraz - ostatnie_pelne >= maks_przerwa_godz | float(48) * 3600 }}"
              blokada_wlaczona: >-
                {%- set ns = namespace(b=false) -%}
                {%- for e in blokady -%}{%- if is_state(e, 'on') -%}{%- set ns.b = true -%}{%- endif -%}{%- endfor -%}
                {{ ns.b }}
              regula: >-
                {%- if w_oknie_pustego_domu | bool and dom_pusty | bool and brud | float >= prog_potrzeby | float * pusty_dom_procent | float / 100 -%}pusty
                {%- elif w_oknie_zwyklym | bool and brud | float >= prog_potrzeby | float -%}brud
                {%- elif (w_oknie_zwyklym | bool or (w_oknie_pustego_domu | bool and dom_pusty | bool)) and przerwa_przekroczona | bool -%}przerwa
                {%- endif -%}
              powod_blokady: >-
                {%- if noc | bool -%}
                  quiet night
                {%- elif S.get('od', 0) | int > 0 -%}
                  cleaning in progress
                {%- elif not wlasny_start and obszary | length > 0 and not ma_obszary | bool -%}
                  the robot does not support cleaning areas
                {%- elif st not in stany_stacji -%}
                  the robot is not at the dock (state: {{ st }})
                {%- elif nastepne > teraz -%}
                  next start from {{ nastepne | timestamp_custom('%d.%m %H:%M') }}
                {%- elif bateria != '' and states(bateria) | float(-1) < 0 -%}
                  no battery reading
                {%- elif bateria != '' and states(bateria) | float(0) < min_bateria | float(0) -%}
                  battery {{ states(bateria) }}%, minimum {{ min_bateria | int }}%
                {%- elif blokada_wlaczona | bool -%}
                  cleaning blocker is on
                {%- elif regula == '' -%}
                  dirt {{ brud | round(0) | int }}/{{ prog_potrzeby | int }}{{ ', empty home from ' ~ (pusty_dom_od[:5]) if tryb_obecnosci == 'pusty_dom' else '' }}{{ ', fallback forecast' if zrodlo_pogody == 'rezerwa' else (', weather unknown - counting as after rain' if zrodlo_pogody == 'nieznane' else '') }}
                {%- endif -%}
              nazwa_reguly: >-
                {%- if regula == 'pusty' -%}empty home{%- elif regula == 'brud' -%}dirt threshold{%- else -%}maximum gap{%- endif -%}
          - choose:
              - alias: Waiting - store the reason
                conditions:
                  - condition: template
                    value_template: "{{ powod_blokady | trim != '' }}"
                sequence:
                  - variables:
                      nowy_powod: "Waiting: {{ powod_blokady | trim }}"
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states(pomocnik_powod) != nowy_powod
                             and S.get('od', 0) | int == 0
                             and teraz - S.get('e', 0) | int >= 3600 }}
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_powod
                        data:
                          value: "{{ nowy_powod[:250] }}"
              - alias: Preview - store what I would do
                conditions:
                  - condition: template
                    value_template: "{{ tryb_podgladu }}"
                sequence:
                  - variables:
                      nowy_powod: "Preview: I would start now ({{ nazwa_reguly }}, dirt {{ brud | round(0) | int }}/{{ prog_potrzeby | int }})"
                  - if:
                      - condition: template
                        value_template: "{{ states(pomocnik_powod) != nowy_powod }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: !input pomocnik_powod
                        data:
                          value: "{{ nowy_powod[:250] }}"
            default:
              - action: input_text.set_value
                target:
                  entity_id: !input pomocnik_stan
                data:
                  value: "{%- set J = dict(S, od=teraz, s='a', w=0, wr=0, p=teraz, pz=0) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: !input pomocnik_nastepne
                data:
                  timestamp: "{{ teraz + (ponowienie_godz | float(3) * 3600) | int }}"
              - action: input_text.set_value
                target:
                  entity_id: !input pomocnik_powod
                data:
                  value: "Start ({{ nazwa_reguly }}) {{ now().strftime('%H:%M') }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ wlasny_start }}"
                    sequence: !input akcje_startu
                  - conditions:
                      - condition: template
                        value_template: "{{ obszary | length > 0 }}"
                    sequence:
                      - action: vacuum.clean_area
                        continue_on_error: true
                        target:
                          entity_id: !input robot
                        data:
                          cleaning_area_id: !input obszary
                default:
                  - action: vacuum.start
                    continue_on_error: true
                    target:
                      entity_id: !input robot
              - wait_template: "{{ states(robot) in ['cleaning', 'returning', 'error', 'paused'] }}"
                timeout:
                  minutes: 5
                continue_on_timeout: true
              - variables:
                  ruszyl: "{{ states(robot) in ['cleaning', 'returning'] }}"
              - if:
                  - condition: template
                    value_template: "{{ ruszyl }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Cleaning ({{ nazwa_reguly }}) since {{ now().strftime('%H:%M') }}"
                  - if:
                      - condition: template
                        value_template: "{{ powiadom_o_starcie }}"
                    then:
                      - variables:
                          tytul: "{{ nazwa }}: cleaning started"
                          tresc: "Reason: {{ nazwa_reguly }}, dirt {{ brud | round(0) | int }}/{{ prog_potrzeby | int }}."
                          tag: "robot_{{ robot.split('.')[1] }}_info"
                          typ: informacja
                      - sequence: !input akcje_powiadomien
                else:
                  - variables:
                      kod: >-
                        {%- set ns = namespace(k='') -%}
                        {%- if sensor_bledu != '' and (states(sensor_bledu) | string | lower) not in ['ok', '0', 'none', 'brak', 'unknown', 'unavailable', ''] -%}
                          {%- set ns.k = states(sensor_bledu) | string -%}
                        {%- elif sensor_bledu == '' and (state_attr(robot, 'fault_code') | string) not in ['0', '', 'None'] -%}
                          {%- set ns.k = state_attr(robot, 'fault_code_description') | string -%}
                        {%- elif sensor_alarmow_stacji != '' and (states(sensor_alarmow_stacji) | string | lower) not in ['ok', '0', 'none', 'brak', 'unknown', 'unavailable', ''] -%}
                          {%- set ns.k = states(sensor_alarmow_stacji) | string -%}
                        {%- endif -%}
                        {{ ns.k[:120] }}
                      stan_po: "{{ states(robot) }}"
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: >-
                        {%- set s = states(pomocnik_stan) -%}
                        {%- set S2 = s | from_json if s.startswith('{') else {} -%}
                        {%- set J = dict(S2, od=0, s='', e=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}
                  - if:
                      - condition: template
                        value_template: "{{ states(robot) not in stany_stacji }}"
                    then:
                      - action: vacuum.return_to_base
                        continue_on_error: true
                        target:
                          entity_id: !input robot
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Did not start {{ now().strftime('%H:%M') }} (state: {{ stan_po }}{{ (', ' ~ kod) if kod != '' else '' }})"
                  - variables:
                      tytul: "{{ nazwa }}: did not start"
                      tresc: >-
                        The robot did not start cleaning (state: {{ stan_po }}{{ (', ' ~ kod) if kod != '' else '' }}). Retry in {{ ponowienie_godz }} h.
                      tag: "robot_{{ robot.split('.')[1] }}_info"
                      typ: informacja
                  - sequence: !input akcje_powiadomien

      - alias: Litter box - quick area cleaning
        if:
          - condition: template
            value_template: >-
              {%- set s = states(pomocnik_stan) -%}
              {%- set S = s | from_json if s.startswith('{') else {} -%}
              {{ kuweta_licznik != '' and kuweta_obszar | length > 0 and ma_obszary | bool
                 and S.get('k', 0) | int >= kuweta_prog | int and S.get('od', 0) | int == 0
                 and not noc | bool and 9 <= now().hour < 21
                 and st in stany_stacji and od_zmiany >= 180
                 and (bateria == '' or states(bateria) | float(0) >= min_bateria | float(0))
                 and teraz - S.get('kf', 0) | int >= 3600 }}
        then:
          - if:
              - condition: template
                value_template: "{{ tryb_podgladu }}"
            then:
              - variables:
                  nowy_powod: "Preview: litter box - I would clean the area now"
              - if:
                  - condition: template
                    value_template: "{{ states(pomocnik_powod) != nowy_powod }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "{{ nowy_powod }}"
            else:
              - variables:
                  S: >-
                    {%- set s = states(pomocnik_stan) -%}
                    {{ s | from_json if s.startswith('{') else {} }}
              - action: input_text.set_value
                target:
                  entity_id: !input pomocnik_stan
                data:
                  value: "{%- set J = dict(S, od=teraz, s='k', kf=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}"
              - action: input_text.set_value
                target:
                  entity_id: !input pomocnik_powod
                data:
                  value: "Litter box: cleaning the area since {{ now().strftime('%H:%M') }}"
              - action: vacuum.clean_area
                continue_on_error: true
                target:
                  entity_id: !input robot
                data:
                  cleaning_area_id: !input kuweta_obszar
              - wait_template: "{{ states(robot) in ['cleaning', 'returning', 'error', 'paused'] }}"
                timeout:
                  minutes: 3
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ states(robot) not in ['cleaning', 'returning'] }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_stan
                    data:
                      value: >-
                        {%- set s = states(pomocnik_stan) -%}
                        {%- set S2 = s | from_json if s.startswith('{') else {} -%}
                        {%- set J = dict(S2, od=0, s='', e=teraz) -%}{{ (J | to_json) if (J | to_json | length) < 250 else (dict(J, m=J.get('m', [])[-2:], kf=0, wr=0) | to_json) }}
                  - action: input_text.set_value
                    target:
                      entity_id: !input pomocnik_powod
                    data:
                      value: "Litter box: robot did not start {{ now().strftime('%H:%M') }} (state: {{ states(robot) }})"
