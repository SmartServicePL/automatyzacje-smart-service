# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - robot sprzątający pod nieobecność"
    en: "Smart Service - robot cleaning while nobody is home"
    de: "Smart Service - Reinigungsroboter bei Abwesenheit"
  - pl: "Uniwersalne sprzątanie robotem odkurzającym lub mopującym z Home Assistant"
    en: "Universal cleaning with a robot vacuum or mopping robot from Home Assistant"
    de: "Universelle Reinigung mit einem Saug- oder Wischroboter aus Home Assistant"
  - pl: "(dowolna integracja z encją vacuum, np. Roborock, Ecovacs, Dreame, Matter)."
    en: "(any integration with a vacuum entity, e.g. Roborock, Ecovacs, Dreame, Matter)."
    de: "(jede Integration mit einer vacuum-Entität, z. B. Roborock, Ecovacs, Dreame, Matter)."
  - pl: "Jedna automatyzacja = jeden robot. Dla kilku pięter lub robotów utwórz kilka"
    en: "One automation = one robot. For several floors or robots, create several"
    de: "Eine Automatisierung = ein Roboter. Für mehrere Etagen oder Roboter erstellen Sie mehrere"
  - pl: "automatyzacji z tego blueprintu (każda z własnym pomocnikiem)."
    en: "automations from this blueprint (each with its own helper)."
    de: "Automatisierungen aus diesem Blueprint (jede mit eigenem Helfer)."
  - pl: "Robot startuje, gdy jednocześnie:"
    en: "The robot starts when all of the following are true:"
    de: "Der Roboter startet, wenn gleichzeitig:"
  - pl: "- nikogo nie ma w domu od ustawionego czasu (albo wybrano tryb bez obecności),"
    en: "- nobody has been home for the set time (or the mode without presence is selected),"
    de: "- seit der eingestellten Zeit niemand zu Hause ist (oder der Modus ohne Anwesenheit gewählt ist),"
  - pl: "- robot stoi w stacji z wystarczającą baterią,"
    en: "- the robot is docked with enough battery,"
    de: "- der Roboter mit ausreichend geladenem Akku in der Station steht,"
  - pl: "- minął ustawiony odstęp od ostatniego sprzątania (pomocnik z datą),"
    en: "- the set interval since the last cleaning has passed (date helper),"
    de: "- der eingestellte Abstand seit der letzten Reinigung vergangen ist (Datums-Helfer),"
  - pl: "- opcjonalny licznik potrzeby (np. \"brud\", użycia kuwety) osiągnął próg,"
    en: "- the optional need counter (e.g. \"dirt\", litter box uses) has reached its threshold,"
    de: "- der optionale Bedarfszähler (z. B. \"Schmutz\", Nutzungen der Katzentoilette) seine Schwelle erreicht hat,"
  - pl: "- żadna blokada nie jest włączona."
    en: "- no block is switched on."
    de: "- keine Sperre eingeschaltet ist."
  - pl: "Domyślnie sprzątanie nie ma ograniczeń dni ani godzin. Wybrane dni tygodnia"
    en: "By default, cleaning is not limited to any days or hours. Selected weekdays"
    de: "Standardmäßig ist die Reinigung nicht auf Tage oder Uhrzeiten beschränkt. Ausgewählte Wochentage"
  - pl: "i okno godzin można włączyć w sekcji \"Harmonogram i obecność\"."
    en: "and a time window can be enabled in the \"Schedule and presence\" section."
    de: "und ein Zeitfenster können Sie im Abschnitt \"Zeitplan und Anwesenheit\" aktivieren."
  - pl: "Sprzątanie wybranych pomieszczeń używa akcji vacuum.clean_area (Home Assistant"
    en: "Cleaning selected rooms uses the vacuum.clean_area action (Home Assistant"
    de: "Die Reinigung ausgewählter Räume nutzt die Aktion vacuum.clean_area (Home Assistant"
  - pl: "2026.3 lub nowszy, segmenty mapy muszą być przypisane do obszarów w ustawieniach"
    en: "2026.3 or newer; map segments must be assigned to areas in the settings"
    de: "2026.3 oder neuer; die Kartensegmente müssen in den Einstellungen der Roboter-Entität"
  - pl: "encji robota). Bez wybranych obszarów robot sprząta cały dom (vacuum.start)."
    en: "of the robot entity). Without selected areas, the robot cleans the whole home (vacuum.start)."
    de: "Bereichen zugewiesen sein). Ohne ausgewählte Bereiche reinigt der Roboter das ganze Haus (vacuum.start)."
  - pl: "Dla integracji bez obsługi obszarów można podać własne akcje startu."
    en: "For integrations without area support, you can provide your own start actions."
    de: "Für Integrationen ohne Bereichsunterstützung können Sie eigene Startaktionen angeben."
  - pl: "Nadzór: gdy ktoś wróci do domu, robot wraca do stacji albo pauzuje; błąd,"
    en: "Monitoring: when someone comes home, the robot returns to its dock or pauses; an error,"
    de: "Überwachung: Kommt jemand nach Hause, fährt der Roboter zur Station zurück oder pausiert; ein Fehler,"
  - pl: "długa pauza, brak łączności i zbyt długie sprzątanie wysyłają jedno"
    en: "a long pause, a lost connection or cleaning for too long send one"
    de: "eine lange Pause, ein Verbindungsverlust oder zu lange Reinigung senden je Ereignis"
  - pl: "powiadomienie na zdarzenie."
    en: "notification per event."
    de: "eine Benachrichtigung."
  - pl: "Robot"
    en: "Robot"
    de: "Roboter"
  - pl: "Bateria robota (opcjonalnie)"
    en: "Robot battery (optional)"
    de: "Akku des Roboters (optional)"
  - pl: "Sensor baterii w procentach. Puste = bez sprawdzania baterii."
    en: "Battery sensor in percent. Empty = battery is not checked."
    de: "Akkusensor in Prozent. Leer = Akku wird nicht geprüft."
  - pl: "Minimalna bateria do startu"
    en: "Minimum battery to start"
    de: "Mindest-Akkustand für den Start"
  - pl: "Dopuszczaj start także ze stanu \"bezczynny\""
    en: "Also allow starting from the \"idle\" state"
    de: "Start auch aus dem Zustand \"Untätig\" zulassen"
  - pl: "Niektóre roboty po naładowaniu raportują \"idle\" zamiast \"docked\". Włącz tylko, jeśli Twój robot tak robi."
    en: "Some robots report \"idle\" instead of \"docked\" after charging. Turn on only if your robot does this."
    de: "Manche Roboter melden nach dem Laden \"idle\" statt \"docked\". Nur aktivieren, wenn Ihr Roboter das tut."
  - pl: "Pomocnik - najwcześniejsze następne sprzątanie"
    en: "Helper - earliest next cleaning"
    de: "Helfer - früheste nächste Reinigung"
  - pl: "Pomocnik input_datetime z datą i godziną. Automatyzacja sama zapisuje"
    en: "An input_datetime helper with date and time. The automation itself stores"
    de: "Ein input_datetime-Helfer mit Datum und Uhrzeit. Die Automatisierung speichert"
  - pl: "w nim, kiedy najwcześniej wolno znowu sprzątać."
    en: "in it the earliest time cleaning is allowed again."
    de: "darin selbst, wann frühestens wieder gereinigt werden darf."
  - pl: "Co sprzątać"
    en: "What to clean"
    de: "Was gereinigt wird"
  - pl: "Obszary do sprzątania (opcjonalnie)"
    en: "Areas to clean (optional)"
    de: "Zu reinigende Bereiche (optional)"
  - pl: "Obszary Home Assistant przypisane do segmentów mapy robota. Puste = cały dom."
    en: "Home Assistant areas assigned to the robot's map segments. Empty = the whole home."
    de: "Home-Assistant-Bereiche, die den Kartensegmenten des Roboters zugewiesen sind. Leer = das ganze Haus."
  - pl: "Wymaga Home Assistant 2026.3+ i robota z obsługą \"Sprzątaj obszar\"."
    en: "Requires Home Assistant 2026.3+ and a robot that supports \"Clean area\"."
    de: "Erfordert Home Assistant 2026.3+ und einen Roboter, der \"Bereich reinigen\" unterstützt."
  - pl: "Użyj własnych akcji startu zamiast standardowych"
    en: "Use custom start actions instead of the standard ones"
    de: "Eigene Startaktionen statt der Standardaktionen verwenden"
  - pl: "Własne akcje startu (opcjonalnie)"
    en: "Custom start actions (optional)"
    de: "Eigene Startaktionen (optional)"
  - pl: "Np. usługa integracji producenta z listą pokoi i trybem mopowania. Używane tylko po włączeniu opcji powyżej."
    en: "E.g. an action of the manufacturer's integration with a list of rooms and a mopping mode. Used only when the option above is turned on."
    de: "Z. B. eine Aktion der Hersteller-Integration mit Raumliste und Wischmodus. Wird nur verwendet, wenn die Option oben aktiviert ist."
  - pl: "Harmonogram i obecność"
    en: "Schedule and presence"
    de: "Zeitplan und Anwesenheit"
  - pl: "Sprzątać tylko w wybrane dni"
    en: "Clean only on selected days"
    de: "Nur an ausgewählten Tagen reinigen"
  - pl: "Wyłączone = sprzątanie w każdy dzień tygodnia."
    en: "Off = cleaning on every day of the week."
    de: "Aus = Reinigung an jedem Wochentag."
  - pl: "Dni sprzątania"
    en: "Cleaning days"
    de: "Reinigungstage"
  - pl: "Używane tylko po włączeniu opcji powyżej."
    en: "Used only when the option above is turned on."
    de: "Wird nur verwendet, wenn die Option oben aktiviert ist."
  - pl: "Poniedziałek"
    en: "Monday"
    de: "Montag"
  - pl: "Wtorek"
    en: "Tuesday"
    de: "Dienstag"
  - pl: "Środa"
    en: "Wednesday"
    de: "Mittwoch"
  - pl: "Czwartek"
    en: "Thursday"
    de: "Donnerstag"
  - pl: "Piątek"
    en: "Friday"
    de: "Freitag"
  - pl: "Sobota"
    en: "Saturday"
    de: "Samstag"
  - pl: "Niedziela"
    en: "Sunday"
    de: "Sonntag"
  - pl: "Sprzątać tylko w wybranych godzinach"
    en: "Clean only during selected hours"
    de: "Nur zu ausgewählten Uhrzeiten reinigen"
  - pl: "Wyłączone = start o dowolnej porze doby."
    en: "Off = start at any time of day."
    de: "Aus = Start zu jeder Tageszeit."
  - pl: "Początek okna sprzątania"
    en: "Cleaning window start"
    de: "Beginn des Reinigungsfensters"
  - pl: "Używane tylko po włączeniu opcji powyżej. Okno może przechodzić przez północ."
    en: "Used only when the option above is turned on. The window may span midnight."
    de: "Wird nur verwendet, wenn die Option oben aktiviert ist. Das Fenster darf über Mitternacht gehen."
  - pl: "Koniec okna sprzątania (najpóźniejszy start)"
    en: "Cleaning window end (latest start)"
    de: "Ende des Reinigungsfensters (spätester Start)"
  - pl: "Używane tylko po włączeniu opcji \"Sprzątać tylko w wybranych godzinach\"."
    en: "Used only when \"Clean only during selected hours\" is turned on."
    de: "Wird nur verwendet, wenn \"Nur zu ausgewählten Uhrzeiten reinigen\" aktiviert ist."
  - pl: "Odstęp między sprzątaniami"
    en: "Interval between cleanings"
    de: "Abstand zwischen zwei Reinigungen"
  - pl: "Ponowienie po nieudanym lub przerwanym sprzątaniu"
    en: "Retry after a failed or interrupted cleaning"
    de: "Erneuter Versuch nach fehlgeschlagener oder abgebrochener Reinigung"
  - pl: "Sprzątanie uznane za wykonane po"
    en: "Cleaning counts as done after"
    de: "Reinigung gilt als erledigt nach"
  - pl: "Ile minut robot musi sprzątać bez przerwy, żeby uznać sprzątanie za wykonane."
    en: "How many minutes the robot must clean without a break for the cleaning to count as done."
    de: "Wie viele Minuten der Roboter ohne Unterbrechung reinigen muss, damit die Reinigung als erledigt gilt."
  - pl: "Kiedy sprzątać"
    en: "When to clean"
    de: "Wann gereinigt wird"
  - pl: "Tylko gdy nikogo nie ma w domu"
    en: "Only when nobody is home"
    de: "Nur wenn niemand zu Hause ist"
  - pl: "W oknie czasowym, bez względu na obecność"
    en: "In the time window, regardless of presence"
    de: "Im Zeitfenster, unabhängig von der Anwesenheit"
  - pl: "Domownicy i czujniki obecności"
    en: "Household members and presence sensors"
    de: "Haushaltsmitglieder und Anwesenheitssensoren"
  - pl: "Osoby (person), urządzenia (device_tracker), grupy lub czujniki obecności"
    en: "People (person), devices (device_tracker), groups or presence sensors"
    de: "Personen (person), Geräte (device_tracker), Gruppen oder Anwesenheitssensoren"
  - pl: "(stan \"on\" = ktoś jest). Stan nieznany traktowany jest jak obecność."
    en: "(state \"on\" = someone is there). An unknown state counts as presence."
    de: "(Zustand \"on\" = jemand ist da). Ein unbekannter Zustand gilt als Anwesenheit."
  - pl: "Nie wybieraj czujników ruchu w pomieszczeniach ze zwierzętami."
    en: "Do not select motion sensors in rooms with pets."
    de: "Wählen Sie keine Bewegungsmelder in Räumen mit Haustieren."
  - pl: "Start po tylu minutach pustego domu"
    en: "Start after the home has been empty for this many minutes"
    de: "Start, wenn das Haus so viele Minuten leer ist"
  - pl: "Gdy ktoś wróci podczas sprzątania"
    en: "When someone comes back during cleaning"
    de: "Wenn jemand während der Reinigung zurückkommt"
  - pl: "Odeślij robota do stacji (dokończy później)"
    en: "Send the robot back to its dock (it will finish later)"
    de: "Roboter zur Station schicken (er reinigt später zu Ende)"
  - pl: "Wstrzymaj robota"
    en: "Pause the robot"
    de: "Roboter anhalten"
  - pl: "Sprzątaj dalej"
    en: "Keep cleaning"
    de: "Weiter reinigen"
  - pl: "Licznik potrzeby sprzątania (opcjonalnie)"
    en: "Cleaning need counter (optional)"
    de: "Zähler für den Reinigungsbedarf (optional)"
  - pl: "Np. input_number \"brud\" albo licznik użyć kuwety. Start dopiero od progu poniżej."
    en: "E.g. an input_number \"dirt\" or a litter box use counter. Starts only from the threshold below."
    de: "Z. B. ein input_number \"Schmutz\" oder ein Zähler für die Nutzungen der Katzentoilette. Start erst ab der Schwelle unten."
  - pl: "Próg licznika potrzeby"
    en: "Need counter threshold"
    de: "Schwelle des Bedarfszählers"
  - pl: "Blokady (opcjonalnie)"
    en: "Blocks (optional)"
    de: "Sperren (optional)"
  - pl: "Przełączniki lub czujniki, których stan \"on\" blokuje sprzątanie (goście, urlop, drzwi otwarte)."
    en: "Switches or sensors whose \"on\" state blocks cleaning (guests, vacation, an open door)."
    de: "Schalter oder Sensoren, deren Zustand \"on\" die Reinigung sperrt (Gäste, Urlaub, offene Tür)."
  - pl: "Nadzór i powiadomienia"
    en: "Monitoring and notifications"
    de: "Überwachung und Benachrichtigungen"
  - pl: "Powiadom o pauzie trwającej dłużej niż"
    en: "Notify about a pause lasting longer than"
    de: "Bei einer Pause benachrichtigen, die länger dauert als"
  - pl: "Limit czasu sprzątania (potem powrót do stacji)"
    en: "Cleaning time limit (then return to the dock)"
    de: "Zeitlimit der Reinigung (danach Rückkehr zur Station)"
  - pl: "Akcje po wykonanym sprzątaniu (opcjonalnie)"
    en: "Actions after a completed cleaning (optional)"
    de: "Aktionen nach erledigter Reinigung (optional)"
  - pl: "Np. wyzerowanie licznika potrzeby. Wykonywane, gdy sprzątanie zostanie uznane za wykonane."
    en: "E.g. resetting the need counter. Run when the cleaning counts as done."
    de: "Z. B. Zurücksetzen des Bedarfszählers. Wird ausgeführt, wenn die Reinigung als erledigt gilt."
  - pl: "Powiadamiaj także o starcie i przerwaniu z powodu powrotu domowników"
    en: "Also notify about starts and about interruptions because someone came home"
    de: "Auch über den Start und über Unterbrechungen wegen heimkehrender Haushaltsmitglieder benachrichtigen"
  - pl: "Akcje powiadomienia"
    en: "Notification actions"
    de: "Benachrichtigungsaktionen"
  - pl: "Akcje wykonywane przy każdym powiadomieniu, np. notify.mobile_app_telefon."
    en: "Actions run for every notification, e.g. notify.mobile_app_phone."
    de: "Aktionen, die bei jeder Benachrichtigung ausgeführt werden, z. B. notify.mobile_app_handy."
  - pl: "Dostępne zmienne: {{ tytul }} i {{ tresc }}. Puste = bez powiadomień."
    en: "Available variables: {{ tytul }} (title) and {{ tresc }} (message). Empty = no notifications."
    de: "Verfügbare Variablen: {{ tytul }} (Titel) und {{ tresc }} (Text). Leer = keine Benachrichtigungen."
  - pl: "dziś nie jest dniem sprzątania"
    en: "today is not a cleaning day"
    de: "heute ist kein Reinigungstag"
  - pl: "poza oknem sprzątania {{ okno_od[:5] }}-{{ okno_do[:5] }}"
    en: "outside the cleaning window {{ okno_od[:5] }}-{{ okno_do[:5] }}"
    de: "außerhalb des Reinigungsfensters {{ okno_od[:5] }}-{{ okno_do[:5] }}"
  - pl: "robot nie obsługuje sprzątania obszarów - usuń obszary albo użyj własnych akcji startu"
    en: "the robot does not support area cleaning - remove the areas or use custom start actions"
    de: "der Roboter unterstützt keine Bereichsreinigung - entfernen Sie die Bereiche oder verwenden Sie eigene Startaktionen"
  - pl: "robot nie stoi w stacji (stan: {{ states(robot) }})"
    en: "the robot is not docked (state: {{ states(robot) }})"
    de: "der Roboter steht nicht in der Station (Zustand: {{ states(robot) }})"
  - pl: "za wcześnie, najbliższe sprzątanie od {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
    en: "too early, next cleaning from {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
    de: "zu früh, nächste Reinigung ab {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
  - pl: "brak odczytu baterii"
    en: "no battery reading"
    de: "kein Akkuwert verfügbar"
  - pl: "bateria {{ states(bateria) }}%, minimum {{ min_bateria | int }}%"
    en: "battery {{ states(bateria) }}%, minimum {{ min_bateria | int }}%"
    de: "Akku {{ states(bateria) }} %, Minimum {{ min_bateria | int }} %"
  - pl: "nie wybrano domowników, a tryb wymaga pustego domu"
    en: "no household members selected, but the mode requires an empty home"
    de: "keine Haushaltsmitglieder ausgewählt, der Modus erfordert aber ein leeres Haus"
  - pl: "ktoś jest w domu"
    en: "someone is home"
    de: "jemand ist zu Hause"
  - pl: "dom pusty dopiero od {{ minut_pustego_domu }} min"
    en: "home empty for only {{ minut_pustego_domu }} min"
    de: "Haus erst seit {{ minut_pustego_domu }} min leer"
  - pl: "licznik potrzeby {{ states(potrzeba) }} poniżej progu {{ prog_potrzeby }}"
    en: "need counter {{ states(potrzeba) }} below the threshold {{ prog_potrzeby }}"
    de: "Bedarfszähler {{ states(potrzeba) }} unter der Schwelle {{ prog_potrzeby }}"
  - pl: "włączona blokada sprzątania"
    en: "a cleaning block is on"
    de: "eine Reinigungssperre ist eingeschaltet"
  - pl: "Sprawdź warunki i uruchom sprzątanie"
    en: "Check the conditions and start cleaning"
    de: "Bedingungen prüfen und Reinigung starten"
  - pl: "Do potwierdzenia sprzątania nie startuj ponownie"
    en: "Do not start again until cleaning is confirmed"
    de: "Bis zur Bestätigung der Reinigung nicht erneut starten"
  - pl: "\"{{ nazwa }}: nie wystartował\""
    en: "\"{{ nazwa }}: did not start\""
    de: "\"{{ nazwa }}: nicht gestartet\""
  - pl: "Robot nie rozpoczął sprzątania po komendzie startu (stan: {{ states(robot) }})."
    en: "The robot did not start cleaning after the start command (state: {{ states(robot) }})."
    de: "Der Roboter hat nach dem Startbefehl nicht mit der Reinigung begonnen (Zustand: {{ states(robot) }})."
  - pl: "Następna próba najwcześniej za {{ ponowienie_godz }} h."
    en: "Next attempt at the earliest in {{ ponowienie_godz }} h."
    de: "Nächster Versuch frühestens in {{ ponowienie_godz }} h."
  - pl: "\"{{ nazwa }}: sprzątanie rozpoczęte\""
    en: "\"{{ nazwa }}: cleaning started\""
    de: "\"{{ nazwa }}: Reinigung gestartet\""
  - pl: "Robot wyjechał ze stacji {{ now().strftime('%H:%M') }}."
    en: "The robot left its dock at {{ now().strftime('%H:%M') }}."
    de: "Der Roboter hat die Station um {{ now().strftime('%H:%M') }} verlassen."
  - pl: "Sprzątanie potwierdzone - wyznacz następny termin"
    en: "Cleaning confirmed - set the next date"
    de: "Reinigung bestätigt - nächsten Termin festlegen"
  - pl: "Domownik wrócił podczas sprzątania"
    en: "Someone came home during cleaning"
    de: "Haushaltsmitglied während der Reinigung zurückgekehrt"
  - pl: "Dokończ później - krótki termin ponowienia"
    en: "Finish later - short retry time"
    de: "Später zu Ende reinigen - kurze Wartezeit bis zum erneuten Versuch"
  - pl: "\"{{ nazwa }}: sprzątanie przerwane\""
    en: "\"{{ nazwa }}: cleaning interrupted\""
    de: "\"{{ nazwa }}: Reinigung unterbrochen\""
  - pl: "Ktoś wrócił do domu - robot"
    en: "Someone came home - the robot"
    de: "Jemand ist nach Hause gekommen - der Roboter"
  - pl: "{{ 'czeka w miejscu (wznów go ręcznie)' if reakcja_powrot == 'pause' else 'wraca do stacji i dokończy później' }}."
    en: "{{ 'is waiting where it is (resume it manually)' if reakcja_powrot == 'pause' else 'is returning to its dock and will finish later' }}."
    de: "{{ 'wartet an Ort und Stelle (setzen Sie ihn manuell fort)' if reakcja_powrot == 'pause' else 'fährt zur Station zurück und reinigt später zu Ende' }}."
  - pl: "Limit czasu sprzątania"
    en: "Cleaning time limit"
    de: "Zeitlimit der Reinigung"
  - pl: "\"{{ nazwa }} wymaga uwagi\""
    en: "\"{{ nazwa }} needs attention\""
    de: "\"{{ nazwa }} benötigt Aufmerksamkeit\""
  - pl: "Robot sprząta dłużej niż {{ max_czas_godz }} h - wysłałem go do stacji."
    en: "The robot has been cleaning for more than {{ max_czas_godz }} h - it has been sent back to its dock."
    de: "Der Roboter reinigt seit mehr als {{ max_czas_godz }} h - er wurde zur Station zurückgeschickt."
  - pl: "Sprawdź, czy nie utknął."
    en: "Check whether it is stuck."
    de: "Prüfen Sie, ob er feststeckt."
  - pl: "Problem z robotem - jedno powiadomienie na zdarzenie"
    en: "Robot problem - one notification per event"
    de: "Problem mit dem Roboter - eine Benachrichtigung pro Ereignis"
  - pl: "Robot zgłosił błąd{{ (': ' ~ opis) if opis else '' }}. Sprawdź robota i stację (zbiorniki wody, worek, szczotki)."
    en: "The robot reported an error{{ (': ' ~ opis) if opis else '' }}. Check the robot and its dock (water tanks, dust bag, brushes)."
