# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - oświetlenie wewnętrzne"
    en: "Smart Service - indoor lighting"
    de: "Smart Service - Innenbeleuchtung"
  - pl: "Światło w pomieszczeniu na obecność. Jedna automatyzacja = jedno pomieszczenie."
    en: "Presence-controlled light in a room. One automation = one room."
    de: "Präsenzgesteuertes Licht in einem Raum. Eine Automation = ein Raum."
  - pl: "Zapala lampy, gdy czujnik wykryje obecność, a w pomieszczeniu jest ciemno. Gasi je,"
    en: "Turns the lamps on when the sensor detects presence and the room is dark. Turns them off"
    de: "Schaltet die Lampen ein, wenn der Sensor Präsenz erkennt und der Raum dunkel ist. Schaltet sie aus,"
  - pl: "gdy obecności nie ma przez ustawiony czas. Kto wróci najpóźniej minutę po zgaszeniu,"
    en: "when there is no presence for the set time. When someone returns at most a minute after switch-off,"
    de: "wenn für die eingestellte Zeit keine Präsenz da ist. Kommt jemand höchstens eine Minute nach dem Ausschalten zurück,"
  - pl: "temu czas gaszenia się podwaja (do limitu), bo czujniki gubią nieruchome osoby."
    en: "the switch-off time doubles (up to a limit), because sensors lose people who sit still."
    de: "verdoppelt sich die Ausschaltzeit (bis zu einer Grenze), weil Sensoren ruhige Personen verlieren."
  - pl: "Ciemno: według czujnika jasności w pomieszczeniu, sprawdzanego tylko przy zgaszonych"
    en: "Dark: by the illuminance sensor in the room, checked only while the lamps"
    de: "Dunkel: nach dem Helligkeitssensor im Raum, geprüft nur bei ausgeschalteten"
  - pl: "lampach, a bez czujnika od zachodu słońca."
    en: "are off, and without a sensor from sunset."
    de: "Lampen, ohne Sensor ab Sonnenuntergang."
  - pl: "Lampy ze ściemnianiem przygasają do połowy na 15 sekund przed zgaszeniem, a obecność"
    en: "Dimmable lamps dim to half 15 seconds before switch-off, and presence"
    de: "Dimmbare Lampen dimmen 15 Sekunden vor dem Ausschalten auf die Hälfte, und Präsenz"
  - pl: "w tym czasie przywraca jasność. Przełączniki (switch) nie przygasają."
    en: "during that time restores the brightness. Switches (switch) do not dim."
    de: "stellt in dieser Zeit die Helligkeit wieder her. Schalter (switch) dimmen nicht."
  - pl: "Ręczne zgaszenie wygrywa do końca obecności. Ręcznie zapalone światło świeci"
    en: "Switching off by hand wins until the presence ends. Light switched on by hand stays on"
    de: "Manuelles Ausschalten gilt bis zum Ende der Präsenz. Manuell eingeschaltetes Licht bleibt"
  - pl: "co najmniej 30 minut."
    en: "for at least 30 minutes."
    de: "mindestens 30 Minuten an."
  - pl: "Noc według przełącznika ciszy nocnej: wybrane lampy na niskiej jasności albo"
    en: "Night by the quiet night switch: selected lamps at low brightness or"
    de: "Nacht nach dem Nachtruhe-Schalter: ausgewählte Lampen mit geringer Helligkeit oder"
  - pl: "bez zapalania (sypialnia). Opcjonalnie: zapalanie tylko wtedy, gdy ktoś jest w domu."
    en: "no switching on (bedroom). Optional: switch on only when someone is at home."
    de: "kein Einschalten (Schlafzimmer). Optional: Einschalten nur, wenn jemand zu Hause ist."
  - pl: "Bez pomocników."
    en: "No helpers needed."
    de: "Keine Helfer nötig."
  - pl: "Pomieszczenie"
    en: "Room"
    de: "Raum"
  - pl: "Czujnik obecności"
    en: "Presence sensor"
    de: "Präsenzsensor"
  - pl: "Czujnik ruchu, zajętości albo obecności w tym pomieszczeniu."
    en: "Motion, occupancy or presence sensor in this room."
    de: "Bewegungs-, Belegungs- oder Präsenzsensor in diesem Raum."
  - pl: "Lampy"
    en: "Lamps"
    de: "Lampen"
  - pl: "Światła i przełączniki oświetlenia w tym pomieszczeniu."
    en: "Lights and lighting switches in this room."
    de: "Lichter und Lichtschalter in diesem Raum."
  - pl: "Tryb"
    en: "Mode"
    de: "Modus"
  - pl: "W trybie „Tylko gaś” światło zapala człowiek, a automatyzacja tylko je gasi."
    en: "In \"Switch off only\" mode a person switches the light on and the automation only switches it off."
    de: "Im Modus \"Nur ausschalten\" schaltet ein Mensch das Licht ein, die Automation schaltet es nur aus."
  - pl: "Zapalaj i gaś"
    en: "Switch on and off"
    de: "Ein- und ausschalten"
  - pl: "Tylko gaś"
    en: "Switch off only"
    de: "Nur ausschalten"
  - pl: "Gaszenie"
    en: "Switching off"
    de: "Ausschalten"
  - pl: "Gaś po braku obecności"
    en: "Switch off after no presence for"
    de: "Ausschalten nach fehlender Präsenz von"
  - pl: "Podwaja się, gdy ktoś wróci najpóźniej minutę po zgaszeniu, aż do limitu niżej."
    en: "Doubles when someone returns at most a minute after switch-off, up to the limit below."
    de: "Verdoppelt sich, wenn jemand höchstens eine Minute nach dem Ausschalten zurückkommt, bis zur Grenze unten."
  - pl: "Najdłuższy czas gaszenia po powrocie"
    en: "Longest switch-off time after a return"
    de: "Längste Ausschaltzeit nach einer Rückkehr"
  - pl: "Ciemno"
    en: "Dark"
    de: "Dunkel"
  - pl: "Czujnik jasności (opcjonalnie)"
    en: "Illuminance sensor (optional)"
    de: "Helligkeitssensor (optional)"
  - pl: "Czujnik natężenia światła w tym pomieszczeniu. Puste = ciemno od zachodu słońca."
    en: "Illuminance sensor in this room. Empty = dark from sunset."
    de: "Beleuchtungsstärkesensor in diesem Raum. Leer = dunkel ab Sonnenuntergang."
  - pl: "Ciemno poniżej"
    en: "Dark below"
    de: "Dunkel unter"
  - pl: "Sprawdzane tylko przy zgaszonych lampach. Poniżej połowy progu ciemno od razu,"
    en: "Checked only while the lamps are off. Below half the threshold dark at once,"
    de: "Nur bei ausgeschalteten Lampen geprüft. Unter der halben Schwelle sofort dunkel,"
  - pl: "bliżej progu dopiero po 2 minutach."
    en: "closer to the threshold only after 2 minutes."
    de: "näher an der Schwelle erst nach 2 Minuten."
  - pl: "Noc"
    en: "Night"
    de: "Nacht"
  - pl: "Cisza nocna"
    en: "Quiet night"
    de: "Nachtruhe"
  - pl: "Przełącznik ciszy nocnej (włączony = noc). Puste = bez trybu nocnego."
    en: "Quiet night switch (on = night). Empty = no night mode."
    de: "Nachtruhe-Schalter (an = Nacht). Leer = kein Nachtmodus."
  - pl: "Lampy nocą"
    en: "Lamps at night"
    de: "Lampen in der Nacht"
  - pl: "Lampy zapalane w ciszy nocnej. Puste = wszystkie lampy pomieszczenia."
    en: "Lamps switched on during quiet night. Empty = all lamps of the room."
    de: "Während der Nachtruhe eingeschaltete Lampen. Leer = alle Lampen des Raums."
  - pl: "Jasność nocą"
    en: "Brightness at night"
    de: "Helligkeit in der Nacht"
  - pl: "Tylko lampy ze ściemnianiem. Przełączniki i lampy bez ściemniania świecą nocą pełnym światłem."
    en: "Dimmable lamps only. Switches and lamps without dimming give full light at night."
    de: "Nur dimmbare Lampen. Schalter und nicht dimmbare Lampen leuchten nachts voll."
  - pl: "Nocą nie zapalaj"
    en: "Do not switch on at night"
    de: "Nachts nicht einschalten"
  - pl: "W ciszy nocnej automatyzacja nie zapala światła, tylko je gasi (np. sypialnia)."
    en: "During quiet night the automation does not switch the light on, it only switches it off (e.g. bedroom)."
    de: "Während der Nachtruhe schaltet die Automation das Licht nicht ein, sondern nur aus (z. B. Schlafzimmer)."
  - pl: "Pusty dom"
    en: "Empty home"
    de: "Leeres Haus"
  - pl: "Zapalaj tylko, gdy ktoś jest w domu"
    en: "Switch on only when someone is at home"
    de: "Nur einschalten, wenn jemand zu Hause ist"
  - pl: "Gdy wszyscy wybrani domownicy są poza domem, światło się nie zapala. Gaszenie działa normalnie."
    en: "When all selected household members are away, the light does not switch on. Switching off works as usual."
    de: "Wenn alle ausgewählten Bewohner weg sind, schaltet sich das Licht nicht ein. Ausschalten funktioniert normal."
  - pl: "Domownicy bez telefonu w Home Assistant (np. dzieci, goście) nie zapalą wtedy światła."
    en: "Household members without a phone in Home Assistant (e.g. children, guests) will not switch the light on then."
    de: "Bewohner ohne Telefon in Home Assistant (z. B. Kinder, Gäste) schalten das Licht dann nicht ein."
  - pl: "Domownicy"
    en: "Household members"
    de: "Bewohner"
  - pl: "Osoby z telefonem i lokalizacją. Puste = warunek nie działa."
    en: "People with a phone and location. Empty = the condition is off."
    de: "Personen mit Telefon und Standort. Leer = Bedingung aus."
  - pl: "# Straż: lampy świecą bez obecności, a żadna sesja ich nie pilnuje (np. po przerwanym przebiegu)."
    en: "# Watchdog: lamps are on without presence and no session watches them (e.g. after an interrupted run)."
    de: "# Wächter: Lampen leuchten ohne Präsenz und keine Sitzung überwacht sie (z. B. nach einem abgebrochenen Lauf)."
  - pl: "# Stałe zasady (bez wejść)."
    en: "# Fixed rules (no inputs)."
    de: "# Feste Regeln (keine Eingaben)."
  - pl: "# Kontekst poprzedniego przebiegu tej automatyzacji: zmiana lampy z tym kontekstem pochodzi z automatyzacji."
    en: "# Context of the previous run of this automation: a lamp change with this context comes from the automation."
    de: "# Kontext des vorherigen Laufs dieser Automation: eine Lampenänderung mit diesem Kontext stammt von der Automation."
  - pl: "Stan sesji na początku przebiegu"
    en: "Session state at the start of the run"
    de: "Sitzungszustand zu Beginn des Laufs"
  - pl: "# Ręcznie zapalone: lampa świeci, a ostatnia zmiana nie pochodzi z automatyzacji."
    en: "# Switched on by hand: the lamp is on and the last change does not come from the automation."
    de: "# Manuell eingeschaltet: die Lampe leuchtet und die letzte Änderung stammt nicht von der Automation."
  - pl: "# Po starcie i po zapisaniu automatyzacji kontekst poprzedniego przebiegu przepada: ręczne jest wtedy tylko zapalenie przez użytkownika."
    en: "# After a start and after saving the automation the context of the previous run is lost: then only switching on by a user counts as manual."
    de: "# Nach einem Start und nach dem Speichern der Automation geht der Kontext des vorherigen Laufs verloren: dann gilt nur das Einschalten durch einen Benutzer als manuell."
  - pl: "# Ręcznie zgaszone w trakcie obecności: wygrywa do jej końca. Zgaszenie przy świecących lampach widzi trwająca sesja."
    en: "# Switched off by hand during presence: wins until it ends. A switch-off while the lamps are on is seen by the running session."
    de: "# Während der Präsenz manuell ausgeschaltet: gilt bis zu ihrem Ende. Ein Ausschalten bei leuchtenden Lampen sieht die laufende Sitzung."
  - pl: "# Lampy zgaszone przez automatyzację przed chwilą: powrót w ciągu minuty wydłuża gaszenie."
    en: "# Lamps switched off by the automation a moment ago: a return within a minute lengthens the switch-off time."
    de: "# Lampen gerade von der Automation ausgeschaltet: eine Rückkehr innerhalb einer Minute verlängert die Ausschaltzeit."
  - pl: "Szybki powrót po zgaszeniu - dłuższy czas gaszenia"
    en: "Quick return after switch-off - longer switch-off time"
    de: "Schnelle Rückkehr nach dem Ausschalten - längere Ausschaltzeit"
  - pl: "Sesja pomieszczenia - do końca obecności"
    en: "Room session - until the presence ends"
    de: "Raumsitzung - bis zum Ende der Präsenz"
  - pl: "Obecność i ciemno - zapalenie"
    en: "Presence and dark - switching on"
    de: "Präsenz und dunkel - Einschalten"
  - pl: "# Lampy nie odpowiadają: koniec przebiegu zamiast ponawiania w kółko."
    en: "# Lamps do not respond: end the run instead of retrying in a loop."
    de: "# Lampen reagieren nicht: Lauf beenden statt endlos zu wiederholen."
  - pl: "Obecność, jasność blisko progu - czekanie na potwierdzenie ciemności"
    en: "Presence, brightness near the threshold - waiting for darkness to be confirmed"
    de: "Präsenz, Helligkeit nahe der Schwelle - Warten auf bestätigte Dunkelheit"
  - pl: "Ręczna zmiana lampy"
    en: "Manual lamp change"
    de: "Manuelle Lampenänderung"
  - pl: "Obecność - światło świeci albo nie ma go zapalać"
    en: "Presence - the light is on or is not to be switched on"
    de: "Präsenz - das Licht leuchtet oder soll nicht eingeschaltet werden"
  - pl: "Obecność w czasie przygaszania - przywrócenie jasności"
    en: "Presence while dimmed - brightness restored"
    de: "Präsenz während des Dimmens - Helligkeit wiederhergestellt"
  - pl: "Nic do pilnowania - koniec przebiegu"
    en: "Nothing to watch - end of the run"
    de: "Nichts zu überwachen - Ende des Laufs"
  - pl: "Brak obecności, lampy zgaszone"
    en: "No presence, lamps off"
    de: "Keine Präsenz, Lampen aus"
  - pl: "Koniec obecności - koniec sesji"
    en: "Presence over - end of the session"
    de: "Präsenz vorbei - Ende der Sitzung"
  - pl: "Powrót najpóźniej minutę po zgaszeniu - dłuższy czas gaszenia"
    en: "Return at most a minute after switch-off - longer switch-off time"
    de: "Rückkehr höchstens eine Minute nach dem Ausschalten - längere Ausschaltzeit"
  - pl: "Brak obecności, lampy świecą - odliczanie do zgaszenia"
    en: "No presence, lamps on - countdown to switch-off"
    de: "Keine Präsenz, Lampen an - Countdown bis zum Ausschalten"
  - pl: "Przygaszenie lamp ze ściemnianiem przed zgaszeniem"
    en: "Dimming dimmable lamps before switch-off"
    de: "Dimmbare Lampen vor dem Ausschalten dimmen"
  - pl: "Zgaszenie lamp"
    en: "Switching the lamps off"
    de: "Lampen ausschalten"
  - pl: "# Lampy nie gasną: koniec przebiegu zamiast ponawiania w kółko."
    en: "# Lamps do not switch off: end the run instead of retrying in a loop."
    de: "# Lampen gehen nicht aus: Lauf beenden statt endlos zu wiederholen."
