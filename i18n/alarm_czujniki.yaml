# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - alarm, czujniki i tryb nocny"
    en: "Smart Service - alarm, sensors and night mode"
    de: "Smart Service - Alarm, Sensoren und Nachtmodus"
  - pl: "Czujniki domu wyzwalają centralę alarmu, a powiadomienia krytyczne docierają na telefony."
    en: "Home sensors trigger the alarm panel, and critical notifications reach the phones."
    de: "Sensoren im Haus lösen die Alarmzentrale aus, kritische Benachrichtigungen erreichen die Telefone."
  - pl: "Działa z centralą Smart Service Alarm i z każdą inną centralą alarm_control_panel."
    en: "Works with the Smart Service Alarm panel and with any other alarm_control_panel."
    de: "Funktioniert mit der Zentrale Smart Service Alarm und mit jeder anderen alarm_control_panel-Zentrale."
  - pl: "Jedna automatyzacja = jedna centrala."
    en: "One automation = one alarm panel."
    de: "Eine Automation = eine Zentrale."
  - pl: "Włamanie: czujniki drzwi i okien wyzwalają alarm przy każdym uzbrojeniu, czujniki"
    en: "Burglary: door and window sensors trigger the alarm in every armed mode, motion"
    de: "Einbruch: Tür- und Fenstersensoren lösen in jedem scharfen Modus aus, Bewegungssensoren"
  - pl: "ruchu tylko przy uzbrojeniu \"poza domem\". Opóźnienie wejścia robi centrala."
    en: "sensors only when armed \"away\". The entry delay is handled by the panel."
    de: "nur bei Scharfschaltung \"abwesend\". Die Eingangsverzögerung übernimmt die Zentrale."
  - pl: "Zagrożenia (dym, czad, gaz, zalanie): zawsze syreny i powiadomienie krytyczne,"
    en: "Hazards (smoke, carbon monoxide, gas, water leak): always sirens and a critical notification,"
    de: "Gefahren (Rauch, Kohlenmonoxid, Gas, Wasseraustritt): immer Sirenen und eine kritische Benachrichtigung,"
  - pl: "bez zmiany stanu centrali, także przy rozbrojonym alarmie i w ciszy nocnej."
    en: "without changing the panel state, also when disarmed and during quiet night."
    de: "ohne Änderung des Zentralenzustands, auch unscharf und während der Nachtruhe."
  - pl: "Powiadomienie krytyczne przebija tryb \"Nie przeszkadzać\" i wraca co 2 minuty"
    en: "The critical notification breaks through \"Do not disturb\" and comes back every 2 minutes"
    de: "Die kritische Benachrichtigung durchbricht \"Nicht stören\" und kommt alle 2 Minuten wieder"
  - pl: "(najwyżej 5 razy), dopóki ktoś nie naciśnie PRZYJĄŁEM. Syreny gasną przy"
    en: "(at most 5 times) until someone taps ACKNOWLEDGE. Sirens stop when"
    de: "(höchstens 5-mal), bis jemand BESTÄTIGEN tippt. Sirenen verstummen beim"
  - pl: "rozbrojeniu, po ustawionym czasie i po starcie Home Assistant."
    en: "disarmed, after the set time and after Home Assistant starts."
    de: "Unscharfschalten, nach der eingestellten Zeit und nach dem Start von Home Assistant."
  - pl: "Opcjonalnie: uzbrajanie na noc według ciszy nocnej, przypomnienie, gdy wszyscy"
    en: "Optional: arming for the night by quiet night, a reminder when everyone"
    de: "Optional: Scharfschalten für die Nacht nach der Nachtruhe, eine Erinnerung, wenn alle"
  - pl: "wyszli, a alarm jest rozbrojony, i pilnowanie czujników (brak łączności, bateria)."
    en: "has left and the alarm is disarmed, and sensor watch (no connection, battery)."
    de: "weg sind und der Alarm unscharf ist, und Sensorüberwachung (keine Verbindung, Batterie)."
  - pl: "Automatyzacja nigdy nie rozbraja alarmu z powiadomienia."
    en: "The automation never disarms the alarm from a notification."
    de: "Die Automation schaltet den Alarm nie aus einer Benachrichtigung unscharf."
  - pl: "Pomocnik (opcjonalnie): Tekst (maks. 255 znaków) na powód ostatniej decyzji."
    en: "Helper (optional): Text (max. 255 characters) for the reason of the last decision."
    de: "Helfer (optional): Text (max. 255 Zeichen) für den Grund der letzten Entscheidung."
  - pl: "Centrala i czujniki"
    en: "Alarm panel and sensors"
    de: "Alarmzentrale und Sensoren"
  - pl: "Centrala alarmu"
    en: "Alarm panel"
    de: "Alarmzentrale"
  - pl: "Centrala Smart Service Alarm albo dowolna inna encja alarm_control_panel."
    en: "Smart Service Alarm panel or any other alarm_control_panel entity."
    de: "Zentrale Smart Service Alarm oder eine beliebige andere alarm_control_panel-Entität."
  - pl: "Czujniki drzwi i okien (obwód)"
    en: "Door and window sensors (perimeter)"
    de: "Tür- und Fenstersensoren (Außenhaut)"
  - pl: "Wyzwalają alarm przy uzbrojeniu poza domem, w domu i na noc."
    en: "Trigger the alarm when armed away, home and night."
    de: "Lösen den Alarm bei Scharfschaltung abwesend, zu Hause und Nacht aus."
  - pl: "Czujniki ruchu i obecności"
    en: "Motion and presence sensors"
    de: "Bewegungs- und Präsenzsensoren"
  - pl: "Wyzwalają alarm tylko przy uzbrojeniu poza domem, bo w domu są ludzie i zwierzęta."
    en: "Trigger the alarm only when armed away, because people and pets are at home otherwise."
    de: "Lösen den Alarm nur bei Scharfschaltung abwesend aus, weil sonst Menschen und Tiere im Haus sind."
  - pl: "Czujniki zagrożeń (dym, czad, gaz, zalanie)"
    en: "Hazard sensors (smoke, carbon monoxide, gas, water leak)"
    de: "Gefahrensensoren (Rauch, Kohlenmonoxid, Gas, Wasseraustritt)"
  - pl: "Zawsze pełny alarm, bez względu na stan centrali i ciszę nocną. Stan centrali się nie zmienia."
    en: "Always a full alarm, regardless of the panel state and quiet night. The panel state does not change."
    de: "Immer voller Alarm, unabhängig vom Zentralenzustand und der Nachtruhe. Der Zentralenzustand ändert sich nicht."
  - pl: "Syreny"
    en: "Sirens"
    de: "Sirenen"
  - pl: "Syreny (opcjonalnie)"
    en: "Sirens (optional)"
    de: "Sirenen (optional)"
  - pl: "Czas pracy syren"
    en: "Siren run time"
    de: "Laufzeit der Sirenen"
  - pl: "Potem syreny się wyłączają. Przy zagrożeniu syrena działa też tak długo, jak czujnik wykrywa zagrożenie."
    en: "Then the sirens turn off. For a hazard the siren also runs as long as the sensor detects it."
    de: "Danach schalten die Sirenen ab. Bei einer Gefahr läuft die Sirene auch so lange, wie der Sensor sie erkennt."
  - pl: "Cichy alarm przy włamaniu"
    en: "Silent alarm for burglary"
    de: "Stiller Alarm bei Einbruch"
  - pl: "Włączony = włamanie bez syren, tylko powiadomienia. Zagrożenia zawsze włączają syreny."
    en: "On = burglary without sirens, notifications only. Hazards always turn the sirens on."
    de: "Ein = Einbruch ohne Sirenen, nur Benachrichtigungen. Gefahren schalten die Sirenen immer ein."
  - pl: "Powiadomienia"
    en: "Notifications"
    de: "Benachrichtigungen"
  - pl: "Telefony"
    en: "Phones"
    de: "Telefone"
  - pl: "Telefony z aplikacją Home Assistant. Puste = wszystkie telefony z aplikacją."
    en: "Phones with the Home Assistant app. Empty = all phones with the app."
    de: "Telefone mit der Home Assistant App. Leer = alle Telefone mit der App."
  - pl: "Powiadomienie trafia do usługi notify.mobile_app_ o nazwie urządzenia."
    en: "The notification goes to the notify.mobile_app_ action named after the device."
    de: "Die Benachrichtigung geht an die Aktion notify.mobile_app_ mit dem Namen des Geräts."
  - pl: "Noc i wyjście z domu"
    en: "Night and leaving home"
    de: "Nacht und Verlassen des Hauses"
  - pl: "Uzbrajaj na noc według ciszy nocnej"
    en: "Arm for the night by quiet night"
    de: "Für die Nacht nach der Nachtruhe scharfschalten"
  - pl: "Początek ciszy nocnej uzbraja alarm na noc, koniec go rozbraja. Działa tylko z centralą,"
    en: "The start of quiet night arms the alarm for the night, its end disarms it. Works only with a panel"
    de: "Der Beginn der Nachtruhe schaltet den Alarm für die Nacht scharf, ihr Ende unscharf. Funktioniert nur mit einer Zentrale,"
  - pl: "która uzbraja bez kodu, i rozbraja tylko uzbrojenie zrobione przez automatyzację."
    en: "that arms without a code, and disarms only an arming made by the automation."
    de: "die ohne Code scharfschaltet, und schaltet nur eine Scharfschaltung durch die Automation unscharf."
  - pl: "Cisza nocna"
    en: "Quiet night"
    de: "Nachtruhe"
  - pl: "Przełącznik ciszy nocnej (włączony = noc). Wymagany do uzbrajania na noc. Puste = bez ciszy nocnej."
    en: "Quiet night switch (on = night). Required for arming at night. Empty = no quiet night."
    de: "Schalter der Nachtruhe (ein = Nacht). Nötig für die Scharfschaltung in der Nacht. Leer = keine Nachtruhe."
  - pl: "Przypomnij, gdy wszyscy wyszli, a alarm jest rozbrojony"
    en: "Remind when everyone has left and the alarm is disarmed"
    de: "Erinnern, wenn alle weg sind und der Alarm unscharf ist"
  - pl: "Domownicy"
    en: "Household members"
    de: "Haushaltsmitglieder"
  - pl: "Osoby z telefonem i lokalizacją. Puste = bez przypomnienia."
    en: "People with a phone and location. Empty = no reminder."
    de: "Personen mit Telefon und Standort. Leer = keine Erinnerung."
  - pl: "Pomocnik"
    en: "Helper"
    de: "Helfer"
  - pl: "Pomocnik - powód ostatniej decyzji (opcjonalnie)"
    en: "Helper - reason of the last decision (optional)"
    de: "Helfer - Grund der letzten Entscheidung (optional)"
  - pl: "Pomocnik Tekst o długości maks. 255 znaków, np. \"Nieuzbrojony na noc - Zamknij - Okno salon\"."
    en: "Text helper with max. length 255, e.g. \"Not armed for the night - Close - Living room window\"."
    de: "Text-Helfer mit max. Länge 255, z. B. \"Nicht für die Nacht scharfgeschaltet - Schließen - Fenster Wohnzimmer\"."
  - pl: "# Teksty powiadomień i powodów zatwierdzone 17.10.2026. {czujnik}, {godzina}, {imie}, {powod}, {lista}, {godzin} i {procent} są podmieniane."
    en: "# Texts of notifications and reasons approved on 17.10.2026. {czujnik}, {godzina}, {imie}, {powod}, {lista}, {godzin} and {procent} are replaced."
    de: "# Texte der Benachrichtigungen und Gründe, freigegeben am 17.10.2026. {czujnik}, {godzina}, {imie}, {powod}, {lista}, {godzin} und {procent} werden ersetzt."
