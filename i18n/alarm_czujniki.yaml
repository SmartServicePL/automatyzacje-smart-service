    en: "\"emergencies\""
    de: "\"Notfälle\""
  - pl: "\"PRZYJĄŁEM\""
    en: "\"ACKNOWLEDGE\""
    de: "\"BESTÄTIGEN\""
  - pl: "\"Uzbrój\""
    en: "\"Arm\""
    de: "\"Scharfschalten\""
  - pl: "\"Otwórz alarm\""
    en: "\"Open alarm\""
    de: "\"Alarm öffnen\""
  - pl: "\"centrali\""
    en: "\"of the panel\""
    de: "\"der Zentrale\""
  - pl: "\"ktoś z domowników\""
    en: "\"a household member\""
    de: "\"ein Haushaltsmitglied\""
  - pl: "\"Alarm: włamanie\""
    en: "\"Alarm: burglary\""
    de: "\"Alarm: Einbruch\""
  - pl: "\"Czujnik {czujnik} wyzwolił alarm o {godzina}.\\nCo zrobić: Sprawdź dom lub kamery. Jeśli to pomyłka, rozbrój alarm.\""
    en: "\"Sensor {czujnik} triggered the alarm at {godzina}.\\nWhat to do: Check the home or the cameras. If it is a mistake, disarm the alarm.\""
    de: "\"Sensor {czujnik} hat um {godzina} den Alarm ausgelöst.\\nWas tun: Prüfen Sie das Haus oder die Kameras. Wenn es ein Irrtum ist, schalten Sie den Alarm unscharf.\""
  - pl: "\"Czujnik {czujnik} wyzwolił cichy alarm o {godzina}. Syreny są wyłączone.\\nCo zrobić: Sprawdź dom lub kamery. Jeśli to pomyłka, rozbrój alarm.\""
    en: "\"Sensor {czujnik} triggered a silent alarm at {godzina}. The sirens are off.\\nWhat to do: Check the home or the cameras. If it is a mistake, disarm the alarm.\""
    de: "\"Sensor {czujnik} hat um {godzina} einen stillen Alarm ausgelöst. Die Sirenen sind aus.\\nWas tun: Prüfen Sie das Haus oder die Kameras. Wenn es ein Irrtum ist, schalten Sie den Alarm unscharf.\""
  - pl: "\"Alarm: dym\""
    en: "\"Alarm: smoke\""
    de: "\"Alarm: Rauch\""
  - pl: "\"Czujnik {czujnik} wykrył dym o {godzina}.\\nCo zrobić: Wyjdź z domu. Gdy widzisz dym lub ogień, dzwoń pod 112.\""
    en: "\"Sensor {czujnik} detected smoke at {godzina}.\\nWhat to do: Leave the home. If you see smoke or fire, call 112.\""
    de: "\"Sensor {czujnik} hat um {godzina} Rauch erkannt.\\nWas tun: Verlassen Sie das Haus. Wenn Sie Rauch oder Feuer sehen, rufen Sie 112 an.\""
  - pl: "\"Alarm: czad\""
    en: "\"Alarm: carbon monoxide\""
    de: "\"Alarm: Kohlenmonoxid\""
  - pl: "\"Czujnik {czujnik} wykrył czad o {godzina}.\\nCo zrobić: Otwórz okna, wyjdź na zewnątrz i dzwoń pod 112.\""
    en: "\"Sensor {czujnik} detected carbon monoxide at {godzina}.\\nWhat to do: Open the windows, go outside and call 112.\""
    de: "\"Sensor {czujnik} hat um {godzina} Kohlenmonoxid erkannt.\\nWas tun: Öffnen Sie die Fenster, gehen Sie nach draußen und rufen Sie 112 an.\""
  - pl: "\"Alarm: gaz\""
    en: "\"Alarm: gas\""
    de: "\"Alarm: Gas\""
  - pl: "\"Czujnik {czujnik} wykrył gaz o {godzina}.\\nCo zrobić: Nie używaj ognia ani włączników, otwórz okna, wyjdź i dzwoń pod 992.\""
    en: "\"Sensor {czujnik} detected gas at {godzina}.\\nWhat to do: Do not use fire or switches, open the windows, leave and call 992.\""
    de: "\"Sensor {czujnik} hat um {godzina} Gas erkannt.\\nWas tun: Benutzen Sie kein Feuer und keine Schalter, öffnen Sie die Fenster, verlassen Sie das Haus und rufen Sie 992 an.\""
  - pl: "\"Alarm: zalanie\""
    en: "\"Alarm: water leak\""
    de: "\"Alarm: Wasseraustritt\""
  - pl: "\"Czujnik {czujnik} wykrył wodę o {godzina}.\\nCo zrobić: Zakręć główny zawór wody i sprawdź miejsce przy czujniku.\""
    en: "\"Sensor {czujnik} detected water at {godzina}.\\nWhat to do: Shut off the main water valve and check the place near the sensor.\""
    de: "\"Sensor {czujnik} hat um {godzina} Wasser erkannt.\\nWas tun: Schließen Sie das Hauptwasserventil und prüfen Sie die Stelle am Sensor.\""
  - pl: "\"Alarm przyjęty\""
    en: "\"Alarm acknowledged\""
    de: "\"Alarm bestätigt\""
  - pl: "\"Potwierdzenie: {imie} o {godzina}.\\nCo zrobić: Nic, ktoś już się tym zajmuje.\""
    en: "\"Acknowledgement: {imie} at {godzina}.\\nWhat to do: Nothing, someone is already on it.\""
    de: "\"Bestätigung: {imie} um {godzina}.\\nWas tun: Nichts, jemand kümmert sich bereits darum.\""
  - pl: "\"Alarm nieuzbrojony na noc\""
    en: "\"Alarm not armed for the night\""
    de: "\"Alarm nicht für die Nacht scharfgeschaltet\""
  - pl: "\"{powod}.\\nCo zrobić: Popraw to i uzbrój alarm ręcznie.\""
    en: "\"{powod}.\\nWhat to do: Fix it and arm the alarm manually.\""
    de: "\"{powod}.\\nWas tun: Beheben Sie das und schalten Sie den Alarm von Hand scharf.\""
  - pl: "\"Alarm nadal uzbrojony\""
    en: "\"Alarm still armed\""
    de: "\"Alarm noch scharf\""
  - pl: "\"Centrala nie przyjęła rozbrojenia po nocy.\\nCo zrobić: Rozbrój alarm kodem przed otwarciem drzwi.\""
    en: "\"The panel did not accept disarming after the night.\\nWhat to do: Disarm the alarm with a code before opening the door.\""
    de: "\"Die Zentrale hat das Unscharfschalten nach der Nacht nicht angenommen.\\nWas tun: Schalten Sie den Alarm mit Code unscharf, bevor Sie die Tür öffnen.\""
  - pl: "\"Alarm nie został rozbrojony, bo w nocy był alarm.\\nCo zrobić: Sprawdź, co go wyzwoliło, i rozbrój alarm ręcznie.\""
    en: "\"The alarm was not disarmed because there was an alarm during the night.\\nWhat to do: Check what triggered it and disarm the alarm manually.\""
    de: "\"Der Alarm wurde nicht unscharf geschaltet, weil es in der Nacht einen Alarm gab.\\nWas tun: Prüfen Sie, was ihn ausgelöst hat, und schalten Sie den Alarm von Hand unscharf.\""
  - pl: "\"Alarm nie został rozbrojony, bo w nocy był restart systemu.\\nCo zrobić: Rozbrój alarm ręcznie przed otwarciem drzwi.\""
    en: "\"The alarm was not disarmed because the system restarted during the night.\\nWhat to do: Disarm the alarm manually before opening the door.\""
    de: "\"Der Alarm wurde nicht unscharf geschaltet, weil das System in der Nacht neu gestartet wurde.\\nWas tun: Schalten Sie den Alarm von Hand unscharf, bevor Sie die Tür öffnen.\""
  - pl: "\"Wszyscy wyszli, alarm nieuzbrojony\""
    en: "\"Everyone has left, alarm not armed\""
    de: "\"Alle sind weg, Alarm nicht scharf\""
  - pl: "\"Nikogo nie ma w domu, a alarm jest rozbrojony.\\nCo zrobić: Uzbrój alarm przyciskiem poniżej.\""
    en: "\"Nobody is home and the alarm is disarmed.\\nWhat to do: Arm the alarm with the button below.\""
    de: "\"Niemand ist zu Hause und der Alarm ist unscharf.\\nWas tun: Schalten Sie den Alarm mit der Schaltfläche unten scharf.\""
  - pl: "\"Nikogo nie ma w domu, a alarm jest rozbrojony.\\nCo zrobić: Otwórz alarm i uzbrój go kodem.\""
    en: "\"Nobody is home and the alarm is disarmed.\\nWhat to do: Open the alarm and arm it with a code.\""
    de: "\"Niemand ist zu Hause und der Alarm ist unscharf.\\nWas tun: Öffnen Sie den Alarm und schalten Sie ihn mit Code scharf.\""
  - pl: "\"Alarm uzbrojony\""
    en: "\"Alarm armed\""
    de: "\"Alarm scharf\""
  - pl: "\"Uzbrojenie: {imie}, z powiadomienia o {godzina}.\\nCo zrobić: Nic, alarm pilnuje domu.\""
    en: "\"Arming: {imie}, from the notification at {godzina}.\\nWhat to do: Nothing, the alarm is guarding the home.\""
    de: "\"Scharfschaltung: {imie}, aus der Benachrichtigung um {godzina}.\\nWas tun: Nichts, der Alarm bewacht das Haus.\""
  - pl: "\"Alarm nieuzbrojony\""
    en: "\"Alarm not armed\""
    de: "\"Alarm nicht scharfgeschaltet\""
  - pl: "\"{powod}.\\nCo zrobić: Popraw to i uzbrój alarm ponownie.\""
    en: "\"{powod}.\\nWhat to do: Fix it and arm the alarm again.\""
    de: "\"{powod}.\\nWas tun: Beheben Sie das und schalten Sie den Alarm erneut scharf.\""
