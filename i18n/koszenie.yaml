# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - automatyczne koszenie trawnika"
    en: "Smart Service - automatic lawn mowing"
    de: "Smart Service - automatisches Rasenmähen"
  - pl: "Uniwersalne, bezpieczne uruchamianie robota koszącego z Home Assistant"
    en: "Universal, safe starting of a robotic lawn mower from Home Assistant"
    de: "Universeller, sicherer Start eines Mähroboters aus Home Assistant"
  - pl: "(dowolna integracja udostępniająca encję lawn_mower, np. Husqvarna Automower,"
    en: "(any integration that provides a lawn_mower entity, e.g. Husqvarna Automower,"
    de: "(jede Integration mit einer lawn_mower-Entität, z. B. Husqvarna Automower,"
  - pl: "Worx Landroid, Segway Navimow, Gardena, Mammotion, Ecovacs GOAT)."
    en: "Worx Landroid, Segway Navimow, Gardena, Mammotion, Ecovacs GOAT)."
    de: "Worx Landroid, Segway Navimow, Gardena, Mammotion, Ecovacs GOAT)."
  - pl: "Robot startuje, gdy jednocześnie:"
    en: "The mower starts when all of the following are true:"
    de: "Der Mähroboter startet, wenn gleichzeitig:"
  - pl: "- kosiarka stoi w bazie i ma wystarczająco naładowaną baterię,"
    en: "- the mower is docked and its battery is charged enough,"
    de: "- der Mäher in der Ladestation steht und der Akku ausreichend geladen ist,"
  - pl: "- minął ustawiony odstęp od ostatniego koszenia (pomocnik z datą),"
    en: "- the set interval since the last mowing has passed (date helper),"
    de: "- der eingestellte Abstand seit dem letzten Mähen vergangen ist (Datums-Helfer),"
  - pl: "- nie pada, a od ostatniego opadu minął czas schnięcia trawy (opcjonalnie),"
    en: "- it is not raining and the grass drying time since the last rain has passed (optional),"
    de: "- es nicht regnet und seit dem letzten Regen die Trocknungszeit des Rasens vergangen ist (optional),"
  - pl: "- prognoza godzinowa nie przewiduje deszczu w najbliższych godzinach (opcjonalnie),"
    en: "- the hourly forecast shows no rain in the next few hours (optional),"
    de: "- die stündliche Vorhersage für die nächsten Stunden keinen Regen erwartet (optional),"
  - pl: "- temperatura jest w dozwolonym zakresie i nie ma rosy (opcjonalnie),"
    en: "- the temperature is within the allowed range and there is no dew (optional),"
    de: "- die Temperatur im zulässigen Bereich liegt und kein Tau vorhanden ist (optional),"
  - pl: "- żadna blokada nie jest włączona (opcjonalnie)."
    en: "- no block is switched on (optional)."
    de: "- keine Sperre eingeschaltet ist (optional)."
  - pl: "Domyślnie koszenie nie ma ograniczeń godzin ani dni. W sekcji \"Harmonogram\""
    en: "By default, mowing is not limited to any hours or days. In the \"Schedule\""
    de: "Standardmäßig ist das Mähen nicht auf Uhrzeiten oder Tage beschränkt. In den Abschnitten \"Zeitplan\""
  - pl: "i \"Bezpieczeństwo\" można włączyć: wybrane dni tygodnia, okno godzin,"
    en: "and \"Safety\" sections you can enable: selected weekdays, a time window,"
    de: "und \"Sicherheit\" können Sie aktivieren: ausgewählte Wochentage, ein Zeitfenster,"
  - pl: "koszenie tylko za dnia (wysokość słońca) oraz wstrzymanie, gdy ktoś jest"
    en: "mowing in daylight only (sun elevation) and holding off while someone is"
    de: "Mähen nur bei Tageslicht (Sonnenhöhe) sowie eine Pause, solange sich jemand"
  - pl: "w ogrodzie. Koszenie tylko za dnia chroni jeże, które żerują po zmroku."
    en: "in the garden. Mowing in daylight only protects hedgehogs, which forage after dark."
    de: "im Garten aufhält. Mähen nur bei Tageslicht schützt Igel, die nach Einbruch der Dunkelheit auf Nahrungssuche gehen."
  - pl: "W trakcie koszenia: deszcz odsyła robota do bazy, wejście kogoś do ogrodu"
    en: "While mowing: rain sends the mower back to its base, someone entering the garden"
    de: "Während des Mähens: Regen schickt den Mäher zur Ladestation zurück, betritt jemand den Garten,"
  - pl: "wstrzymuje albo odsyła robota (jeśli włączone), a błąd, długa pauza,"
    en: "pauses the mower or sends it back (if enabled), and an error, a long pause,"
    de: "wird der Mäher angehalten oder zurückgeschickt (falls aktiviert), und ein Fehler, eine lange Pause,"
  - pl: "brak łączności i zbyt długie koszenie wysyłają jedno powiadomienie na zdarzenie."
    en: "a lost connection or mowing for too long send one notification per event."
    de: "ein Verbindungsverlust oder zu langes Mähen senden je Ereignis eine Benachrichtigung."
  - pl: "Wymagania:"
    en: "Requirements:"
    de: "Voraussetzungen:"
  - pl: "- pomocnik input_datetime (data i godzina) \"Najwcześniejsze następne koszenie\","
    en: "- an input_datetime helper (date and time) \"Earliest next mowing\","
    de: "- ein input_datetime-Helfer (Datum und Uhrzeit) \"Frühestes nächstes Mähen\","
  - pl: "- wyłączony harmonogram w aplikacji producenta (inaczej robot będzie kosił też sam)."
    en: "- the schedule in the manufacturer's app turned off (otherwise the mower will also mow on its own)."
    de: "- ein deaktivierter Zeitplan in der Hersteller-App (sonst mäht der Roboter zusätzlich von selbst)."
  - pl: "Kosiarka"
    en: "Mower"
    de: "Mäher"
  - pl: "Encja lawn_mower robota koszącego."
    en: "The lawn_mower entity of the robotic mower."
    de: "Die lawn_mower-Entität des Mähroboters."
  - pl: "Bateria kosiarki (opcjonalnie)"
    en: "Mower battery (optional)"
    de: "Akku des Mähers (optional)"
  - pl: "Sensor poziomu baterii w procentach. Puste = bez sprawdzania baterii."
    en: "Battery level sensor in percent. Empty = battery is not checked."
    de: "Sensor für den Akkustand in Prozent. Leer = Akku wird nicht geprüft."
  - pl: "Minimalna bateria do startu"
    en: "Minimum battery to start"
    de: "Mindest-Akkustand für den Start"
  - pl: "Pomocnik - najwcześniejsze następne koszenie"
    en: "Helper - earliest next mowing"
    de: "Helfer - frühestes nächstes Mähen"
  - pl: "Pomocnik input_datetime z datą i godziną. Automatyzacja sama zapisuje"
    en: "An input_datetime helper with date and time. The automation itself stores"
    de: "Ein input_datetime-Helfer mit Datum und Uhrzeit. Die Automatisierung speichert"
  - pl: "w nim, kiedy najwcześniej wolno znowu kosić (po koszeniu i po nieudanym starcie)."
    en: "in it the earliest time mowing is allowed again (after mowing and after a failed start)."
    de: "darin selbst, wann frühestens wieder gemäht werden darf (nach dem Mähen und nach einem fehlgeschlagenen Start)."
  - pl: "Harmonogram"
    en: "Schedule"
    de: "Zeitplan"
  - pl: "Kosić tylko w wybrane dni"
    en: "Mow only on selected days"
    de: "Nur an ausgewählten Tagen mähen"
  - pl: "Wyłączone = koszenie w każdy dzień tygodnia."
    en: "Off = mowing on every day of the week."
    de: "Aus = Mähen an jedem Wochentag."
  - pl: "Dni koszenia"
    en: "Mowing days"
    de: "Mähtage"
  - pl: "Używane tylko po włączeniu opcji powyżej."
    en: "Used only when the option above is turned on."
    de: "Wird nur verwendet, wenn die Option oben aktiviert ist."
  - pl: "Poniedziałek"
    en: "Monday"
    de: "Montag"
  - pl: "Wtorek"
    en: "Tuesday"
    de: "Dienstag"
  - pl: "Środa"
    en: "Wednesday"
    de: "Mittwoch"
  - pl: "Czwartek"
    en: "Thursday"
    de: "Donnerstag"
  - pl: "Piątek"
    en: "Friday"
    de: "Freitag"
  - pl: "Sobota"
    en: "Saturday"
    de: "Samstag"
  - pl: "Niedziela"
    en: "Sunday"
    de: "Sonntag"
  - pl: "Kosić tylko w wybranych godzinach"
    en: "Mow only during selected hours"
    de: "Nur zu ausgewählten Uhrzeiten mähen"
  - pl: "Wyłączone = start o dowolnej porze doby."
    en: "Off = start at any time of day."
    de: "Aus = Start zu jeder Tageszeit."
  - pl: "Początek okna koszenia"
    en: "Mowing window start"
    de: "Beginn des Mähfensters"
  - pl: "Używane tylko po włączeniu opcji powyżej. Okno może przechodzić przez północ (np. 22:00-05:00)."
    en: "Used only when the option above is turned on. The window may span midnight (e.g. 22:00-05:00)."
    de: "Wird nur verwendet, wenn die Option oben aktiviert ist. Das Fenster darf über Mitternacht gehen (z. B. 22:00-05:00)."
  - pl: "Koniec okna koszenia (najpóźniejszy start)"
    en: "Mowing window end (latest start)"
    de: "Ende des Mähfensters (spätester Start)"
  - pl: "Używane tylko po włączeniu opcji \"Kosić tylko w wybranych godzinach\"."
    en: "Used only when \"Mow only during selected hours\" is turned on."
    de: "Wird nur verwendet, wenn \"Nur zu ausgewählten Uhrzeiten mähen\" aktiviert ist."
  - pl: "Odstęp między koszeniami"
    en: "Interval between mowings"
    de: "Abstand zwischen zwei Mähvorgängen"
  - pl: "Po potwierdzonym koszeniu (także uruchomionym ręcznie) następne nie wcześniej niż po tylu godzinach."
    en: "After a confirmed mowing (also one started manually), the next one starts no sooner than after this many hours."
    de: "Nach einem bestätigten Mähvorgang (auch einem manuell gestarteten) folgt der nächste frühestens nach so vielen Stunden."
  - pl: "Ponowienie po nieudanym lub przerwanym starcie"
    en: "Retry after a failed or interrupted start"
    de: "Erneuter Versuch nach fehlgeschlagenem oder abgebrochenem Start"
  - pl: "Koszenie uznane za wykonane po"
    en: "Mowing counts as done after"
    de: "Mähen gilt als erledigt nach"
  - pl: "Ile minut robot musi kosić bez przerwy, żeby uznać koszenie za wykonane."
    en: "How many minutes the mower must mow without a break for the mowing to count as done."
    de: "Wie viele Minuten der Roboter ohne Unterbrechung mähen muss, damit das Mähen als erledigt gilt."
  - pl: "Pogoda"
    en: "Weather"
    de: "Wetter"
  - pl: "Czujniki deszczu (opcjonalnie)"
    en: "Rain sensors (optional)"
    de: "Regensensoren (optional)"
  - pl: "Binary sensory opadu (stacja pogodowa, czujnik kosiarki). Stan \"on\" = pada."
    en: "Rain binary sensors (weather station, mower sensor). State \"on\" = it is raining."
    de: "Binäre Regensensoren (Wetterstation, Sensor des Mähers). Zustand \"on\" = es regnet."
  - pl: "Czas schnięcia liczy się od ostatniej zmiany czujnika na \"off\"."
    en: "The drying time counts from the last change of a sensor to \"off\"."
    de: "Die Trocknungszeit zählt ab dem letzten Wechsel eines Sensors auf \"off\"."
  - pl: "Czas schnięcia trawy po deszczu"
    en: "Grass drying time after rain"
    de: "Trocknungszeit des Rasens nach Regen"
  - pl: "Prognoza pogody (opcjonalnie)"
    en: "Weather forecast (optional)"
    de: "Wettervorhersage (optional)"
  - pl: "Encja weather z prognozą godzinową. Puste = bez sprawdzania prognozy."
    en: "A weather entity with an hourly forecast. Empty = forecast is not checked."
    de: "Eine weather-Entität mit stündlicher Vorhersage. Leer = Vorhersage wird nicht geprüft."
  - pl: "Ile godzin naprzód sprawdzać prognozę"
    en: "How many hours ahead to check the forecast"
    de: "Wie viele Stunden im Voraus die Vorhersage geprüft wird"
  - pl: "Maksymalny prognozowany opad w tym czasie"
    en: "Maximum forecast rainfall in that time"
    de: "Maximaler vorhergesagter Niederschlag in dieser Zeit"
  - pl: "Maksymalne prawdopodobieństwo opadu"
    en: "Maximum probability of rain"
    de: "Maximale Regenwahrscheinlichkeit"
  - pl: "Temperatura zewnętrzna (opcjonalnie)"
    en: "Outdoor temperature (optional)"
    de: "Außentemperatur (optional)"
  - pl: "Minimalna temperatura koszenia"
    en: "Minimum mowing temperature"
    de: "Mindesttemperatur zum Mähen"
  - pl: "Chroni trawę przed koszeniem przy przymrozku i tuż po nim."
    en: "Protects the grass from being mowed during a frost and right after it."
    de: "Schützt den Rasen vor dem Mähen bei Frost und kurz danach."
  - pl: "Maksymalna temperatura koszenia"
    en: "Maximum mowing temperature"
    de: "Höchsttemperatur zum Mähen"
  - pl: "Wilgotność powietrza (opcjonalnie)"
    en: "Air humidity (optional)"
    de: "Luftfeuchtigkeit (optional)"
  - pl: "Razem z temperaturą wykrywa rosę (punkt rosy). Wymaga też czujnika temperatury."
    en: "Together with the temperature, detects dew (dew point). Also requires the temperature sensor."
    de: "Erkennt zusammen mit der Temperatur Tau (Taupunkt). Erfordert auch den Temperatursensor."
  - pl: "Minimalna różnica temperatury i punktu rosy"
    en: "Minimum difference between temperature and dew point"
    de: "Mindestabstand zwischen Temperatur und Taupunkt"
  - pl: "Bezpieczeństwo"
    en: "Safety"
    de: "Sicherheit"
  - pl: "Kosić tylko za dnia"
    en: "Mow only in daylight"
    de: "Nur bei Tageslicht mähen"
  - pl: "Start tylko, gdy słońce jest nad horyzontem (encja sun.sun)."
    en: "Start only when the sun is above the horizon (sun.sun entity)."
    de: "Start nur, wenn die Sonne über dem Horizont steht (Entität sun.sun)."
  - pl: "Zalecane: jeże i inne małe zwierzęta żerują po zmroku."
    en: "Recommended: hedgehogs and other small animals forage after dark."
    de: "Empfohlen: Igel und andere Kleintiere gehen nach Einbruch der Dunkelheit auf Nahrungssuche."
  - pl: "Minimalna wysokość słońca"
    en: "Minimum sun elevation"
    de: "Mindest-Sonnenhöhe"
  - pl: "Używane tylko po włączeniu opcji \"Kosić tylko za dnia\". 3° to około 20 minut po wschodzie i przed zachodem."
    en: "Used only when \"Mow only in daylight\" is turned on. 3° is about 20 minutes after sunrise and before sunset."
    de: "Wird nur verwendet, wenn \"Nur bei Tageslicht mähen\" aktiviert ist. 3° entspricht etwa 20 Minuten nach Sonnenaufgang und vor Sonnenuntergang."
  - pl: "Nie kosić, gdy ktoś jest w ogrodzie"
    en: "Do not mow while someone is in the garden"
    de: "Nicht mähen, wenn jemand im Garten ist"
  - pl: "Czujniki \"ktoś w ogrodzie\""
    en: "Sensors for \"someone in the garden\""
    de: "Sensoren für \"jemand im Garten\""
  - pl: "Czujniki ruchu lub obecności w ogrodzie, furtka, przełącznik \"dzieci/psy w ogrodzie\"."
    en: "Motion or presence sensors in the garden, a gate, a \"children/dogs in the garden\" switch."
    de: "Bewegungs- oder Anwesenheitssensoren im Garten, Gartentor, Schalter \"Kinder/Hunde im Garten\"."
  - pl: "Stan \"on\" = ktoś jest. Używane tylko po włączeniu opcji powyżej."
    en: "State \"on\" = someone is there. Used only when the option above is turned on."
    de: "Zustand \"on\" = jemand ist da. Wird nur verwendet, wenn die Option oben aktiviert ist."
  - pl: "Gdy ktoś wejdzie do ogrodu podczas koszenia"
    en: "When someone enters the garden during mowing"
    de: "Wenn jemand während des Mähens den Garten betritt"
  - pl: "Odeślij kosiarkę do bazy"
    en: "Send the mower back to its base"
    de: "Mäher zur Ladestation schicken"
  - pl: "Wstrzymaj kosiarkę na trawniku"
    en: "Pause the mower on the lawn"
    de: "Mäher auf dem Rasen anhalten"
  - pl: "Nic nie rób"
    en: "Do nothing"
    de: "Nichts tun"
  - pl: "Blokady (opcjonalnie)"
    en: "Blocks (optional)"
    de: "Sperren (optional)"
  - pl: "Przełączniki lub czujniki, których stan \"on\" blokuje koszenie (np. impreza, urlop, święto)."
    en: "Switches or sensors whose \"on\" state blocks mowing (e.g. a party, vacation, public holiday)."
    de: "Schalter oder Sensoren, deren Zustand \"on\" das Mähen sperrt (z. B. Party, Urlaub, Feiertag)."
  - pl: "Nadzór i powiadomienia"
    en: "Monitoring and notifications"
    de: "Überwachung und Benachrichtigungen"
  - pl: "Odsyłaj do bazy, gdy zacznie padać"
    en: "Send back to the base when it starts raining"
    de: "Zur Ladestation schicken, wenn es zu regnen beginnt"
  - pl: "Powiadom o pauzie trwającej dłużej niż"
    en: "Notify about a pause lasting longer than"
    de: "Bei einer Pause benachrichtigen, die länger dauert als"
  - pl: "Powiadom o koszeniu trwającym dłużej niż"
    en: "Notify about mowing lasting longer than"
    de: "Bei einem Mähvorgang benachrichtigen, der länger dauert als"
  - pl: "Powiadamiaj także o starcie i zatrzymaniu przez deszcz lub ogród"
    en: "Also notify about starts and about stops caused by rain or people in the garden"
    de: "Auch über den Start und über Stopps wegen Regen oder Personen im Garten benachrichtigen"
  - pl: "Akcje powiadomienia"
    en: "Notification actions"
    de: "Benachrichtigungsaktionen"
  - pl: "Akcje wykonywane przy każdym powiadomieniu, np. notify.mobile_app_telefon."
    en: "Actions run for every notification, e.g. notify.mobile_app_phone."
    de: "Aktionen, die bei jeder Benachrichtigung ausgeführt werden, z. B. notify.mobile_app_handy."
  - pl: "Dostępne zmienne: {{ tytul }} i {{ tresc }}. Puste = bez powiadomień."
    en: "Available variables: {{ tytul }} (title) and {{ tresc }} (message). Empty = no notifications."
    de: "Verfügbare Variablen: {{ tytul }} (Titel) und {{ tresc }} (Text). Leer = keine Benachrichtigungen."
  - pl: "# Pusty tekst = wszystkie warunki startu spełnione (bez prognozy, sprawdzanej osobno)."
    en: "# Empty text = all start conditions are met (except the forecast, which is checked separately)."
    de: "# Leerer Text = alle Startbedingungen erfüllt (außer der Vorhersage, die separat geprüft wird)."
  - pl: "dziś nie jest dniem koszenia"
    en: "today is not a mowing day"
    de: "heute ist kein Mähtag"
  - pl: "poza oknem koszenia {{ okno_od[:5] }}-{{ okno_do[:5] }}"
    en: "outside the mowing window {{ okno_od[:5] }}-{{ okno_do[:5] }}"
    de: "außerhalb des Mähfensters {{ okno_od[:5] }}-{{ okno_do[:5] }}"
  - pl: "kosiarka nie stoi w bazie (stan: {{ states(kosiarka) }})"
    en: "the mower is not docked (state: {{ states(kosiarka) }})"
    de: "der Mäher steht nicht in der Ladestation (Zustand: {{ states(kosiarka) }})"
  - pl: "za wcześnie, najbliższe koszenie od {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
    en: "too early, next mowing from {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
    de: "zu früh, nächstes Mähen ab {{ nastepne | timestamp_custom('%d.%m %H:%M') }}"
  - pl: "brak odczytu baterii"
    en: "no battery reading"
    de: "kein Akkuwert verfügbar"
  - pl: "bateria {{ states(bateria) }}%, minimum {{ min_bateria | int }}%"
    en: "battery {{ states(bateria) }}%, minimum {{ min_bateria | int }}%"
    de: "Akku {{ states(bateria) }} %, Minimum {{ min_bateria | int }} %"
  - pl: "pada"
    en: "raining"
    de: "es regnet"
  - pl: "trawa schnie po deszczu do {{ ns.mokro | timestamp_custom('%H:%M') }}"
    en: "the grass is drying after rain until {{ ns.mokro | timestamp_custom('%H:%M') }}"
    de: "der Rasen trocknet nach Regen bis {{ ns.mokro | timestamp_custom('%H:%M') }}"
  - pl: "brak odczytu temperatury"
    en: "no temperature reading"
    de: "kein Temperaturwert verfügbar"
  - pl: "temperatura {{ t }} °C poza zakresem {{ min_temp | int }}-{{ max_temp | int }} °C"
    en: "temperature {{ t }} °C outside the range {{ min_temp | int }}-{{ max_temp | int }} °C"
    de: "Temperatur {{ t }} °C außerhalb des Bereichs {{ min_temp | int }}-{{ max_temp | int }} °C"
  - pl: "rosa na trawie (wilgotność {{ rh | round(0) | int }}%)"
    en: "dew on the grass (humidity {{ rh | round(0) | int }}%)"
    de: "Tau auf dem Rasen (Luftfeuchtigkeit {{ rh | round(0) | int }} %)"
  - pl: "brak encji sun.sun - nie można sprawdzić, czy jest jasno"
    en: "no sun.sun entity - cannot check whether it is light outside"
    de: "keine Entität sun.sun - Tageslicht kann nicht geprüft werden"
  - pl: "za ciemno (słońce {{ state_attr('sun.sun', 'elevation') | round(0) | int }}°)"
    en: "too dark (sun at {{ state_attr('sun.sun', 'elevation') | round(0) | int }}°)"
    de: "zu dunkel (Sonne bei {{ state_attr('sun.sun', 'elevation') | round(0) | int }}°)"
  - pl: "ktoś jest w ogrodzie"
    en: "someone is in the garden"
    de: "jemand ist im Garten"
  - pl: "włączona blokada koszenia"
    en: "a mowing block is on"
    de: "eine Mähsperre ist eingeschaltet"
  - pl: "Sprawdź warunki i uruchom koszenie"
    en: "Check the conditions and start mowing"
    de: "Bedingungen prüfen und Mähen starten"
  - pl: "Bez prognozy godzinowej start tylko, gdy są czujniki deszczu"
    en: "Without an hourly forecast, start only if there are rain sensors"
    de: "Ohne stündliche Vorhersage nur starten, wenn Regensensoren vorhanden sind"
  - pl: "Do potwierdzenia koszenia nie startuj ponownie"
    en: "Do not start again until mowing is confirmed"
    de: "Bis zur Bestätigung des Mähens nicht erneut starten"
  - pl: "\"{{ nazwa }}: nie wystartowała\""
    en: "\"{{ nazwa }}: did not start\""
    de: "\"{{ nazwa }}: nicht gestartet\""
  - pl: "Kosiarka nie wyjechała z bazy po komendzie startu (stan: {{ states(kosiarka) }})."
    en: "The mower did not leave its base after the start command (state: {{ states(kosiarka) }})."
    de: "Der Mäher hat die Ladestation nach dem Startbefehl nicht verlassen (Zustand: {{ states(kosiarka) }})."
  - pl: "Następna próba najwcześniej za {{ ponowienie_godz }} h."
    en: "Next attempt at the earliest in {{ ponowienie_godz }} h."
    de: "Nächster Versuch frühestens in {{ ponowienie_godz }} h."
  - pl: "\"{{ nazwa }}: koszenie rozpoczęte\""
    en: "\"{{ nazwa }}: mowing started\""
    de: "\"{{ nazwa }}: Mähen gestartet\""
  - pl: "Kosiarka wyjechała z bazy {{ now().strftime('%H:%M') }}."
    en: "The mower left its base at {{ now().strftime('%H:%M') }}."
    de: "Der Mäher hat die Ladestation um {{ now().strftime('%H:%M') }} verlassen."
  - pl: "Koszenie potwierdzone - wyznacz następny termin"
    en: "Mowing confirmed - set the next date"
    de: "Mähen bestätigt - nächsten Termin festlegen"
  - pl: "Deszcz podczas koszenia"
    en: "Rain during mowing"
    de: "Regen während des Mähens"
  - pl: "\"{{ nazwa }}: powrót do bazy\""
    en: "\"{{ nazwa }}: returning to base\""
    de: "\"{{ nazwa }}: Rückkehr zur Ladestation\""
  - pl: "Zaczęło padać - kosiarka wraca do bazy. Koszenie zostanie wznowione po wyschnięciu trawy."
    en: "It started raining - the mower is returning to its base. Mowing will resume once the grass has dried."
    de: "Es hat angefangen zu regnen - der Mäher fährt zur Ladestation zurück. Das Mähen wird fortgesetzt, sobald der Rasen getrocknet ist."
  - pl: "Ktoś wszedł do ogrodu podczas koszenia"
    en: "Someone entered the garden during mowing"
    de: "Jemand hat während des Mähens den Garten betreten"
  - pl: "\"{{ nazwa }}: koszenie zatrzymane\""
    en: "\"{{ nazwa }}: mowing stopped\""
    de: "\"{{ nazwa }}: Mähen unterbrochen\""
  - pl: "Ktoś jest w ogrodzie - kosiarka"
    en: "Someone is in the garden - the mower"
    de: "Jemand ist im Garten - der Mäher"
  - pl: "{{ 'czeka na trawniku (wznów ją ręcznie)' if reakcja_ogrod == 'pause' else 'wraca do bazy' }}."
    en: "{{ 'is waiting on the lawn (resume it manually)' if reakcja_ogrod == 'pause' else 'is returning to its base' }}."
    de: "{{ 'wartet auf dem Rasen (setzen Sie ihn manuell fort)' if reakcja_ogrod == 'pause' else 'fährt zur Ladestation zurück' }}."
  - pl: "Problem z kosiarką - jedno powiadomienie na zdarzenie"
    en: "Mower problem - one notification per event"
    de: "Problem mit dem Mäher - eine Benachrichtigung pro Ereignis"
  - pl: "\"{{ nazwa }} wymaga uwagi\""
    en: "\"{{ nazwa }} needs attention\""
    de: "\"{{ nazwa }} benötigt Aufmerksamkeit\""
  - pl: "Kosiarka zgłosiła błąd{{ (': ' ~ opis) if opis else '' }}. Sprawdź ją na trawniku."
    en: "The mower reported an error{{ (': ' ~ opis) if opis else '' }}. Check it on the lawn."
    de: "Der Mäher hat einen Fehler gemeldet{{ (': ' ~ opis) if opis else '' }}. Bitte prüfen Sie ihn auf dem Rasen."
  - pl: "Kosiarka stoi wstrzymana od {{ ((now() - states[kosiarka].last_changed).total_seconds() // 60) | int }} min."
    en: "The mower has been paused for {{ ((now() - states[kosiarka].last_changed).total_seconds() // 60) | int }} min."
    de: "Der Mäher pausiert schon seit {{ ((now() - states[kosiarka].last_changed).total_seconds() // 60) | int }} min."
  - pl: "Brak łączności z kosiarką od 30 min. Sprawdź zasilanie stacji i zasięg."
    en: "No connection to the mower for 30 min. Check the base station power supply and the signal coverage."
    de: "Seit 30 min keine Verbindung zum Mäher. Prüfen Sie die Stromversorgung der Ladestation und den Empfang."
  - pl: "Kosiarka kosi bez przerwy dłużej niż {{ max_czas_koszenia_godz }} h. Sprawdź, czy nie utknęła."
    en: "The mower has been mowing without a break for more than {{ max_czas_koszenia_godz }} h. Check whether it is stuck."
    de: "Der Mäher mäht seit mehr als {{ max_czas_koszenia_godz }} h ohne Unterbrechung. Prüfen Sie, ob er feststeckt."
