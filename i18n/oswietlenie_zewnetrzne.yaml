# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - oświetlenie zewnętrzne"
    en: "Smart Service - outdoor lighting"
    de: "Smart Service - Außenbeleuchtung"
  - pl: "Lampy przed domem i w ogrodzie według zmierzchu, godziny i ruchu."
    en: "Lamps in front of the house and in the garden by dusk, time and motion."
    de: "Lampen vor dem Haus und im Garten nach Dämmerung, Uhrzeit und Bewegung."
  - pl: "Kiedy świeci: od zmierzchu do ustawionej godziny, od zmierzchu do świtu albo tylko"
    en: "When it lights: from dusk to the set time, from dusk to dawn or only"
    de: "Wann es leuchtet: von der Dämmerung bis zur eingestellten Uhrzeit, von der Abend- bis zur Morgendämmerung oder nur"
  - pl: "przy ruchu. Zmierzch i świt liczone z położenia słońca."
    en: "on motion. Dusk and dawn are calculated from the position of the sun."
    de: "bei Bewegung. Abend- und Morgendämmerung werden aus dem Sonnenstand berechnet."
  - pl: "Czujniki ruchu (opcjonalnie) działają tylko po zmierzchu: pełne światło przez"
    en: "Motion sensors (optional) work only after dusk: full light for"
    de: "Bewegungssensoren (optional) wirken nur nach der Dämmerung: volles Licht für"
  - pl: "ustawiony czas po ostatnim ruchu, także w ciszy nocnej."
    en: "the set time after the last motion, also during quiet night."
    de: "die eingestellte Zeit nach der letzten Bewegung, auch während der Nachtruhe."
  - pl: "Opcjonalnie: w ciszy nocnej tylko przy ruchu, a przy alarmie włamania wszystkie"
    en: "Optional: only on motion during quiet night, and on a burglary alarm all"
    de: "Optional: während der Nachtruhe nur bei Bewegung, und bei Einbruchalarm alle"
  - pl: "lampy na 100 %. Po alarmie lampy wracają do stanu z harmonogramu."
    en: "lamps at 100 %. After the alarm the lamps return to the schedule state."
    de: "Lampen auf 100 %. Nach dem Alarm kehren die Lampen zum Zustand des Zeitplans zurück."
  - pl: "Lampy ze ściemnianiem świecą przy ruchu i alarmie na 100 %. Pogoda nie ma wpływu."
    en: "Dimmable lamps light at 100 % on motion and alarm. Weather has no effect."
    de: "Dimmbare Lampen leuchten bei Bewegung und Alarm mit 100 %. Das Wetter hat keinen Einfluss."
  - pl: "Bez pomocników."
    en: "No helpers needed."
    de: "Keine Helfer nötig."
  - pl: "Lampy i harmonogram"
    en: "Lamps and schedule"
    de: "Lampen und Zeitplan"
  - pl: "Lampy"
    en: "Lamps"
    de: "Lampen"
  - pl: "Światła i przełączniki oświetlenia na zewnątrz."
    en: "Outdoor lights and lighting switches."
    de: "Außenlichter und Lichtschalter."
  - pl: "Kiedy świeci"
    en: "When it lights"
    de: "Wann es leuchtet"
  - pl: "Od zmierzchu do godziny"
    en: "From dusk to a set time"
    de: "Von der Dämmerung bis zur Uhrzeit"
  - pl: "Od zmierzchu do świtu"
    en: "From dusk to dawn"
    de: "Von der Abend- bis zur Morgendämmerung"
  - pl: "Tylko przy ruchu"
    en: "Only on motion"
    de: "Nur bei Bewegung"
  - pl: "Godzina gaszenia"
    en: "Switch-off time"
    de: "Ausschaltzeit"
  - pl: "Tylko przy \"Od zmierzchu do godziny\". Godzina po północy (np. 01:00) = gaszenie w nocy."
    en: "Only with \"From dusk to a set time\". A time after midnight (e.g. 01:00) = switch-off during the night."
    de: "Nur bei \"Von der Dämmerung bis zur Uhrzeit\". Eine Uhrzeit nach Mitternacht (z. B. 01:00) = Ausschalten in der Nacht."
  - pl: "Ruch"
    en: "Motion"
    de: "Bewegung"
  - pl: "Czujniki ruchu na zewnątrz (opcjonalnie)"
    en: "Outdoor motion sensors (optional)"
    de: "Bewegungssensoren außen (optional)"
  - pl: "Działają tylko po zmierzchu. Zewnętrzne czujniki reagują też na zwierzęta i ruch gałęzi."
    en: "Work only after dusk. Outdoor sensors also react to animals and moving branches."
    de: "Wirken nur nach der Dämmerung. Außensensoren reagieren auch auf Tiere und bewegte Äste."
  - pl: "Pełne światło po ostatnim ruchu"
    en: "Full light after the last motion"
    de: "Volles Licht nach der letzten Bewegung"
  - pl: "Noc"
    en: "Night"
    de: "Nacht"
  - pl: "W ciszy nocnej tylko przy ruchu"
    en: "Only on motion during quiet night"
    de: "Während der Nachtruhe nur bei Bewegung"
  - pl: "W ciszy nocnej lampy są zgaszone i zapala je tylko ruch."
    en: "During quiet night the lamps are off and only motion switches them on."
    de: "Während der Nachtruhe sind die Lampen aus und nur Bewegung schaltet sie ein."
  - pl: "Cisza nocna"
    en: "Quiet night"
    de: "Nachtruhe"
  - pl: "Przełącznik ciszy nocnej (włączony = noc). Puste = bez ciszy nocnej."
    en: "Quiet night switch (on = night). Empty = no quiet night."
    de: "Nachtruhe-Schalter (an = Nacht). Leer = keine Nachtruhe."
  - pl: "Alarm"
    en: "Alarm"
    de: "Alarm"
  - pl: "Przy alarmie włamania zapal wszystko"
    en: "Switch everything on during a burglary alarm"
    de: "Bei Einbruchalarm alles einschalten"
  - pl: "Przy alarmie wszystkie lampy na 100 %, także w dzień. Po alarmie powrót do stanu z harmonogramu."
    en: "During an alarm all lamps at 100 %, also in daytime. After the alarm back to the schedule state."
    de: "Bei Alarm alle Lampen auf 100 %, auch tagsüber. Nach dem Alarm zurück zum Zustand des Zeitplans."
  - pl: "Centrala alarmu"
    en: "Alarm panel"
    de: "Alarmzentrale"
  - pl: "Encja alarm_control_panel. Puste = bez współpracy z alarmem."
    en: "An alarm_control_panel entity. Empty = no alarm link."
    de: "Eine alarm_control_panel-Entität. Leer = keine Alarmkopplung."
  - pl: "Zaawansowane"
    en: "Advanced"
    de: "Erweitert"
  - pl: "Zmierzch przy wysokości słońca"
    en: "Dusk at sun elevation"
    de: "Dämmerung bei Sonnenhöhe"
  - pl: "Lampy zapalają się, gdy słońce zejdzie poniżej tej wysokości, i gasną o świcie, gdy ją przekroczy. -2° = połowa zmierzchu cywilnego."
    en: "The lamps switch on when the sun drops below this elevation and switch off at dawn when it rises above it. -2° = half of civil twilight."
    de: "Die Lampen gehen an, wenn die Sonne unter diese Höhe sinkt, und morgens aus, wenn sie sie überschreitet. -2° = Hälfte der bürgerlichen Dämmerung."
  - pl: "Ruch w dzień nic nie zmienia"
    en: "Motion in daytime changes nothing"
    de: "Bewegung am Tag ändert nichts"
  - pl: "Stan lamp według alarmu, ruchu i harmonogramu"
    en: "Lamp state by alarm, motion and schedule"
    de: "Lampenzustand nach Alarm, Bewegung und Zeitplan"
  - pl: "# Koniec ostatniego ruchu: najpóźniejsze przejście czujnika w stan \"brak ruchu\". Po starcie systemu się nie liczy."
    en: "# End of the last motion: the latest change of a sensor to \"no motion\". Not counted after a system start."
    de: "# Ende der letzten Bewegung: der späteste Wechsel eines Sensors zu \"keine Bewegung\". Nach einem Systemstart nicht gezählt."
  - pl: "Ruch po zmierzchu albo alarm - pełne światło"
    en: "Motion after dusk or alarm - full light"
    de: "Bewegung nach der Dämmerung oder Alarm - volles Licht"
  - pl: "Harmonogram - lampy świecą"
    en: "Schedule - lamps on"
    de: "Zeitplan - Lampen an"
  - pl: "Lampy zgaszone"
    en: "Lamps off"
    de: "Lampen aus"
  - pl: "Po ostatnim ruchu - czekanie do końca pełnego światła"
    en: "After the last motion - waiting until the full light ends"
    de: "Nach der letzten Bewegung - Warten bis zum Ende des vollen Lichts"
