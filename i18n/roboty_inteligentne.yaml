    de: "Neuer Versuch nach fehlgeschlagener oder unterbrochener Reinigung"
  - pl: "Cisza nocna (opcjonalnie)"
    en: "Quiet night (optional)"
    de: "Nachtruhe (optional)"
  - pl: "Przełącznik lub harmonogram. Włączony = żadnego startu, wznowienia ani przypomnień."
    en: "Switch or schedule. On = no start, resume or reminders."
    de: "Schalter oder Zeitplan. Ein = kein Start, keine Fortsetzung und keine Erinnerungen."
  - pl: "Blokady (opcjonalnie)"
    en: "Blockers (optional)"
    de: "Sperren (optional)"
  - pl: "Przełączniki lub czujniki, których stan \"on\" blokuje sprzątanie (goście, urlop)."
    en: "Switches or sensors whose \"on\" state blocks cleaning (guests, holiday)."
    de: "Schalter oder Sensoren, deren Zustand \"on\" die Reinigung sperrt (Gäste, Urlaub)."
  - pl: "Nadzór i powiadomienia"
    en: "Supervision and notifications"
    de: "Überwachung und Benachrichtigungen"
  - pl: "Pełne sprzątanie trwa co najmniej"
    en: "A full cleaning lasts at least"
    de: "Eine vollständige Reinigung dauert mindestens"
  - pl: "Czas od startu do powrotu do stacji."
    en: "Time from start to return to the dock."
    de: "Zeit vom Start bis zur Rückkehr zur Station."
  - pl: "Koniec sprzątania po tylu minutach w stacji"
    en: "Cleaning ends after this many minutes at the dock"
    de: "Reinigung endet nach so vielen Minuten in der Station"
  - pl: "Dłużej niż mycie mopów w trakcie sprzątania."
    en: "Longer than mop washing during cleaning."
    de: "Länger als das Mopp-Waschen während der Reinigung."
  - pl: "Pełne sprzątanie - co najmniej taki procent typowej powierzchni"
    en: "Full cleaning - at least this percentage of the typical area"
    de: "Vollständige Reinigung - mindestens dieser Prozentsatz der typischen Fläche"
  - pl: "Typowa powierzchnia to mediana z 5 ostatnich pełnych sprzątań."
    en: "The typical area is the median of the last 5 full cleanings."
    de: "Die typische Fläche ist der Median der letzten 5 vollständigen Reinigungen."
  - pl: "Limit czasu sprzątania (potem powrót do stacji)"
