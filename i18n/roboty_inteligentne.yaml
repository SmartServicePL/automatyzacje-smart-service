  - pl: "Wyłączone = zwykły start o dowolnej porze (poza ciszą nocną)."
    en: "Off = regular start at any time (outside quiet night)."
    de: "Aus = normaler Start zu jeder Zeit (außerhalb der Nachtruhe)."
  - pl: "Zwykłe okno - początek"
    en: "Regular window - start"
    de: "Normales Fenster - Beginn"
  - pl: "Zwykłe okno - koniec (najpóźniejszy start)"
    en: "Regular window - end (latest start)"
    de: "Normales Fenster - Ende (spätester Start)"
  - pl: "Zwykłe okno tylko w wybrane dni"
