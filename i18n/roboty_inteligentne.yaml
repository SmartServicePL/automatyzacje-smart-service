    de: "Nur das normale Fenster, unabhängig von Anwesenheit"
  - pl: "Domownicy"
    en: "Household members"
    de: "Hausbewohner"
  - pl: "Osoby (person) z działającym lokalizatorem. Stan nieznany krócej niż dobę"
    en: "People (person) with a working tracker. An unknown state for less than a day"
    de: "Personen (person) mit funktionierendem Tracker. Ein unbekannter Zustand kürzer als einen Tag"
  - pl: "liczy się jako obecność. Nie wybieraj czujników ruchu w domu ze zwierzętami."
    en: "counts as presence. Do not choose motion sensors in a home with pets."
    de: "zählt als Anwesenheit. Wählen Sie keine Bewegungsmelder in einem Haus mit Haustieren."
  - pl: "Pomijaj domowników ze stanem nieznanym dłużej niż dobę"
    en: "Skip household members whose state is unknown for more than a day"
    de: "Hausbewohner überspringen, deren Zustand länger als einen Tag unbekannt ist"
  - pl: "Start po tylu minutach pustego domu"
