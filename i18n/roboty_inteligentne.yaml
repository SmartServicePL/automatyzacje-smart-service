  - pl: "Pusty dom - koniec okna (najpóźniejszy start)"
    en: "Empty home - window end (latest start)"
    de: "Leeres Haus - Fensterende (spätester Start)"
  - pl: "Pusty dom - wystarczy taki procent progu brudu"
