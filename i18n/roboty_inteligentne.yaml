# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Smart Service - inteligentny robot sprzątający"
    en: "Smart Service - smart cleaning robot"
    de: "Smart Service - intelligenter Reinigungsroboter"
  - pl: "Robot sprząta wtedy, gdy w domu jest brudno, a nie według sztywnego harmonogramu."
    en: "The robot cleans when the home is dirty, not on a rigid schedule."
    de: "Der Roboter reinigt, wenn das Zuhause schmutzig ist, nicht nach starrem Zeitplan."
  - pl: "Działa z każdym robotem z encją vacuum. Jedna automatyzacja = jeden robot."
    en: "Works with any robot that has a vacuum entity. One automation = one robot."
    de: "Funktioniert mit jedem Roboter mit vacuum-Entität. Eine Automation = ein Roboter."
  - pl: "Licznik brudu rośnie z czasem, gdy ktoś jest w domu, przy otwieraniu drzwi"
    en: "The dirt counter grows over time, when someone is home, when doors are opened"
    de: "Der Schmutzzähler steigt mit der Zeit, wenn jemand zu Hause ist, beim Öffnen der Türen"
  - pl: "(więcej po deszczu) i przy używaniu kuwety. Robot startuje:"
    en: "(more after rain) and when the litter box is used. The robot starts:"
    de: "(mehr nach Regen) und bei Benutzung der Katzentoilette. Der Roboter startet:"
  - pl: "- w dni i godziny pustego domu, gdy wszyscy wyszli i brud przekroczył część progu,"
    en: "- on empty-home days and hours, when everyone has left and dirt passed part of the threshold,"
    de: "- an Tagen und zu Zeiten des leeren Hauses, wenn alle weg sind und der Schmutz einen Teil der Schwelle erreicht hat,"
  - pl: "- w zwykłym oknie godzin, gdy brud przekroczył cały próg,"
    en: "- in the regular time window, when dirt passed the full threshold,"
    de: "- im normalen Zeitfenster, wenn der Schmutz die volle Schwelle erreicht hat,"
  - pl: "- zawsze po przekroczeniu maksymalnej przerwy między sprzątaniami."
    en: "- always after the maximum gap between cleanings."
    de: "- immer nach Überschreiten der maximalen Pause zwischen Reinigungen."
  - pl: "Nigdy w ciszy nocnej, przy niskiej baterii ani częściej niż ustawiony odstęp."
    en: "Never during quiet night, on low battery or more often than the set interval."
    de: "Nie während der Nachtruhe, bei niedrigem Akku oder öfter als der eingestellte Abstand."
  - pl: "Nadzór: sprzątanie jest wykonane dopiero po powrocie do stacji, gdy robot"
    en: "Supervision: a cleaning counts as done only after returning to the dock, when the robot"
    de: "Überwachung: Eine Reinigung gilt erst nach der Rückkehr zur Station als erledigt, wenn der Roboter"
  - pl: "pracował dość długo i posprzątał typową dla siebie powierzchnię. Pauza bez"
    en: "worked long enough and cleaned its typical area. A pause without"
    de: "lange genug gearbeitet und seine typische Fläche gereinigt hat. Eine Pause ohne"
  - pl: "kodu błędu jest wznawiana, przy błędzie przychodzi powiadomienie i przypomnienia."
    en: "an error code is resumed, an error sends a notification and reminders."
    de: "Fehlercode wird fortgesetzt, bei einem Fehler kommen eine Benachrichtigung und Erinnerungen."
  - pl: "Każda decyzja ma powód zapisany w pomocniku tekstowym."
    en: "Every decision has a reason stored in a text helper."
    de: "Jede Entscheidung hat einen Grund, der in einem Text-Helfer gespeichert wird."
  - pl: "Tryb podglądu: automatyzacja tylko zapisuje, co by zrobiła, i nie wysyła komend."
    en: "Preview mode: the automation only records what it would do and sends no commands."
    de: "Vorschaumodus: Die Automation notiert nur, was sie tun würde, und sendet keine Befehle."
  - pl: "Pomocniki (bez wartości początkowej): Data i godzina, Liczba 0-300,"
    en: "Helpers (without initial value): Date and time, Number 0-300,"
    de: "Helfer (ohne Anfangswert): Datum und Uhrzeit, Zahl 0-300,"
  - pl: "Tekst (maks. 255 znaków) na stan, Tekst (maks. 255 znaków) na powód."
    en: "Text (max. 255 characters) for the state, Text (max. 255 characters) for the reason."
    de: "Text (max. 255 Zeichen) für den Zustand, Text (max. 255 Zeichen) für den Grund."
  - pl: "Robot"
    en: "Robot"
    de: "Roboter"
  - pl: "Bateria robota (opcjonalnie)"
    en: "Robot battery (optional)"
    de: "Akku des Roboters (optional)"
  - pl: "Sensor baterii w procentach. Puste = bez sprawdzania baterii."
    en: "Battery sensor in percent. Empty = no battery check."
    de: "Akkusensor in Prozent. Leer = keine Akkuprüfung."
  - pl: "Minimalna bateria do startu"
    en: "Minimum battery to start"
    de: "Mindestakku für den Start"
  - pl: "Sensor błędu robota (opcjonalnie)"
    en: "Robot error sensor (optional)"
    de: "Fehlersensor des Roboters (optional)"
  - pl: "Sensor z kodem lub opisem błędu. Stan \"OK\", \"0\" lub \"brak\" oznacza brak błędu."
    en: "Sensor with an error code or description. State \"OK\", \"0\" or \"brak\" means no error."
    de: "Sensor mit Fehlercode oder -beschreibung. Zustand \"OK\", \"0\" oder \"brak\" bedeutet kein Fehler."
  - pl: "Sensor alarmów stacji (opcjonalnie)"
    en: "Dock alarm sensor (optional)"
    de: "Sensor für Stationsalarme (optional)"
  - pl: "Sensor problemów stacji (woda, worek, zbiorniki). Stan \"OK\" oznacza brak problemu."
    en: "Sensor for dock problems (water, bag, tanks). State \"OK\" means no problem."
    de: "Sensor für Stationsprobleme (Wasser, Beutel, Behälter). Zustand \"OK\" bedeutet kein Problem."
  - pl: "Sensor posprzątanej powierzchni (opcjonalnie)"
    en: "Cleaned area sensor (optional)"
    de: "Sensor der gereinigten Fläche (optional)"
  - pl: "Powierzchnia bieżącego lub ostatniego sprzątania w m². Służy do rozpoznania pełnego sprzątania."
    en: "Area of the current or last cleaning in m². Used to recognise a full cleaning."
    de: "Fläche der aktuellen oder letzten Reinigung in m². Dient zum Erkennen einer vollständigen Reinigung."
  - pl: "Sensor czasu sprzątania (opcjonalnie)"
    en: "Cleaning time sensor (optional)"
    de: "Sensor der Reinigungsdauer (optional)"
  - pl: "Czas bieżącego lub ostatniego sprzątania (sekundy, minuty lub godziny)."
    en: "Duration of the current or last cleaning (seconds, minutes or hours)."
    de: "Dauer der aktuellen oder letzten Reinigung (Sekunden, Minuten oder Stunden)."
  - pl: "Dopuszczaj start także ze stanu \"bezczynny\""
    en: "Also allow start from the \"idle\" state"
    de: "Start auch aus dem Zustand \"untätig\" erlauben"
  - pl: "Niektóre roboty po naładowaniu raportują \"idle\" zamiast \"docked\". Włącz tylko, jeśli Twój robot tak robi."
    en: "Some robots report \"idle\" instead of \"docked\" after charging. Enable only if your robot does that."
    de: "Manche Roboter melden nach dem Laden \"idle\" statt \"docked\". Nur aktivieren, wenn Ihr Roboter das tut."
  - pl: "Gdy ktoś wróci do pustego domu podczas sprzątania"
    en: "When someone returns to the empty home during cleaning"
    de: "Wenn jemand während der Reinigung ins leere Haus zurückkehrt"
  - pl: "Odeślij robota do stacji (dokończy później)"
    en: "Send the robot to the dock (finishes later)"
    de: "Roboter zur Station schicken (beendet später)"
  - pl: "Wstrzymaj robota (jeśli robot to obsługuje)"
    en: "Pause the robot (if the robot supports it)"
    de: "Roboter pausieren (wenn der Roboter das unterstützt)"
  - pl: "Sprzątaj dalej"
    en: "Keep cleaning"
    de: "Weiter reinigen"
  - pl: "Obszary do sprzątania (opcjonalnie)"
    en: "Areas to clean (optional)"
    de: "Zu reinigende Bereiche (optional)"
  - pl: "Obszary Home Assistant przypisane do segmentów mapy robota. Puste = cały dom."
    en: "Home Assistant areas assigned to the robot's map segments. Empty = whole home."
    de: "Home-Assistant-Bereiche, die den Kartensegmenten des Roboters zugeordnet sind. Leer = ganzes Zuhause."
  - pl: "Wymaga Home Assistant 2026.3+ i robota z obsługą \"Sprzątaj obszar\"."
    en: "Requires Home Assistant 2026.3+ and a robot that supports \"Clean area\"."
    de: "Erfordert Home Assistant 2026.3+ und einen Roboter mit \"Bereich reinigen\"."
  - pl: "Użyj własnych akcji startu zamiast standardowych"
    en: "Use own start actions instead of the standard ones"
    de: "Eigene Startaktionen statt der Standardaktionen verwenden"
  - pl: "Własne akcje startu (opcjonalnie)"
    en: "Own start actions (optional)"
    de: "Eigene Startaktionen (optional)"
  - pl: "Np. usługa integracji producenta z listą pokoi i trybem mopowania. Używane tylko po włączeniu opcji powyżej."
    en: "E.g. a manufacturer integration action with a room list and mopping mode. Used only after enabling the option above."
    de: "Z. B. eine Aktion der Herstellerintegration mit Raumliste und Wischmodus. Nur nach Aktivierung der Option oben verwendet."
  - pl: "Pomocniki (stan automatyzacji)"
    en: "Helpers (automation state)"
    de: "Helfer (Zustand der Automation)"
  - pl: "Pomocnik - najwcześniejszy następny start"
    en: "Helper - earliest next start"
    de: "Helfer - frühester nächster Start"
  - pl: "Pomocnik Data i godzina (z datą i godziną). Automatyzacja sama go ustawia."
    en: "Date and time helper (with date and time). The automation sets it itself."
    de: "Helfer Datum und Uhrzeit (mit Datum und Uhrzeit). Die Automation setzt ihn selbst."
  - pl: "Pomocnik - licznik brudu"
    en: "Helper - dirt counter"
    de: "Helfer - Schmutzzähler"
  - pl: "Pomocnik Liczba (min 0, maks 300). Automatyzacja sama go ustawia."
    en: "Number helper (min 0, max 300). The automation sets it itself."
    de: "Helfer Zahl (min 0, max 300). Die Automation setzt ihn selbst."
  - pl: "Pomocnik - stan robota"
    en: "Helper - robot state"
    de: "Helfer - Roboterzustand"
  - pl: "Pomocnik Tekst o długości maks. 255 znaków. Automatyzacja zapisuje w nim swój stan."
    en: "Text helper with max. length 255 characters. The automation stores its state there."
    de: "Helfer Text mit max. 255 Zeichen. Die Automation speichert darin ihren Zustand."
  - pl: "Pomocnik - powód ostatniej decyzji"
    en: "Helper - reason for the last decision"
    de: "Helfer - Grund der letzten Entscheidung"
  - pl: "Pomocnik Tekst o długości maks. 255 znaków. Tu widać, dlaczego robot sprząta albo czeka."
    en: "Text helper with max. length 255 characters. Shows why the robot cleans or waits."
    de: "Helfer Text mit max. 255 Zeichen. Zeigt, warum der Roboter reinigt oder wartet."
  - pl: "Tryb podglądu"
    en: "Preview mode"
    de: "Vorschaumodus"
  - pl: "Włączony = automatyzacja tylko zapisuje, co by zrobiła, i nie wysyła komend do robota."
    en: "On = the automation only records what it would do and sends no commands to the robot."
    de: "Ein = die Automation notiert nur, was sie tun würde, und sendet keine Befehle an den Roboter."
  - pl: "Licznik brudu"
    en: "Dirt counter"
    de: "Schmutzzähler"
  - pl: "Punkty co godzinę"
    en: "Points every hour"
    de: "Punkte pro Stunde"
  - pl: "Np. 1, gdy w domu są zwierzęta, 0 bez zwierząt."
    en: "E.g. 1 when there are pets at home, 0 without pets."
    de: "Z. B. 1, wenn Haustiere im Haus sind, 0 ohne Haustiere."
  - pl: "Punkty co godzinę, gdy ktoś jest w domu (7-22)"
    en: "Points every hour when someone is home (7-22)"
    de: "Punkte pro Stunde, wenn jemand zu Hause ist (7-22)"
  - pl: "Punkty za otwarcie drzwi"
    en: "Points per door opening"
    de: "Punkte pro Türöffnung"
  - pl: "Punkty za użycie kuwety"
    en: "Points per litter box use"
    de: "Punkte pro Benutzung der Katzentoilette"
  - pl: "Drzwi zewnętrzne (opcjonalnie)"
    en: "Outside doors (optional)"
    de: "Außentüren (optional)"
  - pl: "Każde otwarcie dodaje punkty, po deszczu podwójne."
    en: "Every opening adds points, doubled after rain."
    de: "Jede Öffnung bringt Punkte, nach Regen doppelt."
  - pl: "Opad z ostatnich 24 godzin - źródło główne (opcjonalnie)"
    en: "Rain in the last 24 hours - main source (optional)"
    de: "Niederschlag der letzten 24 Stunden - Hauptquelle (optional)"
  - pl: "Sensor opadu w mm. Gdy podany i dostępny, ma pierwszeństwo. Co najmniej 1 mm = mokro."
    en: "Rain sensor in mm. When set and available, it takes priority. At least 1 mm = wet."
    de: "Niederschlagssensor in mm. Wenn angegeben und verfügbar, hat er Vorrang. Mindestens 1 mm = nass."
  - pl: "Deszcz teraz - źródło główne (opcjonalnie)"
    en: "Raining now - main source (optional)"
    de: "Regen jetzt - Hauptquelle (optional)"
  - pl: "Czujnik deszczu (włączony = pada) albo sensor intensywności opadu (powyżej 0 = pada)."
    en: "Rain sensor (on = raining) or rain rate sensor (above 0 = raining)."
    de: "Regensensor (ein = es regnet) oder Sensor der Regenintensität (über 0 = es regnet)."
  - pl: "Opad z 24 godzin - zapas (opcjonalnie)"
    en: "Rain in the last 24 hours - fallback (optional)"
    de: "Niederschlag der letzten 24 Stunden - Reserve (optional)"
  - pl: "Sensor opadu w mm, używany, gdy brak źródła głównego. Co najmniej 1 mm = mokro, punkty za drzwi są podwójne."
    en: "Rain sensor in mm, used when there is no main source. At least 1 mm = wet, door points are doubled."
    de: "Niederschlagssensor in mm, verwendet ohne Hauptquelle. Mindestens 1 mm = nass, Türpunkte werden verdoppelt."
  - pl: "Pogoda (opcjonalnie)"
    en: "Weather (optional)"
    de: "Wetter (optional)"
  - pl: "Encja pogody używana, gdy brak źródła głównego i sensora opadu z 24 godzin. Deszcz teraz = mokro."
    en: "Weather entity used when there is no main source and no 24-hour rain sensor. Rain now = wet."
    de: "Wetter-Entität, verwendet ohne Hauptquelle und ohne Niederschlagssensor für 24 Stunden. Regen jetzt = nass."
  - pl: "Licznik użyć kuwety (opcjonalnie)"
    en: "Litter box use counter (optional)"
    de: "Benutzungszähler der Katzentoilette (optional)"
  - pl: "Rosnący licznik użyć kuwety. Spadek (np. zerowanie o północy) jest pomijany."
    en: "Increasing litter box use counter. A drop (e.g. reset at midnight) is ignored."
    de: "Steigender Benutzungszähler der Katzentoilette. Ein Rückgang (z. B. Nullstellung um Mitternacht) wird ignoriert."
  - pl: "Szybkie sprzątanie po tylu użyciach kuwety"
    en: "Quick cleaning after this many litter box uses"
    de: "Schnellreinigung nach so vielen Benutzungen der Katzentoilette"
  - pl: "Obszar szybkiego sprzątania przy kuwecie (opcjonalnie)"
    en: "Quick cleaning area at the litter box (optional)"
    de: "Bereich der Schnellreinigung an der Katzentoilette (optional)"
  - pl: "Wymaga robota z obsługą \"Sprzątaj obszar\". Puste = bez szybkiego sprzątania."
    en: "Requires a robot that supports \"Clean area\". Empty = no quick cleaning."
    de: "Erfordert einen Roboter mit \"Bereich reinigen\". Leer = keine Schnellreinigung."
  - pl: "Własny licznik potrzeby zamiast licznika brudu (opcjonalnie)"
    en: "Own need counter instead of the dirt counter (optional)"
    de: "Eigener Bedarfszähler statt des Schmutzzählers (optional)"
  - pl: "Np. input_number liczony inną automatyzacją. Puste = licznik brudu z tej automatyzacji."
    en: "E.g. an input_number counted by another automation. Empty = dirt counter of this automation."
    de: "Z. B. ein input_number, das eine andere Automation zählt. Leer = Schmutzzähler dieser Automation."
  - pl: "Próg brudu"
    en: "Dirt threshold"
    de: "Schmutzschwelle"
  - pl: "Kiedy sprzątać"
    en: "When to clean"
    de: "Wann reinigen"
  - pl: "Tryb"
    en: "Mode"
    de: "Modus"
  - pl: "Pusty dom z niższym progiem i zwykłe okno"
    en: "Empty home with a lower threshold and the regular window"
    de: "Leeres Haus mit niedrigerer Schwelle und normales Fenster"
  - pl: "Tylko zwykłe okno, bez względu na obecność"
